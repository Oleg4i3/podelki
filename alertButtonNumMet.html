<!DOCTYPE html>
<html lang="uk" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Підключення до відеозустрічі</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <!-- Font Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Custom Colors & Animations */
        :root {
            --ua-blue: #0057B7;
            --ua-yellow: #FFD700;
        }

        /* Glowing Effects */
        .glow-yellow {
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.6), 0 0 10px rgba(255, 215, 0, 0.4);
        }

        .glow-blue {
            box-shadow: 0 0 20px rgba(0, 87, 185, 0.5);
        }

        /* Speech bubble arrow */
        .bubble-arrow::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 8px 8px 0;
            border-style: solid;
            border-color: #FFD700 transparent;
            display: block;
            width: 0;
        }

        /* Custom Checkbox Styling */
        .custom-checkbox {
            appearance: none;
            -webkit-appearance: none;
            width: 26px;
            height: 26px;
            border: 2px solid #FFD700;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            background-color: rgba(0, 87, 185, 0.2);
        }

        .custom-checkbox:checked {
            background-color: #FFD700;
            border-color: #FFD700;
        }

        .custom-checkbox:checked::after {
            content: '';
            position: absolute;
            left: 8px;
            top: 3px;
            width: 7px;
            height: 14px;
            border: solid #003366;
            border-width: 0 3px 3px 0;
            transform: rotate(45deg);
        }

        /* Smooth button position transition when moving */
        .runaway-transition {
            transition: left 0.15s cubic-bezier(0.1, 0.8, 0.3, 1), top 0.15s cubic-bezier(0.1, 0.8, 0.3, 1), transform 0.1s ease;
        }

        .calm-transition {
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Custom Ripple Animation */
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        .pulse-active {
            animation: pulse-ring 2s infinite ease-in-out;
        }
    </style>
</head>
<body class="h-full bg-gradient-to-br from-[#002B66] via-[#004094] to-[#001838] text-white flex items-center justify-center p-4 relative overflow-hidden">

    <!-- Background Ambient Decorative Elements -->
    <div class="absolute -top-24 -left-24 w-96 h-96 bg-[#0057B7] opacity-30 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-24 -right-24 w-96 h-96 bg-[#FFD700] opacity-20 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Main Content Container Card -->
    <main class="relative w-full max-w-lg bg-white/10 backdrop-blur-xl border border-white/20 rounded-3xl p-6 sm:p-10 shadow-2xl text-center z-10 flex flex-col items-center">
        
        <!-- Header Badge & Icon -->
        <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-[#0057B7]/40 border border-[#FFD700]/40 text-[#FFD700] text-xs font-semibold uppercase tracking-wider mb-6">
            <span class="w-2 h-2 rounded-full bg-[#FFD700] animate-ping"></span>
            Онлайн-зустріч Google Meet
        </div>

        <!-- Google Meet Visual Icon -->
        <div class="w-20 h-20 bg-gradient-to-tr from-[#0057B7] to-[#FFD700] p-0.5 rounded-2xl shadow-lg mb-6 flex items-center justify-center">
            <div class="w-full h-full bg-[#002B66] rounded-[14px] flex items-center justify-center">
                <svg class="w-10 h-10 text-[#FFD700]" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                </svg>
            </div>
        </div>

        <!-- Title and Description -->
        <h1 class="text-2xl sm:text-3xl font-extrabold text-white mb-3 tracking-tight">
            Готові підключитися?
        </h1>
        <p class="text-slate-200 text-sm sm:text-base mb-8 leading-relaxed max-w-sm">
            Будь ласка, підтвердьте згоду з правилами проведення зустрічі, щоб активувати кнопку підключення.
        </p>

        <!-- Checkbox Wrapper Container -->
        <div class="w-full bg-white/5 border border-white/10 rounded-2xl p-4 sm:p-5 mb-8 flex items-center justify-start gap-3.5 hover:bg-white/10 transition-all cursor-pointer group" id="checkbox-card">
            <input type="checkbox" id="confirm-checkbox" class="custom-checkbox shrink-0" aria-label="Підтвердження">
            <label for="confirm-checkbox" class="text-left text-sm sm:text-base font-medium text-slate-100 cursor-pointer leading-snug select-none group-hover:text-white">
                Я підтверджую, що знаходжуся в безпечному місці/укритті і підключаюся до занять добровільно
            </label>
        </div>

        <!-- Button Placeholder Box (Reserves height in grid layout when button becomes floating fixed) -->
        <div id="btn-placeholder" class="w-full h-14 relative flex items-center justify-center">
            
            <!-- Dynamic Floating Button -->
            <a id="runaway-btn" 
               href="https://meet.google.com/oha-suwm-zid" 
               target="_blank" 
               rel="noopener noreferrer"
               tabindex="0"
               class="runaway-transition w-full sm:w-auto min-w-[240px] px-8 py-3.5 bg-gradient-to-r from-[#0057B7] to-[#004094] hover:to-[#003377] border-2 border-[#FFD700] text-[#FFD700] font-bold text-base rounded-2xl shadow-xl flex items-center justify-center gap-2 cursor-pointer focus:outline-none focus:ring-4 focus:ring-[#FFD700]/50 active:scale-95"
               style="position: relative; left: 0px; top: 0px;">
                <span>Підключитися</span>
                <svg id="btn-icon" class="w-5 h-5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                </svg>
            </a>

        </div>

        <!-- Dynamic Speech Bubble / Tooltip -->
        <div id="speech-bubble" class="fixed opacity-0 pointer-events-none bubble-arrow bg-[#FFD700] text-[#002B66] font-extrabold text-xs sm:text-sm px-4 py-2 rounded-xl shadow-2xl z-[10000] transition-opacity duration-200 transform -translate-x-1/2 -translate-y-full whitespace-nowrap">
            Спочатку підтвердь! 😉
        </div>

        <!-- Info Footer -->
        

    </main>

    <script>
        /* Interactive Logic & Mechanics */
        document.addEventListener('DOMContentLoaded', () => {
            const runawayBtn = document.getElementById('runaway-btn');
            const checkbox = document.getElementById('confirm-checkbox');
            const checkboxCard = document.getElementById('checkbox-card');
            const speechBubble = document.getElementById('speech-bubble');
            const btnPlaceholder = document.getElementById('btn-placeholder');

            let isChecked = false;
            let isMoved = false;
            let speechTimeout = null;

            // List of funny phrases in Ukrainian
            const phrases = [
                "Спочатку підтвердь! 😉",
                "Не так швидко! ⚡",
                "Галочку забув 😉",
                "Ой, промазав! 🎯",
                "Без чекбокса нікуди! 🛑",
                "Майже! Але ні 😜",
                "Та став вже ту галочку! ✍️",
                "Хе-хе, втік! 💨",
                "Клавіатура не допоможе! ⌨️"
            ];

            /**
             * Calculates a safe new coordinate for the button away from user input
             */
            function moveButton(cursorX, cursorY) {
                if (isChecked) return;

                const btnRect = runawayBtn.getBoundingClientRect();
                const btnW = btnRect.width || 200;
                const btnH = btnRect.height || 50;

                const padding = 20; // Keep away from screen edges
                const maxW = window.innerWidth - btnW - padding;
                const maxH = window.innerHeight - btnH - padding;

                let newX, newY, distance;
                let attempts = 0;

                // Pick a new position that is far enough from cursor (at least 160px away)
                do {
                    newX = Math.max(padding, Math.random() * maxW);
                    newY = Math.max(padding, Math.random() * maxH);

                    if (cursorX !== undefined && cursorY !== undefined) {
                        const centerX = newX + btnW / 2;
                        const centerY = newY + btnH / 2;
                        distance = Math.hypot(centerX - cursorX, centerY - cursorY);
                    } else {
                        distance = 999;
                    }
                    attempts++;
                } while (distance < 180 && attempts < 25);

                // Convert to fixed positioning on first flee
                if (!isMoved) {
                    runawayBtn.style.position = 'fixed';
                    isMoved = true;
                }

                runawayBtn.style.left = `${newX}px`;
                runawayBtn.style.top = `${newY}px`;
                runawayBtn.style.zIndex = '9999';

                showSpeechBubble(newX, newY, btnW);
            }

            /**
             * Displays funny Ukrainian tooltips above the escaping button
             */
            function showSpeechBubble(btnX, btnY, btnW) {
                const randomPhrase = phrases[Math.floor(Math.random() * phrases.length)];
                speechBubble.innerText = randomPhrase;

                // Position speech bubble centered above button
                const bubbleX = btnX + btnW / 2;
                const bubbleY = btnY - 12;

                speechBubble.style.left = `${bubbleX}px`;
                speechBubble.style.top = `${bubbleY}px`;
                speechBubble.style.opacity = '1';

                clearTimeout(speechTimeout);
                speechTimeout = setTimeout(() => {
                    speechBubble.style.opacity = '0';
                }, 1800);
            }

            function hideSpeechBubble() {
                speechBubble.style.opacity = '0';
                clearTimeout(speechTimeout);
            }

            // --- Mouse Proximity Detection ---
            document.addEventListener('mousemove', (e) => {
                if (isChecked) return;

                const rect = runawayBtn.getBoundingClientRect();
                const btnCenterX = rect.left + rect.width / 2;
                const btnCenterY = rect.top + rect.height / 2;

                const dist = Math.hypot(e.clientX - btnCenterX, e.clientY - btnCenterY);

                // Trigger runaway when mouse gets within 120px
                if (dist < 120) {
                    moveButton(e.clientX, e.clientY);
                }
            });

            // Trigger runaway when directly hovered or clicked
            runawayBtn.addEventListener('mouseover', (e) => {
                if (!isChecked) moveButton(e.clientX, e.clientY);
            });

            runawayBtn.addEventListener('click', (e) => {
                if (!isChecked) {
                    e.preventDefault();
                    moveButton(e.clientX, e.clientY);
                }
            });

            // --- Touch Screen Evasion (Mobile/Tablet) ---
            const handleTouch = (e) => {
                if (isChecked) return;
                
                const touch = e.touches[0] || e.changedTouches[0];
                if (touch) {
                    e.preventDefault();
                    moveButton(touch.clientX, touch.clientY);
                }
            };

            runawayBtn.addEventListener('touchstart', handleTouch, { passive: false });
            runawayBtn.addEventListener('touchmove', handleTouch, { passive: false });

            // --- Keyboard Focus Evasion (Tab / Enter / Space) ---
            runawayBtn.addEventListener('focus', () => {
                if (!isChecked) {
                    moveButton();
                    runawayBtn.blur(); // Remove focus so user cannot press Enter
                }
            });

            runawayBtn.addEventListener('keydown', (e) => {
                if (!isChecked && (e.key === 'Enter' || e.key === ' ')) {
                    e.preventDefault();
                    moveButton();
                    runawayBtn.blur();
                }
            });

            // Card click toggle for convenience
            checkboxCard.addEventListener('click', (e) => {
                if (e.target !== checkbox) {
                    checkbox.checked = !checkbox.checked;
                    checkbox.dispatchEvent(new Event('change'));
                }
            });

            // --- Checkbox Toggle Listener ---
            checkbox.addEventListener('change', () => {
                isChecked = checkbox.checked;

                if (isChecked) {
                    // CALM STATE: Return button back to normal position
                    runawayBtn.classList.remove('runaway-transition');
                    runawayBtn.classList.add('calm-transition');

                    runawayBtn.style.position = 'relative';
                    runawayBtn.style.left = '0px';
                    runawayBtn.style.top = '0px';
                    runawayBtn.style.zIndex = '10';

                    // Update styling to highlighted gold theme
                    runawayBtn.className = "calm-transition w-full sm:w-auto min-w-[240px] px-8 py-3.5 bg-[#FFD700] hover:bg-[#ffe033] text-[#002B66] font-extrabold text-base rounded-2xl shadow-xl flex items-center justify-center gap-2 cursor-pointer glow-yellow pulse-active active:scale-95";

                    hideSpeechBubble();
                    triggerCelebration();

                    isMoved = false;
                } else {
                    // RUNAWAY STATE: Revert to escaping state
                    runawayBtn.classList.remove('calm-transition', 'glow-yellow', 'pulse-active');
                    runawayBtn.classList.add('runaway-transition');

                    runawayBtn.className = "runaway-transition w-full sm:w-auto min-w-[240px] px-8 py-3.5 bg-gradient-to-r from-[#0057B7] to-[#004094] hover:to-[#003377] border-2 border-[#FFD700] text-[#FFD700] font-bold text-base rounded-2xl shadow-xl flex items-center justify-center gap-2 cursor-pointer focus:outline-none focus:ring-4 focus:ring-[#FFD700]/50 active:scale-95";
                }
            });

            /**
             * Fires celebratory confetti with yellow & blue Ukrainian palette
             */
            function triggerCelebration() {
                if (typeof confetti === 'function') {
                    // Left cannon
                    confetti({
                        particleCount: 60,
                        angle: 60,
                        spread: 55,
                        origin: { x: 0, y: 0.7 },
                        colors: ['#FFD700', '#0057B7', '#FFFFFF', '#38BDF8']
                    });
                    // Right cannon
                    confetti({
                        particleCount: 60,
                        angle: 120,
                        spread: 55,
                        origin: { x: 1, y: 0.7 },
                        colors: ['#FFD700', '#0057B7', '#FFFFFF', '#38BDF8']
                    });
                }
            }

            // Adjust position if window is resized while button is runaway
            window.addEventListener('resize', () => {
                if (!isChecked && isMoved) {
                    moveButton();
                }
            });
        });
    </script>
</body>
</html>
