            let sel = getSelectionIndices();

            const timeStr = document.getElementById('timeSig').value;
            const [num, den] = timeStr.split('/').map(Number);
            const measureCapacity = num * (4 / den);

            let maxEndQ = 0;
            let rawTimeline = [];
            let pedalEventsPerVoice = {};

            for (let vKey in voicesData) {
                if (!voicesData[vKey].active) continue;
                let voice = voicesData[vKey];
                let currentQ = 0;
                pedalEventsPerVoice[vKey] = [];
                for (let n of voice.notes) {
                    if (n.type !== 'directive' && n.type !== 'barline') {
                        if (n.pitches && n.pitches[0].pitch !== 'z') {
                            rawTimeline.push({ 
                                voiceId: vKey, 
                                scoreStartQ: currentQ, 
                                duration: n.durationInQuarters, 
                                pitches: n.pitches, 
                                program: voice.program, 
                                articulations: n.articulations || [],

                            });

                        if (n.pedalStart) pedalEventsPerVoice[vKey].push({ time: currentQ, type: 'on' });
                        if (n.pedalEnd) pedalEventsPerVoice[vKey].push({ time: currentQ, type: 'off' });
                        if (n.durationInQuarters) currentQ += n.durationInQuarters;
                    }
                }
                if (currentQ > maxEndQ) maxEndQ = currentQ;
                pedalEventsPerVoice[vKey].sort((a, b) => a.time - b.time);
            }

            if (rawTimeline.length === 0) return;

            // Apply dynamics propagation for playback
            let lastDynamicPerVoice = {};
            for (let note of rawTimeline) {
                let dyn = note.articulations.find(a => ['ppp','pp','p','mp','mf','f','ff','fff'].includes(a));
                if (dyn) lastDynamicPerVoice[note.voiceId] = dyn;
                else if (lastDynamicPerVoice[note.voiceId] && !note.articulations.includes('staccato') && !note.articulations.includes('accent')) {
                    if (!note.articulations) note.articulations = [];
                    if (!note.articulations.includes(lastDynamicPerVoice[note.voiceId])) note.articulations.push(lastDynamicPerVoice[note.voiceId]);
                }
            }

            // Apply pedal extension
            let modifiedTimeline = [];
            for (let note of rawTimeline) {
                let noteCopy = { ...note, pitches: note.pitches.map(p => ({ ...p })) };
                let voicePedal = pedalEventsPerVoice[note.voiceId] || [];
                if (voicePedal.length > 0) {
                    let pedalActive = false;
                    let nextOff = null;
                    for (let ev of voicePedal) {
                        if (ev.type === 'on' && ev.time <= note.scoreStartQ + 0.001) pedalActive = true;
                        if (ev.type === 'off' && ev.time > note.scoreStartQ) {
                            nextOff = ev;
                            break;
                        }
                    }
                    if (pedalActive && nextOff) {
                        let newDuration = nextOff.time - note.scoreStartQ;
                        if (isFinite(newDuration) && newDuration > note.duration) {
                            noteCopy.duration = newDuration;
                        }
                    }
                }
                modifiedTimeline.push(noteCopy);
            }
            rawTimeline = modifiedTimeline;

            maxEndQ = 0;
            for (let note of rawTimeline) {
                let end = note.scoreStartQ + note.duration;
                if (isFinite(end) && end > maxEndQ) maxEndQ = end;
            }

            let sequence = buildNavigationSequence(measureCapacity, maxEndQ);
            if (!sequence) {
                let mCount = Math.ceil(maxEndQ / measureCapacity);
                sequence = Array.from({length: mCount}, (_, i) => i);
            }

            let unrolledTimeline = [];
            let currentUnrolledQ = 0;
            for (let seqM of sequence) {
                let mStartQ = seqM * measureCapacity;
                let mEndQ = mStartQ + measureCapacity;
                let notesInMeasure = rawTimeline.filter(n => n.scoreStartQ >= mStartQ - 0.001 && n.scoreStartQ < mEndQ - 0.001);
                notesInMeasure.sort((a,b) => a.scoreStartQ - b.scoreStartQ);
                for (let n of notesInMeasure) {
                    let offset = n.scoreStartQ - mStartQ;
                    unrolledTimeline.push({ ...n, playStartQ: currentUnrolledQ + offset });
                }
                currentUnrolledQ += measureCapacity;
            }
            unrolledPlaybackMaxQ = currentUnrolledQ;

            let activeNotes = voicesData[activeTrack].notes;
            let selStartScoreQ = 0;
            for(let i=0; i<sel.start; i++) selStartScoreQ += (activeNotes[i].durationInQuarters || 0);
            let selEndScoreQ = selStartScoreQ;
            if (sel.start !== sel.end) {
                for(let i=sel.start; i<=sel.end; i++) selEndScoreQ += (activeNotes[i].durationInQuarters || 0);
            }

            let playBoundaryStart = 0, playBoundaryEnd = unrolledPlaybackMaxQ;
            let firstMatch = unrolledTimeline.find(n => Math.abs(n.scoreStartQ - selStartScoreQ) < 0.001);
            if (firstMatch) playBoundaryStart = firstMatch.playStartQ;
            if (sel.start !== sel.end) {
                let lastMatch = [...unrolledTimeline].reverse().find(n => n.scoreStartQ < selEndScoreQ - 0.001 && n.scoreStartQ >= selStartScoreQ);
                if (lastMatch) playBoundaryEnd = lastMatch.playStartQ + lastMatch.duration;
            }

            unrolledTimeline = unrolledTimeline.filter(n => n.playStartQ >= playBoundaryStart && n.playStartQ < playBoundaryEnd);
            unrolledTimeline = mergeTiedNotes(unrolledTimeline);
            if (unrolledTimeline.length === 0) return;

            isPreparingPlayback = true;
            let playBtn = document.getElementById('playBtn');
            playBtn.classList.add('loading');
            playBtn.innerText = '⏳ Load...';

            try {
                await ensureAudioAndPreload();

                isPreparingPlayback = false;
                playBtn.classList.remove('loading');
                playBtn.classList.add('playing');
                playBtn.innerText = '▶ Playing';

                playStartAcTime = audioContext.currentTime;
                buildCursorTrack(sequence, measureCapacity, playBoundaryStart, playBoundaryEnd);

                let secondsPerQuarter = 60 / currentTempo;
                const dynMap = {
                    'ppp': 0.2, 'pp': 0.3, 'p': 0.5, 'mp': 0.6,
                    'mf': 0.7, 'f': 0.8, 'ff': 0.9, 'fff': 1.0
                };

                for (let note of unrolledTimeline) {
                    let playTimeAc = playStartAcTime + (note.playStartQ - playBoundaryStart) * secondsPerQuarter;
                    let inst = loadedInstruments[note.program];
                    if (inst && inst !== "loading") {
                        let dynGain = 1.0;
                        for (let a of note.articulations) {
                            if (dynMap[a] !== undefined) {
                                dynGain = dynMap[a];
                                break;
                            }

                        let baseGain = note.volume / 100;
                        let finalGain = baseGain * dynGain;

                        for (let p of note.pitches) {
                            let midiNote = abcPitchToMidi(p.pitch, p.octave, p.accidental);
                            if (midiNote) midiNote += 12;

                                    let points = note.bend.points;
                                    let maxCents = note.bend.maxCents;

                                    let endTime = playTimeAc + durSeconds;
                                    source.playbackRate.setValueAtTime(1.0, startTime);
                                    const fps = 30;
                                    let totalFrames = Math.max(2, Math.floor(durSeconds * fps));
                                    for (let i = 0; i <= totalFrames; i++) {
                                        let progress = i / totalFrames;
                                        let time = startTime + progress * durSeconds;
                                        let y = 0.5;
                                        if (progress <= 0) y = points[0].y;
                                        else if (progress >= 1) y = points[8].y;
                                        else {
                                            let idx = Math.floor(progress * 8);
                                            let t = (progress * 8) - idx;
                                            y = points[idx].y + (points[idx+1].y - points[idx].y) * t;

                                        let centsOffset = (0.5 - y) * 2 * maxCents;

        function buildCursorTrack(sequence, measureCapacity, playBoundaryStart, playBoundaryEnd) {
            currentCursorTrack = [];
            let activeKeys = Object.keys(voicesData).filter(k => voicesData[k].active);
            if (activeKeys.length === 0 || !activeTrack) return;
            let refVoiceKey = activeTrack;
            let visualElements = Array.from(document.querySelectorAll(`.abcjs-v${activeKeys.indexOf(refVoiceKey)}.abcjs-note, .abcjs-v${activeKeys.indexOf(refVoiceKey)}.abcjs-rest`));
            let currentQ = 0, noteMap = [], visIdx = 0;
            for (let n of voicesData[refVoiceKey].notes) {
                if (n.type === 'directive' || n.type === 'barline') continue;
                if (n.pitches && n.pitches[0].pitch === 'x') { currentQ += (n.durationInQuarters || 0); continue; }
                if (visIdx < visualElements.length) {
                    noteMap.push({ scoreStartQ: currentQ, duration: n.durationInQuarters || 0, el: visualElements[visIdx], measureIdx: Math.floor((currentQ + 0.001) / measureCapacity) });
                }
                currentQ += (n.durationInQuarters || 0); visIdx++;
            }
            let playbackQ = 0;
            for (let seqM of sequence) {
                let mNotes = noteMap.filter(n => n.measureIdx === seqM);
                for (let mn of mNotes) if (mn.el) {
                    let offset = mn.scoreStartQ - (seqM * measureCapacity);
                    let pStart = playbackQ + offset, pEnd = pStart + mn.duration;
                    if (pEnd > playBoundaryStart && pStart < playBoundaryEnd) currentCursorTrack.push({ playStartQ: pStart, playEndQ: pEnd, el: mn.el });
                }
                playbackQ += measureCapacity;
            }
            currentCursorTrack.sort((a,b) => a.playStartQ - b.playStartQ);
        }

        function animateCursor(playBoundaryStart, playBoundaryEnd) {
            if (!isCustomPlaying || !audioContext) return;

            updateCursorPosition(currentPlayQ);
            playbackAnimationId = requestAnimationFrame(() => animateCursor(playBoundaryStart, playBoundaryEnd));
        }

        function updateCursorPosition(currentPlayQ) {
            if (!currentCursorTrack.length) return;
            let svg = document.querySelector("#paper svg");
            if (!svg) return;
            let svgRect = svg.getBoundingClientRect();
            let itemIdx = currentCursorTrack.findIndex(c => currentPlayQ >= c.playStartQ && currentPlayQ < c.playEndQ);
            if (itemIdx === -1) { if (currentPlayQ < currentCursorTrack[0].playStartQ) itemIdx = 0; else itemIdx = currentCursorTrack.length - 1; }
            let item = currentCursorTrack[itemIdx];
            let rect = item.el.getBoundingClientRect();
            let duration = item.playEndQ - item.playStartQ;
            let progress = duration > 0 ? (currentPlayQ - item.playStartQ) / duration : 0;
            progress = Math.max(0, Math.min(1, progress));
            let nextItem = currentCursorTrack[itemIdx + 1];
            let targetX = rect.right;
            if (nextItem && nextItem.el) {
                let nextRect = nextItem.el.getBoundingClientRect();
                if (Math.abs(nextRect.top - rect.top) < 60) targetX = nextRect.left; 
                else targetX = rect.right + 30; 
            }
            let x = rect.left + (targetX - rect.left) * progress - svgRect.left;
            let staves = Array.from(svg.querySelectorAll('.abcjs-staff'));
            let systems = [], currentSystem = [], lastY = -1000;
            staves.forEach(staff => {
                let r = staff.getBoundingClientRect();

                currentSystem.push(staff); lastY = r.top;
            });
            if (currentSystem.length) systems.push(currentSystem);
            let noteY = rect.top + rect.height / 2;
            let activeSystem = systems.find(sys => { let top = sys[0].getBoundingClientRect().top; let bottom = sys[sys.length - 1].getBoundingClientRect().bottom; return noteY >= top - 40 && noteY <= bottom + 40; }) || systems[0];
            if (!activeSystem) return;
            let y1 = activeSystem[0].getBoundingClientRect().top - svgRect.top;
            let y2 = activeSystem[activeSystem.length - 1].getBoundingClientRect().bottom - svgRect.top;
            let cursor = document.getElementById("custom-cursor");
            if (!cursor) {
                cursor = document.createElementNS("http://www.w3.org/2000/svg", "line");

                cursor.setAttribute("stroke", "#f44336");
                cursor.setAttribute("stroke-width", "2");
                cursor.style.pointerEvents = "none";
                svg.appendChild(cursor);
            }
            cursor.setAttribute("x1", x); cursor.setAttribute("x2", x);
            cursor.setAttribute("y1", y1 - 20); cursor.setAttribute("y2", y2 + 20);
        }

        function stopCustomPlayback() {
            isCustomPlaying = false; isPreparingPlayback = false;

        function getDirectivesMapping(measureCapacity) {
            if (!activeTrack) return { mapping: {}, maxM: 0 };
            let mapping = {}, maxM = 0;
            let notes = voicesData[activeTrack].notes;
            let currentQ = 0;
            for (let n of notes) {
                let mIdx = Math.floor((currentQ + 0.001) / measureCapacity);
                if (n.type === 'directive') { if (!mapping[mIdx]) mapping[mIdx] = []; mapping[mIdx].push(n.text); }
                if (n.durationInQuarters) currentQ += n.durationInQuarters;
                if (mIdx > maxM) maxM = mIdx;
            }
            return { mapping, maxM: Math.max(maxM, Object.keys(measureRepeats).length) };
        }

        function buildNavigationSequence(measureCapacity, maxEndQ) {
            let { mapping: dirs, maxM } = getDirectivesMapping(measureCapacity);
            let measures = Math.max(maxM + 1, Math.ceil(maxEndQ / measureCapacity));
            let hasSegno = false, segnoM = -1, hasCoda = false, codaM = -1, hasFine = false, fineM = -1;
            let alCodaCount = 0, alFineCount = 0, dsCount = 0;
            for(let m=0; m<measures; m++) {
                let mDirs = dirs[m] || [];
                if (mDirs.includes('s')) { hasSegno = true; segnoM = m; }
                if (mDirs.includes('+')) { hasCoda = true; codaM = m; }
                if (mDirs.includes('fine')) { hasFine = true; fineM = m; }
                if (mDirs.includes('DSalfine') || mDirs.includes('DSalcoda')) dsCount++;
                if (mDirs.includes('DCalcoda') || mDirs.includes('DSalcoda')) alCodaCount++;
                if (mDirs.includes('DCalfine') || mDirs.includes('DSalfine')) alFineCount++;
            }
            if (dsCount > 0 && !hasSegno) { alert("Playback Warning: D.S. requires a Segno (𝄋). Playing linearly."); return null; }
            if (alCodaCount > 0 && !hasCoda) { alert("Playback Warning: al Coda requires a Coda (𝄌). Playing linearly."); return null; }
            if (alFineCount > 0 && !hasFine) { alert("Playback Warning: al Fine requires a Fine. Playing linearly."); return null; }
            let volta1s = Object.keys(measureVoltas).filter(m => measureVoltas[m] === 1);
            let volta2s = Object.keys(measureVoltas).filter(m => measureVoltas[m] === 2);
            if (volta2s.length > 0 && volta1s.length === 0) { alert("Playback Warning: Volta 2 requires Volta 1. Playing linearly."); return null; }
            let sequence = [], m = 0, repeatStart = 0, visited = {}, jumpingFromDalSegno = false;
            while(m < measures && m >= 0) {
                if (visited[m] > 5) break; 
                visited[m] = (visited[m] || 0) + 1;
                let repeat = measureRepeats[m], volta = measureVoltas[m], mDirs = dirs[m] || [];
                if (volta === 1 && visited[m] > 1) { let v2 = Object.keys(measureVoltas).find(k => measureVoltas[k] === 2 && parseInt(k) > m); if (v2) { m = parseInt(v2); continue; } }
                if (repeat === 'start' || repeat === 'double') repeatStart = m;
                sequence.push(m);
                if (mDirs.includes('fine') && jumpingFromDalSegno) break; 
                if (mDirs.includes('+') && jumpingFromDalSegno && alCodaCount > 0) { m = codaM; jumpingFromDalSegno = false; continue; }
                if ((repeat === 'end' || repeat === 'double') && visited[m] === 1) { m = repeatStart; continue; }
                if (mDirs.includes('DCalfine')) { m = 0; jumpingFromDalSegno = true; continue; }
                if (mDirs.includes('DCalcoda')) { m = 0; jumpingFromDalSegno = true; continue; }
                if (mDirs.includes('DSalfine')) { m = segnoM; jumpingFromDalSegno = true; continue; }
                if (mDirs.includes('DSalcoda')) { m = segnoM; jumpingFromDalSegno = true; continue; }
                m++;
            }
            return sequence;
        }

        function mergeTiedNotes(timeline) {
            if (timeline.length === 0) return timeline;
            let merged = [], current = null;
            for (let note of timeline) {
                if (current === null) { current = { ...note }; continue; }
                if (current.voiceId === note.voiceId && current.tie && pitchesEqual(current.pitches[0], note.pitches[0])) {
                    current.duration += note.duration;
                    current.articulations = [...new Set([...current.articulations, ...note.articulations])];
                    current.tie = note.tie;
                    if (note.bend) current.bend = note.bend;
                } else { merged.push(current); current = { ...note }; }
            }
            if (current) merged.push(current);
            return merged;
        }

        function pitchesEqual(p1, p2) { return p1.pitch === p2.pitch && p1.octave === p2.octave && p1.accidental === p2.accidental; }

        function abcPitchToMidi(pitch, octaveStr, accidental) {
            if (pitch === 'z') return null;
            const baseMidi = { 'C':48, 'D':50, 'E':52, 'F':53, 'G':55, 'A':57, 'B':59, 'c':60, 'd':62, 'e':64, 'f':65, 'g':67, 'a':69, 'b':71 };
            let midi = baseMidi[pitch];
            if (!midi) return null;
            if (accidental === '^') midi += 1; else if (accidental === '^^') midi += 2; else if (accidental === '_') midi -= 1; else if (accidental === '__') midi -= 2;
            let octShift = 0;
            for (let char of octaveStr) { if (char === ',') octShift -= 12; if (char === "'") octShift += 12; }
            return midi + octShift;
        }

        // ==================== MEASURE SYMBOLS & ARTICULATIONS ====================
        function getCurrentMeasureIndex() {
            if (!activeTrack) return 0;
            let sel = getSelectionIndices();
            if (!sel) return 0;
            let notes = getNotes();
            let totalQuarters = 0;
            for (let i = 0; i < sel.start && i < notes.length; i++) if (notes[i] && notes[i].durationInQuarters) totalQuarters += notes[i].durationInQuarters;
            const time = document.getElementById('timeSig').value;
            const [num, den] = time.split('/').map(Number);
            const measureCapacity = num * (4 / den);
            return Math.floor(totalQuarters / measureCapacity);
        }

        function addRepeatToAllVoices(type) {
            let measureIdx = getCurrentMeasureIndex();
            if (measureRepeats[measureIdx] === type) delete measureRepeats[measureIdx]; else measureRepeats[measureIdx] = type;
            updateScore();
        }

        function addVolta(num) {
            let measureIdx = getCurrentMeasureIndex();
            if (measureVoltas[measureIdx] === num) delete measureVoltas[measureIdx]; else measureVoltas[measureIdx] = num;
            updateScore();
        }

        function addMeasureDirective(text) {
            if (!activeTrack) return;
            let sel = getSelectionIndices(); let pos = (sel && sel.start !== -1) ? sel.start : 0;
            for (let vKey in voicesData) if (voicesData[vKey].active) voicesData[vKey].notes.splice(pos, 0, { type: 'directive', text: text });
            updateScore();
        }

        function addArticulationToSelection(type) {
            if (!activeTrack) return;
            let sel = getSelectionIndices(); if (!sel) return;
            let notes = getNotes(); const dynamics = ['ppp', 'pp', 'p', 'mp', 'mf', 'f', 'ff', 'fff', 'staccato'];
            for (let i = sel.start; i <= sel.end; i++) {
                if (!notes[i] || notes[i].type === 'directive' || notes[i].type === 'barline') continue;
                if (!notes[i].articulations) notes[i].articulations = [];
                if (dynamics.includes(type) && type !== 'staccato' && type !== 'accent') notes[i].articulations = notes[i].articulations.filter(a => !dynamics.includes(a) || a === 'staccato' || a === 'accent');
                let idx = notes[i].articulations.indexOf(type);
                if (idx >= 0) notes[i].articulations.splice(idx, 1); else notes[i].articulations.push(type);
            }
            updateScore();
        }

        function addCrescendo() { addHairpin('crescendo'); }
        function addDiminuendo() { addHairpin('diminuendo'); }
        function addHairpin(type) {
            if (!activeTrack) return;
            let sel = getSelectionIndices(); if (!sel || sel.start === sel.end) return; 
            let notes = getNotes();
            notes.splice(sel.end + 1, 0, { type: 'directive', text: type === 'crescendo' ? '!crescendo)!' : '!diminuendo)!' });
            notes.splice(sel.start, 0, { type: 'directive', text: type === 'crescendo' ? '!crescendo(!' : '!diminuendo(!' });
            selection.start = sel.start; selection.end = sel.end + 2;
            updateScore();
        }

        // ==================== ABC BUILDING & RENDERING ====================
        function buildAbcString() {
            const key = document.getElementById('keySig').value;
            const time = document.getElementById('timeSig').value;
            const tempo = document.getElementById('tempo').value;
            const title = document.getElementById('title').value || 'Untitled';
            const groupSize = parseInt(document.getElementById('beaming').value);
            const [num, den] = time.split('/').map(Number);
            const measureCapacity = num * (4 / den);

            for (let vKey in voicesData) {
                let notes = voicesData[vKey].notes;
                for (let i = 0; i < notes.length; i++) {
                    let n = notes[i];
                    if (n.type === 'directive' || n.type === 'barline') continue;
                    if (n.durationInQuarters !== undefined && isNaN(n.durationInQuarters)) { n.durationInQuarters = 0.25; n.abcUnits = 1; }
                    if (n.abcUnits !== undefined && isNaN(n.abcUnits)) { n.abcUnits = 1; }
                }
            }

            let voicesMeasures = {}, maxMeasures = 0;

            const visibleKeys = Object.keys(voicesData).filter(k => voicesData[k].active && voicesData[k].visible);
            for (let vKey of visibleKeys) {
                let voice = voicesData[vKey];
                let notes = voice.notes;
                let measures = [];
                let currentMeasure = [];
                let currentMeasureLength = 0;
                let measuresCount = 0;
                let activeTripletCount = 0;
                let i = 0;

                while (i < notes.length) {
                    let n = notes[i];
                    if (n.type === 'directive') { currentMeasure.push({ type: 'directive', text: n.text }); i++; continue; }

                    let articulationStr = '';
                    let hasStaccato = false;
                    if (n.articulations && n.articulations.length) {
                        articulationStr = n.articulations.map(a => {
                            if (a === 'staccato') { hasStaccato = true; return ''; }
                            if (a === 'accent') return '!accent!';
                            if (a === 'ppp') return '!ppp!';
                            if (a === 'pp') return '!pp!';
                            if (a === 'p') return '!p!';
                            if (a === 'mp') return '!mp!';
                            if (a === 'mf') return '!mf!';
                            if (a === 'f') return '!f!';
                            if (a === 'ff') return '!ff!';
                            if (a === 'fff') return '!fff!';
                            return '';
                        }).filter(s => s).join(' ');
                        if (articulationStr) articulationStr += ' ';
                    }

                    let prefix = "";
                    if (n.triplet) {
                        if (activeTripletCount === 0) {
                            let consecutiveTriplets = 1;
                            while (i + consecutiveTriplets < notes.length && notes[i + consecutiveTriplets].triplet && consecutiveTriplets < 3) consecutiveTriplets++;
                            if (consecutiveTriplets === 3) { prefix = "(3"; activeTripletCount = 2; }
                            else if (consecutiveTriplets === 2) { prefix = "(2"; activeTripletCount = 1; }
                            else { prefix = "(3:2:1 "; activeTripletCount = 0; }
                        } else activeTripletCount--;
                    } else activeTripletCount = 0;

                    let needTie = false;
                    if (n.tie && i + 1 < notes.length && n.pitches[0].pitch !== 'z' && n.pitches[0].pitch !== 'x') {
                        let next = notes[i + 1];
                        if (next.pitches && next.pitches.length > 0 && n.pitches.length > 0) {
                            let p1 = n.pitches[0], p2 = next.pitches[0];
                            if (p1.pitch !== 'z' && p2.pitch !== 'z' && p1.pitch === p2.pitch && p1.octave === p2.octave && p1.accidental === p2.accidental) needTie = true;
                        }
                    }
                    let tieStr = needTie ? "-" : "";

                    let noteCore = "";
                    if (n.pitches.length > 1) {
                        noteCore += "[";
                        n.pitches.forEach(p => {
                            if (p.pitch === 'x' || p.pitch === 'z') noteCore += p.pitch;
                            else { let acc = p.accidental || ''; let oct = p.octave || ''; noteCore += acc + p.pitch + oct; }
                        });
                        noteCore += `]${n.abcUnits}${tieStr}`;
                    } else {
                        let p = n.pitches[0];
                        if (p.pitch === 'x') noteCore = `x${n.abcUnits}`;
                        else if (p.pitch === 'z') noteCore = `z${n.abcUnits}`;
                        else { let acc = p.accidental || ''; let oct = p.octave || ''; noteCore = `${acc}${p.pitch}${oct}${n.abcUnits}${tieStr}`; }
                    }

                    if (hasStaccato) noteCore = "." + noteCore;

                    if (n.bend) {
                        currentMeasure.push({ type: 'directive', text: '"bend"' });
                    }

                    if (n.pedalStart) { currentMeasure.push({ type: 'directive', text: '!pedal!' }); currentMeasure.push({ type: 'directive', text: '"𝒫ℯ𝒹."' }); }

                    currentMeasure.push({ type: 'note', text: articulationStr + prefix + noteCore, duration: n.durationInQuarters, isInvisible: (n.pitches && n.pitches[0].pitch === 'x') });

                    if (n.pedalEnd) { currentMeasure.push({ type: 'directive', text: '!*pedal!' }); currentMeasure.push({ type: 'directive', text: '"✽"' }); }

                    currentMeasureLength += n.durationInQuarters;
                    i++;

                    if (currentMeasureLength >= measureCapacity - 0.001) {
                        let repeat = measureRepeats[measuresCount];
                        let volta = measureVoltas[measuresCount];
                        measures.push({ items: currentMeasure, repeat: repeat, volta: volta });
                        currentMeasure = []; currentMeasureLength = 0; measuresCount++; activeTripletCount = 0;
                    }
                }

                if (currentMeasure.length > 0 || currentMeasureLength > 0) {
                    let repeat = measureRepeats[measuresCount];
                    let volta = measureVoltas[measuresCount];
                    measures.push({ items: currentMeasure, repeat: repeat, volta: volta });
                    measuresCount++;
                }

                voicesMeasures[vKey] = measures;
                if (measuresCount > maxMeasures) maxMeasures = measuresCount;
            }

            for (let vKey in voicesMeasures) {
                let measures = voicesMeasures[vKey];
                while (measures.length < maxMeasures) measures.push({ items: [], repeat: null, volta: null });
            }

            let abcString = `X:1\nT:${title}\nM:${time}\nL:1/16\nQ:1/4=${tempo}\nK:${key}\n`;
            let voiceStrings = [];

            for (let vKey of visibleKeys) {
                let voice = voicesData[vKey];
                let measures = voicesMeasures[vKey];
                let vStr = `V:${voice.id} clef=${voice.clef} name="${voice.short || voice.name}"\n`;
                vStr += `%%MIDI program ${voice.program}\n`;
                if (measures.length === 0) vStr += "x16 |";
                else {
                    for (let mIdx = 0; mIdx < measures.length; mIdx++) {
                        let measure = measures[mIdx];
                        if (mIdx === 0 || measure.repeat === 'start' || measure.volta) {
                            if (measure.repeat === 'start') vStr += "|: ";
                            if (measure.volta) vStr += `[${measure.volta} `;
                        }
                        if (measure.items.length === 0) vStr += "x16 ";
                        else {
                            let groupCounter = 0;
                            for (let item of measure.items) {
                                if (item.type === 'directive') {
                                    vStr += item.text + " ";
                                    groupCounter = 0;
                                } else {
                                    vStr += item.text;
                                    let durMatch = item.text.match(/\d+/);
                                    if (groupSize > 0 && durMatch && parseInt(durMatch[0]) < 4 && !item.text.includes('z') && !item.text.includes('x')) {
                                        groupCounter++;
                                        if (groupCounter % groupSize === 0) {
                                            vStr += " ";
                                        }
                                    } else {
                                        vStr += " ";
                                        groupCounter = 0;
                                    }
                                }
                            }
                        }
                        let repeat = measure.repeat;
                        if (repeat === 'end') vStr += ":| ";
                        else if (repeat === 'double') vStr += ":: ";
                        else if (repeat === 'final') vStr += "|] ";
                        else vStr += "| ";
                    }
                }
                voiceStrings.push(vStr.trim());
            }

            abcString += voiceStrings.join('\n');
            return abcString;
        }

        function removeEmptyMeasures() {
            const measureCapacity = getMeasureCapacity();
            let activeKeys = Object.keys(voicesData).filter(k => voicesData[k].active);
            if (activeKeys.length === 0) return;
            let voicesMeasures = {};
            for (let vKey of activeKeys) voicesMeasures[vKey] = getMeasuresFromNotes(vKey);
            let maxMeasures = 0;
            for (let vKey of activeKeys) if (voicesMeasures[vKey].length > maxMeasures) maxMeasures = voicesMeasures[vKey].length;
            let emptyMeasures = [];
            for (let m = 0; m < maxMeasures; m++) {
                let empty = true;
                for (let vKey of activeKeys) {
                    let meas = voicesMeasures[vKey][m];
                    if (meas) { for (let item of meas) { let n = item.note; if (n.type === 'directive') { empty = false; break; } if (n.pitches && n.pitches[0].pitch !== 'x') { empty = false; break; } } } else { empty = false; break; }
                    if (!empty) break;
                }
                if (empty) emptyMeasures.push(m);
            }
            if (emptyMeasures.length === 0) return;
            let emptySet = new Set(emptyMeasures);
            for (let vKey of activeKeys) {
                let oldNotes = voicesData[vKey].notes;
                let newNotes = [], cum = 0;
                for (let i = 0; i < oldNotes.length; i++) {
                    let n = oldNotes[i];
                    if (n.type === 'directive' || n.type === 'barline') {
                        let m = Math.floor(cum / measureCapacity);
                        if (!emptySet.has(m)) newNotes.push(n);
                        continue;
                    }
                    if (n.durationInQuarters) {
                        let startMeasure = Math.floor(cum / measureCapacity);
                        if (!emptySet.has(startMeasure)) newNotes.push(n);
                        cum += n.durationInQuarters;
                    }
                }
                voicesData[vKey].notes = newNotes;
            }
            let newRepeats = {}, newVoltas = {};
            for (let r in measureRepeats) { let idx = parseInt(r); let shift = 0; for (let em of emptyMeasures) if (em < idx) shift++; newRepeats[idx - shift] = measureRepeats[idx]; }
            for (let v in measureVoltas) { let idx = parseInt(v); let shift = 0; for (let em of emptyMeasures) if (em < idx) shift++; newVoltas[idx - shift] = measureVoltas[idx]; }
            measureRepeats = newRepeats; measureVoltas = newVoltas;
        }

        function normalizeAllMeasures() {
            const measureCapacity = getMeasureCapacity();
            let activeKeys = Object.keys(voicesData).filter(k => voicesData[k].active);
            for (let vKey of activeKeys) {
                let oldNotes = voicesData[vKey].notes;
                let newNotes = [], currentQ = 0;
                for (let n of oldNotes) {
                    if (n.type === 'directive' || n.type === 'barline') { newNotes.push(n); continue; }
                    if (!n.durationInQuarters) continue;
                    let remaining = n.durationInQuarters;
                    while (remaining > 0.001) {
                        let measureStart = Math.floor(currentQ / measureCapacity) * measureCapacity;
                        let nextMeasureStart = measureStart + measureCapacity;
                        let available = nextMeasureStart - currentQ;
                        let partDur = Math.min(remaining, available);
                        let partNote = { pitches: n.pitches.map(p => ({ ...p })), durationInQuarters: partDur, abcUnits: partDur / 0.25, triplet: n.triplet, tie: (remaining - partDur > 0.001), articulations: n.articulations ? [...n.articulations] : [], pedalStart: n.pedalStart, pedalEnd: n.pedalEnd, bend: n.bend ? JSON.parse(JSON.stringify(n.bend)) : undefined };
                        newNotes.push(partNote);
                        remaining -= partDur;
                        currentQ += partDur;
                    }
                }
                voicesData[vKey].notes = newNotes;
            }
        }

        function updateScore() {
			if (!_skipUndo && !isUndoing) {
             pushUndoState();
             }
            window.lastAbcString = buildAbcString();
            console.log("ABC String:", window.lastAbcString);

                if (n.abcUnits !== undefined && isNaN(n.abcUnits)) n.abcUnits = 1;

        function highlightIncompleteMeasures() {
            document.querySelectorAll('.incomplete-mark').forEach(el => el.remove());
            if (!activeTrack || !voicesData[activeTrack].active) return;
            const measureCapacity = getMeasureCapacity();
            let notes = getNotes();
            let measures = getMeasuresFromNotes(activeTrack);
            let svg = document.querySelector('#paper svg');
            if (!svg) return;
            let bars = Array.from(svg.querySelectorAll('.abcjs-bar'));
            if (bars.length === 0) return;
            let svgRect = svg.getBoundingClientRect();
            let activeKeys = Object.keys(voicesData).filter(k => voicesData[k].active);
            let maxRealMeasure = -1;
            for (let vKey of activeKeys) {
                let vNotes = voicesData[vKey].notes, cum = 0;
                for (let n of vNotes) {
                    if (n.durationInQuarters) {
                        let m = Math.floor(cum / measureCapacity);
                        if (n.pitches && n.pitches[0].pitch !== 'x') if (m > maxRealMeasure) maxRealMeasure = m;
                        cum += n.durationInQuarters;
                    }
                }
            }
            for (let m = 0; m < measures.length; m++) {
                let measure = measures[m];
                let realDur = 0;
                for (let item of measure) { let n = item.note; if (n.pitches && n.pitches[0].pitch !== 'x') realDur += n.durationInQuarters; }
                if (realDur > 0.001 && realDur < measureCapacity - 0.001 && m < maxRealMeasure) {
                    let barElement = bars[m];
                    if (!barElement && m === measures.length - 1) {
                        let lastNote = svg.querySelector('.abcjs-note:last-child, .abcjs-rest:last-child');
                        if (lastNote) { let rect = lastNote.getBoundingClientRect(); let x = rect.right - svgRect.left; let y = rect.top - svgRect.top; addMark(x, y); }
                    } else if (barElement) { let rect = barElement.getBoundingClientRect(); let x = rect.right - svgRect.left; let y = rect.top - svgRect.top; addMark(x, y); }
                }
            }
            function addMark(x, y) { let mark = document.createElement('div'); mark.className = 'incomplete-mark'; mark.style.left = (x + 5) + 'px'; mark.style.top = (y - 10) + 'px'; document.getElementById('paper').appendChild(mark); }
        }

        // ==================== VISUAL SELECTION ====================
        document.getElementById('paper').addEventListener('pointerdown', function(e) {
            let svg = document.querySelector('#paper svg'); if (!svg) return;
            let elements = Array.from(document.querySelectorAll('.abcjs-note, .abcjs-rest, .abcjs-clef, .abcjs-time-signature, .abcjs-key-signature'));
            if (elements.length === 0) return;
            let x = e.clientX; let y = e.clientY;
            let minDistance = Infinity; let closestEl = null;
            elements.forEach((el) => {
                let rect = el.getBoundingClientRect();
                let cx = rect.left + rect.width / 2; let cy = rect.top + rect.height / 2;
                let dist = Math.sqrt(Math.pow(x - cx, 2) + Math.pow((y - cy) * 3, 2));
                if (dist < minDistance) { minDistance = dist; closestEl = el; }
            });
            if (closestEl) {
                let cls = closestEl.getAttribute('class') || '';
                let match = cls.match(/abcjs-v(\d+)/); 
                if (match) {
                    let vIdx = parseInt(match[1]);
                    let activeKeys = Object.keys(voicesData).filter(k => voicesData[k].active);
                    if (vIdx < activeKeys.length) {
                        let targetKey = activeKeys[vIdx];
                        if (activeTrack !== targetKey) changeTrack(targetKey);
                        if (cls.includes('abcjs-clef') || cls.includes('abcjs-time-signature') || cls.includes('abcjs-key-signature')) {
                            selectionAtStart = true; selection.start = 0; selection.end = 0; drawVisualSelection(); return;
                        }
                        let trackEls = Array.from(document.querySelectorAll(`.abcjs-v${vIdx}.abcjs-note, .abcjs-v${vIdx}.abcjs-rest`));
                        let visualToArrayMap = [];
                        let tNotes = voicesData[targetKey].notes;
                        for (let i = 0; i < tNotes.length; i++) {
                            let n = tNotes[i];
                            if (n.type !== 'directive' && n.type !== 'barline' && (!n.pitches || n.pitches[0].pitch !== 'x')) visualToArrayMap.push(i);
                        }
                        let noteMinDist = Infinity; let closestVisIdx = -1;
                        trackEls.forEach((el, idx) => {
                            let rect = el.getBoundingClientRect();
                            let cx = rect.left + rect.width / 2; let cy = rect.top + rect.height / 2;
                            let dist = Math.sqrt(Math.pow(x - cx, 2) + Math.pow(y - cy, 2));
                            if (dist < noteMinDist) { noteMinDist = dist; closestVisIdx = idx; }
                        });
                        if (noteMinDist < 60 && closestVisIdx !== -1) {
                            let actualArrayIdx = visualToArrayMap[closestVisIdx];
                            if (actualArrayIdx !== undefined) {
                                if ((e.shiftKey || isVirtualShift) && selection.start !== -1) {
                                    selection.end = actualArrayIdx;
                                    if (isVirtualShift) { isVirtualShift = false; let vBtn = document.getElementById('btn-vshift'); if (vBtn) vBtn.classList.remove('active'); }
                                } else { selection.start = actualArrayIdx; selection.end = actualArrayIdx; selectionAtStart = false; }
                            }
                        }
                    } else clearSelection();
                    drawVisualSelection();
                }
            } else { clearSelection(); drawVisualSelection(); }
        });

        function drawVisualSelection() {
            document.querySelectorAll('.selection-box').forEach(el => el.remove());

                    }
                }
            }
            if (!sel) return;
            let activeKeys = Object.keys(voicesData).filter(k => voicesData[k].active);
            let vIdx = activeKeys.indexOf(activeTrack); if (vIdx === -1) return;
            let trackEls = Array.from(document.querySelectorAll(`.abcjs-v${vIdx}.abcjs-note, .abcjs-v${vIdx}.abcjs-rest`));
            let paper = document.getElementById('paper');
            let paperRect = paper.getBoundingClientRect();
            let visualToArrayMap = [];
            let tNotes = voicesData[activeTrack].notes;
            for (let i = 0; i < tNotes.length; i++) { let n = tNotes[i]; if (n.type !== 'directive' && n.type !== 'barline' && (!n.pitches || n.pitches[0].pitch !== 'x')) visualToArrayMap.push(i); }
            for (let i = sel.start; i <= sel.end; i++) {
                let visIdx = visualToArrayMap.indexOf(i);
                if (visIdx !== -1 && visIdx < trackEls.length) {
                    let el = trackEls[visIdx];
                    el.querySelectorAll('path').forEach(p => p.setAttribute('fill', '#00bcd4'));
                    let rect = el.getBoundingClientRect();
                    let box = document.createElement('div'); box.className = 'selection-box';
                    let top = rect.top - paperRect.top + paper.scrollTop - 5;
                    let left = rect.left - paperRect.left + paper.scrollLeft - 5;
                    box.style.top = top + 'px'; box.style.left = left + 'px';
                    box.style.width = (rect.width + 10) + 'px'; box.style.height = (rect.height + 10) + 'px';
                    paper.appendChild(box);
                }
            }
        }

        // ==================== KEYBOARD SHORTCUTS ====================
        document.addEventListener('keydown', function(e) {
            if (['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) return;
            if (e.key === ' ' || (e.ctrlKey && e.key.startsWith('Arrow'))) e.preventDefault();
            const keyNoteMap = { 'c':'C', 'd':'D', 'e':'E', 'f':'F', 'g':'G', 'a':'A', 'b':'B', 'z':'z' };
            let letter = e.key.toLowerCase();
            if (keyNoteMap[letter] && !e.ctrlKey) { let rowShift = (e.shiftKey && letter !== 'z') ? 1 : 0; addNoteEx(keyNoteMap[letter], rowShift); return; }
            if (e.key === 'X' || e.key === 'x') { toggleChordMode(); return; }
            if (e.key === 'Delete') { deleteSelection(); return; }
            if (e.key === '3') { toggleTriplet(document.getElementById('mod-trip')); return; }
            if (e.key === ' ') { playCustom(); return; } 
            if (e.key === 't' || e.key === 'T') { tieSelection(); return; }
            if (e.ctrlKey) {
                if (letter === 'c') { copySelection(); e.preventDefault(); return; }
                if (letter === 'v') { pasteSelection(); e.preventDefault(); return; }
                const durOrder = [4.0, 2.0, 1.0, 0.5, 0.25];
                let currentIdx = durOrder.indexOf(currentDurQuarters);
                if (e.key === 'ArrowUp' || e.key === 'ArrowRight') { if (currentIdx > 0) setDur(durOrder[currentIdx - 1], null); }
                if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') { if (currentIdx !== -1 && currentIdx < durOrder.length - 1) setDur(durOrder[currentIdx + 1], null); }
            }
        });

        // ==================== INITIALIZATION ====================
        window.addEventListener('load', function() { 
            populateInstrumentSelect();
            initDefaultChannels();
            updateNoteButtonIcons(); 
            updateScore();
            setupBendCanvasEvents();
        });

       window.addEventListener('resize', function() {
    _skipUndo = true;
    updateScore();
    _skipUndo = false;
});

        window.addEventListener('pointerdown', ensureAudioAndPreload, { once: true });

        async function ensureAudioAndPreload() {
            if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
            if (audioContext.state === 'suspended') await audioContext.resume();
            preloadInstruments();
        }

        async function preloadInstruments() {
            if (!audioContext) return;
            let promises = [];
            for (let vKey in voicesData) {
                if (voicesData[vKey].active) {
                    let prog = voicesData[vKey].program;
                    if (!loadedInstruments[prog]) {
                        loadedInstruments[prog] = "loading";
                        let sfName = gmProgramToSoundfont[prog] || 'acoustic_grand_piano';
                        promises.push(Soundfont.instrument(audioContext, sfName).then(inst => { loadedInstruments[prog] = inst; }).catch(err => { console.error("Soundfont load error:", err); delete loadedInstruments[prog]; }));
                    }
                }
            }
            await Promise.all(promises);
        }

        async function playSingleNote(pitchBase, octaveStr, accidental, durationQuarters, articulations = []) {
            if (!activeTrack || !voicesData[activeTrack].active || pitchBase === 'z') return;
            await ensureAudioAndPreload();
            let prog = voicesData[activeTrack].program;
            let inst = loadedInstruments[prog];
            if (inst && inst !== "loading") {
                let midiNote = abcPitchToMidi(pitchBase, octaveStr, accidental);
                if (midiNote) midiNote += 12;
                if (midiNote) {
                    let tempo = parseInt(document.getElementById('tempo').value) || 120;
                    let durationSeconds = durationQuarters * (60 / tempo);
                    if (articulations.includes('staccato')) durationSeconds *= 0.25;
                    let gain = voicesData[activeTrack].volume / 100;
                    inst.play(midiNote, audioContext.currentTime, { duration: durationSeconds, gain: gain });
                }
            }
        }

        document.getElementById('paper').addEventListener('contextmenu', function(e) {
            e.preventDefault();
            let svg = document.querySelector('#paper svg'); if (!svg) return;
            let elements = Array.from(document.querySelectorAll('.abcjs-note, .abcjs-rest'));
            if (elements.length === 0) return;
            let x = e.clientX; let y = e.clientY;
            let minDistance = Infinity; let closestEl = null;
            elements.forEach((el) => {
                let rect = el.getBoundingClientRect();
                let cx = rect.left + rect.width / 2; let cy = rect.top + rect.height / 2;
                let dist = Math.sqrt(Math.pow(x - cx, 2) + Math.pow((y - cy) * 3, 2));
                if (dist < minDistance) { minDistance = dist; closestEl = el; }
            });
            if (closestEl && minDistance < 60) {
                let cls = closestEl.getAttribute('class') || '';
                let match = cls.match(/abcjs-v(\d+)/);
                if (match) {
                    let vIdx = parseInt(match[1]);
                    let activeKeys = Object.keys(voicesData).filter(k => voicesData[k].active);
                    if (vIdx < activeKeys.length) {
                        let targetKey = activeKeys[vIdx];
                        if (activeTrack !== targetKey) changeTrack(targetKey);
                        let trackEls = Array.from(document.querySelectorAll(`.abcjs-v${vIdx}.abcjs-note, .abcjs-v${vIdx}.abcjs-rest`));
                        let visualToArrayMap = [];
                        let tNotes = voicesData[targetKey].notes;
                        for (let i = 0; i < tNotes.length; i++) { let n = tNotes[i]; if (n.type !== 'directive' && n.type !== 'barline' && (!n.pitches || n.pitches[0].pitch !== 'x')) visualToArrayMap.push(i); }
                        let noteIdx = trackEls.indexOf(closestEl);
                        if (noteIdx !== -1 && noteIdx < visualToArrayMap.length) { let actualArrayIdx = visualToArrayMap[noteIdx]; showContextMenu(e, actualArrayIdx); }
                    }
                }
            }
        });

        // ==================== MUSICXML EXPORT (fixed) ====================
        function downloadMusicXML() {
            let xml = '<?xml version="1.0" encoding="UTF-8"?>\n';
            xml += '<!DOCTYPE score-partwise PUBLIC "-//Recordare//DTD MusicXML 3.1 Partwise//EN" "http://www.musicxml.org/dtds/partwise.dtd">\n';
            xml += '<score-partwise version="3.1">\n';

            xml += '  <part-list>\n';
            const visibleKeys = Object.keys(voicesData).filter(k => voicesData[k].active && voicesData[k].visible);
            visibleKeys.forEach((key, index) => {
                let voice = voicesData[key];
                xml += `    <score-part id="P${index+1}">\n`;
                xml += `      <part-name>${escapeXml(voice.name)}</part-name>\n`;
                xml += `      <part-abbreviation>${escapeXml(voice.short || voice.name.substring(0,3))}</part-abbreviation>\n`;
                xml += `      <score-instrument id="P${index+1}-I1">\n`;
                xml += `        <instrument-name>${gmInstruments.find(i => i.num === voice.program)?.name || 'Piano'}</instrument-name>\n`;
                xml += `      </score-instrument>\n`;
                xml += `      <midi-instrument id="P${index+1}-I1">\n`;
                xml += `        <midi-channel>${index+1}</midi-channel>\n`;
                xml += `        <midi-program>${voice.program}</midi-program>\n`;
                if (voice.notes.some(n => n.bend)) {
                    let maxBend = 0;
                    for (let n of voice.notes) if (n.bend && n.bend.maxCents > maxBend) maxBend = n.bend.maxCents;
                    if (maxBend > 0) {
                        let semitones = Math.ceil(maxBend / 100);
                        xml += `        <pitch-bend>${semitones}</pitch-bend>\n`;
                    }
                }
                xml += `      </midi-instrument>\n`;
                xml += `    </score-part>\n`;
            });
            xml += '  </part-list>\n';

            const measureCapacity = getMeasureCapacity();
            const divisions = 4;
            const tempo = parseInt(document.getElementById('tempo').value) || 120;
            const keySig = document.getElementById('keySig').value;
            const timeSig = document.getElementById('timeSig').value;
            const [beats, beatType] = timeSig.split('/').map(Number);

            visibleKeys.forEach((key, partIndex) => {
                xml += `  <part id="P${partIndex+1}">\n`;
                let voice = voicesData[key];
                let notes = voice.notes;
                let measures = getMeasuresFromNotes(key);
                let measureNumber = 1;
                let currentQ = 0;

                for (let measureItems of measures) {
                    xml += `    <measure number="${measureNumber}">\n`;
                    if (measureNumber === 1) {
                        xml += `      <attributes>\n`;
                        xml += `        <divisions>${divisions}</divisions>\n`;
                        xml += `        <key>\n`;
                        let fifths = keySigToFifths(keySig);
                        xml += `          <fifths>${fifths}</fifths>\n`;
                        xml += `        </key>\n`;
                        xml += `        <time>\n`;
                        xml += `          <beats>${beats}</beats>\n`;
                        xml += `          <beat-type>${beatType}</beat-type>\n`;
                        xml += `        </time>\n`;
                        xml += `        <clef>\n`;
                        xml += `          <sign>${voice.clef === 'treble' ? 'G' : 'F'}</sign>\n`;
                        xml += `          <line>${voice.clef === 'treble' ? 2 : 4}</line>\n`;
                        xml += `        </clef>\n`;
                        xml += `      </attributes>\n`;
                        xml += `      <direction placement="above">\n`;
                        xml += `        <direction-type>\n`;
                        xml += `          <metronome parentheses="no">\n`;
                        xml += `            <beat-unit>quarter</beat-unit>\n`;
                        xml += `            <per-minute>${tempo}</per-minute>\n`;
                        xml += `          </metronome>\n`;
                        xml += `        </direction-type>\n`;
                        xml += `        <sound tempo="${Math.round(60000000/tempo)}"/>\n`;
                        xml += `      </direction>\n`;
                    }

                    measureItems.sort((a,b) => a.index - b.index);
                    let measureDur = 0;
                    for (let item of measureItems) {
                        let n = item.note;
                        if (n.type === 'directive') {
                            if (n.text === '!pedal!' || n.text === '"𝒫ℯ𝒹."') {
                                // handled by pedalStart on notes
                            } else if (n.text === '!*pedal!' || n.text === '"✽"') {
                                // handled by pedalEnd
                            } else {
                                xml += `      <direction placement="above">\n`;
                                xml += `        <direction-type>\n`;
                                xml += `          <words>${escapeXml(n.text)}</words>\n`;
                                xml += `        </direction-type>\n`;
                                xml += `      </direction>\n`;
                            }
                            continue;
                        }
                        let duration = n.durationInQuarters * divisions;
                        let noteType = getNoteType(n.durationInQuarters);
                        let isRest = n.pitches[0].pitch === 'z' || n.pitches[0].pitch === 'x';
                        let isChord = n.pitches.length > 1;
                        let first = true;
                        // Insert pedal directions just before the note
                        if (n.pedalStart) {
                            xml += `      <direction placement="below">\n`;
                            xml += `        <direction-type>\n`;
                            xml += `          <pedal type="start" line="yes"/>\n`;
                            xml += `        </direction-type>\n`;
                            xml += `      </direction>\n`;
                        }
                        if (n.pedalEnd) {
                            xml += `      <direction placement="below">\n`;
                            xml += `        <direction-type>\n`;
                            xml += `          <pedal type="stop" line="yes"/>\n`;
                            xml += `        </direction-type>\n`;
                            xml += `      </direction>\n`;
                        }
                        for (let pitch of n.pitches) {
                            xml += `      <note>\n`;
                            if (!first) xml += `        <chord/>\n`;
                            if (isRest) {
                                xml += `        <rest/>\n`;
                            } else {
                                let step = pitch.pitch;
                                let alter = accidentalToAlter(pitch.accidental);
                                let octave = abcOctaveToNumber(pitch.octave);
                                xml += `        <pitch>\n`;
                                xml += `          <step>${step}</step>\n`;
                                if (alter !== 0) xml += `          <alter>${alter}</alter>\n`;
                                xml += `          <octave>${octave}</octave>\n`;
                                xml += `        </pitch>\n`;
                            }
                            xml += `        <duration>${Math.round(duration)}</duration>\n`;
                            if (n.tie && !first) {
                                xml += `        <tie type="start"/>\n`;
                            } else if (n.tie && first) {
                                xml += `        <tie type="start"/>\n`;
                            }
                            if (n.triplet) {
                                xml += `        <time-modification>\n`;
                                xml += `          <actual-notes>3</actual-notes>\n`;
                                xml += `          <normal-notes>2</normal-notes>\n`;
                                xml += `        </time-modification>\n`;
                            }
                            if (noteType) xml += `        <type>${noteType}</type>\n`;
                            if (n.articulations && n.articulations.length) {
                                xml += `        <notations>\n`;
                                if (n.articulations.includes('staccato')) {
                                    xml += `          <articulations>\n`;
                                    xml += `            <staccato/>\n`;
                                    xml += `          </articulations>\n`;
                                }
                                if (n.articulations.includes('accent')) {
                                    xml += `          <articulations>\n`;
                                    xml += `            <accent/>\n`;
                                    xml += `          </articulations>\n`;
                                }
                                let dyn = n.articulations.find(a => ['ppp','pp','p','mp','mf','f','ff','fff'].includes(a));
                                if (dyn) {
                                    xml += `          <dynamics>\n`;
                                    xml += `            <${dyn}/>\n`;
                                    xml += `          </dynamics>\n`;
                                }
                                if (n.bend) {
                                    xml += `          <technical>\n`;
                                    xml += `            <other-technical>${escapeXml(JSON.stringify(n.bend))}</other-technical>\n`;
                                    xml += `          </technical>\n`;
                                }
                                xml += `        </notations>\n`;
                            }
                            xml += `      </note>\n`;
                            first = false;
                        }
                        measureDur += n.durationInQuarters;
                    }
                    xml += `      <barline location="right">\n`;
                    if (measureRepeats[measureNumber-1] === 'start') {
                        xml += `        <bar-style>light-heavy</bar-style>\n`;
                        xml += `        <repeat direction="forward"/>\n`;
                    } else if (measureRepeats[measureNumber-1] === 'end') {
                        xml += `        <bar-style>light-heavy</bar-style>\n`;
                        xml += `        <repeat direction="backward"/>\n`;
                    } else if (measureRepeats[measureNumber-1] === 'double') {
                        xml += `        <bar-style>light-heavy</bar-style>\n`;
                        xml += `        <repeat direction="forward"/>\n`;
                        xml += `        <repeat direction="backward"/>\n`;
                    } else if (measureRepeats[measureNumber-1] === 'final') {
                        xml += `        <bar-style>light-heavy</bar-style>\n`;
                    } else {
                        xml += `        <bar-style>regular</bar-style>\n`;
                    }
                    xml += `      </barline>\n`;
                    xml += `    </measure>\n`;
                    measureNumber++;
                }
                xml += `  </part>\n`;
            });

            xml += '</score-partwise>';

            let blob = new Blob([xml], { type: 'application/xml' });
            let url = URL.createObjectURL(blob);
            let a = document.createElement('a');
            a.href = url;
            a.download = 'score.musicxml';
            a.click();
            URL.revokeObjectURL(url);
        }

        function escapeXml(unsafe) {
            return unsafe.replace(/[<>&'"]/g, function (c) {
                if (c === '<') return '&lt;';
                if (c === '>') return '&gt;';
                if (c === '&') return '&amp;';
                if (c === "'") return '&apos;';
                if (c === '"') return '&quot;';
                return c;
            });
        }

        function keySigToFifths(key) {
            const map = { 'C':0, 'G':1, 'D':2, 'A':3, 'E':4, 'B':5, 'F#':6, 'C#':7, 'F':-1, 'Bb':-2, 'Eb':-3, 'Ab':-4, 'Db':-5, 'Gb':-6, 'Cb':-7 };
            return map[key] || 0;
        }

        function accidentalToAlter(acc) {
            if (acc === '^') return 1;
            if (acc === '^^') return 2;
            if (acc === '_') return -1;
            if (acc === '__') return -2;
            if (acc === '=') return 0;
            return 0;
        }

        function abcOctaveToNumber(octaveStr) {
            let commas = (octaveStr.match(/,/g) || []).length;
            let apostr = (octaveStr.match(/'/g) || []).length;
            return 4 + apostr - commas;
        }

        function getNoteType(durationInQuarters) {
            if (Math.abs(durationInQuarters - 4.0) < 0.01) return 'whole';
            if (Math.abs(durationInQuarters - 2.0) < 0.01) return 'half';
            if (Math.abs(durationInQuarters - 1.0) < 0.01) return 'quarter';
            if (Math.abs(durationInQuarters - 0.5) < 0.01) return 'eighth';
            if (Math.abs(durationInQuarters - 0.25) < 0.01) return '16th';
            if (Math.abs(durationInQuarters - 0.125) < 0.01) return '32nd';
            return null;
        }

});
