<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>HR Monitor Pro - Scrollable Graph & CSV Export</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none; /* slightly cleaner UX, text selection disabled on buttons */
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', 'Roboto', system-ui, -apple-system, sans-serif;
            background: #0a0c0e;
            color: #ccffcc;
            text-align: center;
            padding-bottom: 20px;
        }

        #hr {
            font-size: 196px;
            font-weight: 800;
            letter-spacing: 4px;
            margin: 12px 0 8px 0;
            text-shadow: 0 0 6px #0f0;
            background: #000000aa;
            display: inline-block;
            padding: 0 24px;
            border-radius: 48px;
            font-family: monospace;
        }

        .control-panel {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin: 16px 10px;
            align-items: center;
        }

        button, .csv-btn {
            background: #1e2a2a;
            border: none;
            color: #0f0;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 60px;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            font-family: inherit;
        }

        button:hover, .csv-btn:hover {
            background: #2c3e3e;
            transform: scale(1.02);
        }

        .recording {
            background: #c0392b;
            color: white;
            box-shadow: 0 0 8px #ff4444;
        }

        .range-wrap {
            background: #11181c;
            padding: 12px 16px;
            border-radius: 28px;
            margin: 12px auto;
            width: fit-content;
            max-width: 94%;
        }

        .range-wrap label {
            font-weight: 500;
            margin-right: 12px;
        }

        input[type="range"] {
            width: 140px;
            margin: 0 6px;
            vertical-align: middle;
            cursor: pointer;
        }

        #zoneLabel {
            background: #000000aa;
            padding: 4px 12px;
            border-radius: 32px;
            font-weight: bold;
            display: inline-block;
            margin-left: 12px;
            font-family: monospace;
        }

        .interval-box {
            background: #11181c;
            padding: 6px 14px;
            border-radius: 40px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .interval-box input {
            width: 65px;
            background: #2c3e3e;
            border: 1px solid #2e8b57;
            color: #0f0;
            font-weight: bold;
            border-radius: 20px;
            padding: 6px;
            text-align: center;
        }

        /* GRAPH CONTAINER with horizontal scroll */
        .graph-scroll-wrapper {
            width: 96%;
            max-width: 1400px;
            margin: 20px auto 10px auto;
            background: #0a0f12;
            border-radius: 20px;
            border: 1px solid #2a4a3a;
            overflow-x: auto;
            overflow-y: hidden;
            position: relative;
            box-shadow: 0 6px 14px rgba(0,0,0,0.5);
        }

        canvas {
            display: block;
            background: #0b0e10;
            width: auto;
            height: 220px;
            cursor: grab;
        }

        .graph-caption {
            font-size: 12px;
            color: #8fbc8f;
            margin-top: 6px;
            text-align: right;
            padding-right: 24px;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin: 16px;
        }

        .csv-btn {
            background: #2c5e3f;
            color: white;
        }

        .csv-btn:hover {
            background: #3e7861;
        }
    </style>
</head>
<body>

<div id="hr">--</div>

<div class="control-panel">
    <button id="connect">🔗 Connect HR</button>
    <button id="recordBtn">⏺ REC OFF</button>
</div>

<div class="interval-box">
    <span>🗣️ Voice every</span>
    <input id="interval" type="number" value="10" min="2" max="60" step="1">
    <span>sec</span>
</div>

<div class="range-wrap">
    <span>🎯 HR zone (green)</span>
    <input id="minZone" type="range" min="40" max="200" value="120">
    <span>–</span>
    <input id="maxZone" type="range" min="40" max="200" value="140">
    <div id="zoneLabel">120 - 140</div>
</div>

<!-- Graph area with horizontal scroll -->
<div class="graph-scroll-wrapper" id="graphScrollWrapper">
    <canvas id="hrCanvas"></canvas>
</div>
<div class="graph-caption">↔️ Scroll horizontally • seconds scale • green = in zone</div>

<div class="toolbar">
    <button id="exportCsvBtn" class="csv-btn">📎 Export CSV</button>
</div>

<script>
    // ---------- DOM elements ----------
    const hrDisplay = document.getElementById("hr");
    const connectBtn = document.getElementById("connect");
    const recordBtn = document.getElementById("recordBtn");
    const minSlider = document.getElementById("minZone");
    const maxSlider = document.getElementById("maxZone");
    const zoneLabel = document.getElementById("zoneLabel");
    const intervalInput = document.getElementById("interval");
    const canvas = document.getElementById("hrCanvas");
    const wrapper = document.getElementById("graphScrollWrapper");

    // ---------- Global state ----------
    let device = null;
    let hrCharacteristic = null;
    let currentHR = 0;            // latest BPM value
    let recording = false;
    let recordingStartTime = null; // timestamp (ms) when recording started
    let hrData = [];               // array of { t: secondsFromStart, hr: bpm }

    // Graph layout constants
    const PX_PER_SECOND = 22;      // 22px per second → good resolution, scrollable
    const LEFT_MARGIN = 52;        // space for Y axis labels (BPM)
    const RIGHT_MARGIN = 28;       // right padding for readability
    const GRAPH_HEIGHT = 220;       // canvas height fixed
    const MIN_BPM = 40;            // display range lower bound
    const MAX_BPM = 190;           // display range upper bound (covers most zones)

    let resizeObserver = null;

    // ---------- Helper: update zone label ----------
    function updateZoneLabel() {
        zoneLabel.innerText = `${minSlider.value} - ${maxSlider.value}`;
        drawGraph();   // redraw segment colors immediately when zone changes
    }
    minSlider.addEventListener("input", updateZoneLabel);
    maxSlider.addEventListener("input", updateZoneLabel);
    updateZoneLabel();

    // ---------- Map BPM to Y coordinate (pixel) ----------
    function bpmToY(bpm) {
        const percent = (bpm - MIN_BPM) / (MAX_BPM - MIN_BPM);
        const clamped = Math.min(1, Math.max(0, percent));
        // Y = bottom margin (20px) + inverted range: 0% = bottom, 100% = top
        const topMargin = 18;
        const bottomMargin = 22;
        const drawingHeight = GRAPH_HEIGHT - topMargin - bottomMargin;
        return topMargin + drawingHeight * (1 - clamped);
    }

    // ---------- Draw grid, axes, seconds labels, HR curve ----------
    function drawGraph() {
        if (!canvas) return;

        // 1) compute total duration (seconds) based on recorded data
        let totalDuration = 0;
        if (hrData.length > 0) {
            totalDuration = Math.max(...hrData.map(p => p.t));
        }
        
        // 2) calculate needed canvas width
        let neededWidth = LEFT_MARGIN + (totalDuration * PX_PER_SECOND) + RIGHT_MARGIN;
        const minWidth = wrapper.clientWidth > 100 ? wrapper.clientWidth : 600;
        const finalWidth = Math.max(minWidth, neededWidth);
        
        // update canvas dimensions (preserve context, will be cleared)
        canvas.width = finalWidth;
        canvas.height = GRAPH_HEIGHT;
        
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // background
        ctx.fillStyle = "#0b0e10";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // ---------- draw horizontal grid (BPM lines) ----------
        ctx.save();
        ctx.font = "11px 'JetBrains Mono', monospace";
        ctx.fillStyle = "#6f9e7a";
        ctx.strokeStyle = "#2c4a3a";
        ctx.lineWidth = 0.8;
        
        // horizontal lines every 10 BPM
        for (let bpm = MIN_BPM; bpm <= MAX_BPM; bpm += 10) {
            const y = bpmToY(bpm);
            if (y < 0 || y > GRAPH_HEIGHT) continue;
            ctx.beginPath();
            ctx.moveTo(LEFT_MARGIN - 6, y);
            ctx.lineTo(canvas.width - 8, y);
            ctx.stroke();
            ctx.fillStyle = "#88cc88";
            ctx.fillText(`${bpm}`, 6, y - 2);
        }
        
        // extra zone markers visual (light background shading)
        const minZone = parseInt(minSlider.value, 10);
        const maxZone = parseInt(maxSlider.value, 10);
        if (minZone < maxZone) {
            const yTopZone = bpmToY(maxZone);
            const yBottomZone = bpmToY(minZone);
            ctx.globalAlpha = 0.2;
            ctx.fillStyle = "#2aff6e";
            ctx.fillRect(LEFT_MARGIN, yTopZone, canvas.width - LEFT_MARGIN - 8, yBottomZone - yTopZone);
            ctx.globalAlpha = 1;
        }
        
        // ---------- draw vertical grid + seconds labels (horizontal axis) ----------
        if (totalDuration > 0.2) {
            // dynamic grid step: aim for 5 to 15 seconds intervals depending on total duration
            let stepSeconds = 5;
            if (totalDuration > 180) stepSeconds = 15;
            else if (totalDuration > 80) stepSeconds = 10;
            else if (totalDuration > 30) stepSeconds = 8;
            else stepSeconds = 5;
            
            ctx.fillStyle = "#9bc48f";
            ctx.font = "10px monospace";
            ctx.textAlign = "center";
            ctx.strokeStyle = "#3a6b4e";
            ctx.lineWidth = 0.6;
            
            for (let t = 0; t <= totalDuration + 0.5; t += stepSeconds) {
                const x = LEFT_MARGIN + t * PX_PER_SECOND;
                if (x < LEFT_MARGIN - 5 || x > canvas.width - RIGHT_MARGIN + 15) continue;
                ctx.beginPath();
                ctx.moveTo(x, 12);
                ctx.lineTo(x, GRAPH_HEIGHT - 12);
                ctx.stroke();
                // draw seconds label
                ctx.fillStyle = "#bed9b3";
                ctx.fillText(`${t}s`, x, GRAPH_HEIGHT - 5);
            }
            
            // extra major grid every 30 seconds optional
            if (totalDuration > 40) {
                ctx.strokeStyle = "#5d8c6b";
                ctx.lineWidth = 0.8;
                for (let t = 0; t <= totalDuration; t += 30) {
                    const x = LEFT_MARGIN + t * PX_PER_SECOND;
                    if (x > LEFT_MARGIN && x < canvas.width - 20) {
                        ctx.beginPath();
                        ctx.moveTo(x, 8);
                        ctx.lineTo(x, GRAPH_HEIGHT - 8);
                        ctx.stroke();
                    }
                }
            }
        } else {
            // placeholder no data grid
            ctx.fillStyle = "#7f8c8d";
            ctx.font = "italic 12px monospace";
            ctx.fillText("⏺ Start recording → data appears", canvas.width/2 - 130, GRAPH_HEIGHT/2);
        }
        
        // ---------- draw the HR curve (color-coded by zone per segment) ----------
        if (hrData.length < 2) {
            ctx.restore();
            return;
        }
        
        const zoneMin = parseInt(minSlider.value, 10);
        const zoneMax = parseInt(maxSlider.value, 10);
        
        // sort by time (safety, data already chronological)
        const points = [...hrData].sort((a,b) => a.t - b.t);
        
        ctx.lineWidth = 2.8;
        ctx.lineJoin = "round";
        ctx.lineCap = "round";
        
        for (let i = 1; i < points.length; i++) {
            const p1 = points[i-1];
            const p2 = points[i];
            
            const x1 = LEFT_MARGIN + p1.t * PX_PER_SECOND;
            const x2 = LEFT_MARGIN + p2.t * PX_PER_SECOND;
            
            // clip points that fall outside visible area (performance & looks)
            if ((x1 < -100 && x2 < -100) || (x1 > canvas.width + 100 && x2 > canvas.width + 100)) continue;
            
            const y1 = bpmToY(p1.hr);
            const y2 = bpmToY(p2.hr);
            
            // segment color: based on SECOND point's zone (classic style)
            const inZone = (p2.hr >= zoneMin && p2.hr <= zoneMax);
            ctx.strokeStyle = inZone ? "#2ecc71" : "#e67e22";
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
        }
        
        // optional: highlight data points as small circles (subtle)
        ctx.fillStyle = "#ffffffaa";
        for (let i = 0; i < points.length; i++) {
            const p = points[i];
            const x = LEFT_MARGIN + p.t * PX_PER_SECOND;
            if (x > LEFT_MARGIN - 8 && x < canvas.width + 12) {
                const y = bpmToY(p.hr);
                ctx.beginPath();
                ctx.arc(x, y, 2.5, 0, Math.PI * 2);
                ctx.fillStyle = "#c0ffc0";
                ctx.fill();
            }
        }
        
        ctx.restore();
        
        // add extra border decoration
        ctx.strokeStyle = "#3e6a4a";
        ctx.lineWidth = 1.2;
        ctx.strokeRect(4, 4, canvas.width - 8, canvas.height - 8);
        
        // Autoscroll logic: if recording active and user is near rightmost edge -> follow new data
        if (recording && wrapper && hrData.length > 5) {
            const scrollLeft = wrapper.scrollLeft;
            const maxScroll = wrapper.scrollWidth - wrapper.clientWidth;
            const atRightEdge = (maxScroll - scrollLeft) <= 35;  // threshold
            if (atRightEdge || maxScroll <= 0) {
                // auto-scroll to the end to show latest beat
                wrapper.scrollLeft = wrapper.scrollWidth;
            }
        }
    }

    // ---------- Add HR data point (with timestamp relative to recording start) ----------
    function addHrDataPoint(bpmValue) {
        if (!recording || recordingStartTime === null) return;
        const nowMs = Date.now();
        const elapsedSec = (nowMs - recordingStartTime) / 1000;
        if (elapsedSec < 0) return;
        
        hrData.push({
            t: elapsedSec,
            hr: bpmValue
        });
        
        // keep data size sane (max ~2 hours of 1Hz data = 7200 points) acceptable
        if (hrData.length > 9000) {
            hrData = hrData.slice(-7000);
        }
        
        drawGraph();    // redraw with new point
    }
    
    // ---------- Clear recording data and reset timeline ----------
    function resetRecordingSession() {
        hrData = [];
        recordingStartTime = null;
        drawGraph();    // clear canvas
    }
    
    // ---------- Start new recording (clear old data, set start time) ----------
    function startNewRecording() {
        resetRecordingSession();
        recordingStartTime = Date.now();
        recording = true;
        recordBtn.textContent = "🔴 REC ON";
        recordBtn.classList.add("recording");
        // potential first HR will come later
        drawGraph();
    }
    
    function stopRecording() {
        recording = false;
        recordBtn.textContent = "⏺ REC OFF";
        recordBtn.classList.remove("recording");
        // do NOT clear data; keep the graph for reference
        drawGraph();   // ensure final view is updated
    }
    
    // ---------- BLE Heart Rate Handler ----------
    function handleHeartRate(event) {
        const value = event.target.value;
        if (!value || value.byteLength < 2) return;
        
        // Heart Rate Measurement characteristic: first byte flags, then HR value (UINT8 or UINT16)
        let hrValue = 0;
        const flags = value.getUint8(0);
        const is16bit = flags & 0x01;
        if (is16bit) {
            hrValue = value.getUint16(1, true);
        } else {
            hrValue = value.getUint8(1);
        }
        
        if (hrValue > 20 && hrValue < 250) {
            currentHR = hrValue;
            hrDisplay.textContent = currentHR;
            
            // Zone coloring for big number display
            const minZ = parseInt(minSlider.value, 10);
            const maxZ = parseInt(maxSlider.value, 10);
            hrDisplay.style.color = (currentHR >= minZ && currentHR <= maxZ) ? "#9bff9b" : "#ff8c5a";
            
            // If recording is active, store with timestamp
            if (recording && recordingStartTime !== null) {
                addHrDataPoint(currentHR);
            } else if (recording && recordingStartTime === null) {
                // edge: if recording true but start time null (should not happen)
                if (recording) {
                    recordingStartTime = Date.now();
                    addHrDataPoint(currentHR);
                }
            }
            
            // Voice announcement based on interval
            voiceAnnounceIfNeeded(currentHR);
        }
    }
    
    // ----- Voice announcement with interval throttle -----
    let lastVoiceTime = 0;
    function voiceAnnounceIfNeeded(hrValue) {
        if (hrValue <= 0) return;
        const intervalSec = parseFloat(intervalInput.value);
        if (isNaN(intervalSec) || intervalSec < 2) return;
        const now = Date.now();
        if (now - lastVoiceTime >= intervalSec * 1000) {
            // cancel ongoing speech to avoid overlap
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(hrValue.toString());
            utterance.rate = 0.9;
            utterance.pitch = 1.0;
            window.speechSynthesis.speak(utterance);
            lastVoiceTime = now;
        }
    }
    
    // ----- Connect to Bluetooth HR device -----
    async function connectHRDevice() {
        if (!navigator.bluetooth) {
            alert("Web Bluetooth not supported. Use Chrome/Edge on HTTPS.");
            return;
        }
        try {
            const btDevice = await navigator.bluetooth.requestDevice({
                filters: [{ services: ['heart_rate'] }]
            });
            device = btDevice;
            const server = await device.gatt.connect();
            const service = await server.getPrimaryService('heart_rate');
            hrCharacteristic = await service.getCharacteristic('heart_rate_measurement');
            await hrCharacteristic.startNotifications();
            hrCharacteristic.addEventListener('characteristicvaluechanged', handleHeartRate);
            connectBtn.textContent = "✅ Connected";
            connectBtn.style.background = "#2c6e3e";
            connectBtn.disabled = false;
            // voice confirmation
            const msg = new SpeechSynthesisUtterance("Heart rate connected");
            window.speechSynthesis.speak(msg);
        } catch (err) {
            console.error(err);
            alert("Connection failed: " + err.message);
            connectBtn.textContent = "⚠️ Connect";
            connectBtn.style.background = "#1e2a2a";
        }
    }
    
    // ---------- Export data as CSV (seconds, BPM) ----------
    function exportToCSV() {
        if (hrData.length === 0) {
            alert("No recorded data. Start recording (REC ON) and receive HR values first.");
            return;
        }
        
        // sort by timestamp just in case
        const sortedData = [...hrData].sort((a,b) => a.t - b.t);
        // header
        let csvRows = [["Time (seconds)", "Heart Rate (BPM)"]];
        for (const point of sortedData) {
            csvRows.push([point.t.toFixed(2), point.hr]);
        }
        
        const csvContent = csvRows.map(row => row.join(",")).join("\n");
        const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
        const link = document.createElement("a");
        const url = URL.createObjectURL(blob);
        const date = new Date();
        const timestamp = `${date.getFullYear()}-${date.getMonth()+1}-${date.getDate()}_${date.getHours()}-${date.getMinutes()}`;
        link.href = url;
        link.setAttribute("download", `hr_record_${timestamp}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        
        // small visual feedback
        const exportBtn = document.getElementById("exportCsvBtn");
        const originalText = exportBtn.innerText;
        exportBtn.innerText = "✅ Exported!";
        setTimeout(() => { exportBtn.innerText = originalText; }, 1500);
    }
    
    // ---------- Recording button toggle logic ----------
    function onRecordToggle() {
        if (!recording) {
            // start new recording: clear previous data, set fresh timeline
            resetRecordingSession();
            recordingStartTime = Date.now();
            recording = true;
            recordBtn.textContent = "🔴 REC ON";
            recordBtn.classList.add("recording");
            drawGraph();
        } else {
            // stop recording, keep data as is
            recording = false;
            recordBtn.textContent = "⏺ REC OFF";
            recordBtn.classList.remove("recording");
            drawGraph(); // final refresh
        }
    }
    
    // ---------- Window resize handling: re-draw graph ----------
    function handleResize() {
        drawGraph();
        // keep scroll position stable, but reflow
        if (recording && hrData.length > 0 && wrapper) {
            // optional auto-scroll to latest if user near right edge
            const maxScroll = wrapper.scrollWidth - wrapper.clientWidth;
            if (wrapper.scrollLeft + wrapper.clientWidth >= maxScroll - 20) {
                wrapper.scrollLeft = wrapper.scrollWidth;
            }
        }
    }
    
    // ---------- INITIALIZE event listeners & observer ----------
    connectBtn.addEventListener("click", connectHRDevice);
    recordBtn.addEventListener("click", onRecordToggle);
    document.getElementById("exportCsvBtn").addEventListener("click", exportToCSV);
    
    window.addEventListener("resize", () => {
        setTimeout(handleResize, 60);
    });
    
    // observer for wrapper size changes (when scroll appears/disappears)
    if (window.ResizeObserver) {
        resizeObserver = new ResizeObserver(() => drawGraph());
        if (wrapper) resizeObserver.observe(wrapper);
    }
    
    // initial draw (empty canvas)
    drawGraph();
    
    // Additionally: when sliders move, we already call drawGraph via updateZoneLabel -> drawGraph.
    // Ensure voice interval respects user changes.
    
    // Clear any stale speech on page unload
    window.addEventListener("beforeunload", () => {
        if (window.speechSynthesis) window.speechSynthesis.cancel();
    });
    
    // extra tooltip: on start recording without connect, show info
    console.log("Ready: connect heart rate monitor, then press REC ON to log timeline");
</script>
</body>
</html>
