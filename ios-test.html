<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PeerJS Quick Connect</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { background: #121212; color: #eee; font-family: sans-serif; padding: 20px; font-size: 16px; }
        .box { background: #1e1e1e; padding: 20px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #333; }
        input { width: 100%; padding: 15px; margin: 10px 0; background: #000; color: #fff; border: 1px solid #555; border-radius: 8px; font-size: 18px; box-sizing: border-box;}
        button { width: 100%; padding: 15px; background: #007aff; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .id-display { font-size: 24px; font-weight: bold; color: #00e676; letter-spacing: 2px; text-align: center; margin: 10px 0; word-break: break-all; }
        #logs { font-family: monospace; font-size: 12px; color: #aaa; margin-top: 20px; }
        .err { color: #ff3b30; } .ok { color: #00e676; }
    </style>
</head>
<body>

<div class="box">
    <div style="text-align:center; color:#888; font-size:14px;">ВАШ ID:</div>
    <div id="myId" class="id-display">...</div>
</div>

<div class="box">
    <div style="text-align:center; color:#888; font-size:14px;">ID ПАРТНЕРА:</div>
    <input type="text" id="partnerId" placeholder="Введите ID собеседника">
    <button onclick="connectToPeer()">ПОДКЛЮЧИТЬСЯ</button>
</div>

<div class="box">
    <div style="text-align:center; color:#888; font-size:14px;">ЧАТ / ТЕСТ</div>
    <div id="status" style="text-align:center; margin:10px; font-weight:bold; color:#f0ad4e;">Ожидание...</div>
    <button id="pingBtn" style="background:#333; display:none;" onclick="sendMsg('PING')">ОТПРАВИТЬ PING</button>
</div>

<div id="logs"></div>

<script>
    let peer;
    let conn;

    // Генерируем короткий ID для удобства (4 символа)
    // Но PeerJS может потребовать уникальный, поэтому добавляем случайность
    const customId = Math.random().toString(36).substr(2, 5);

    function log(msg, type='') {
        const d = new Date();
        const time = d.toTimeString().split(' ')[0];
        const el = document.getElementById("logs");
        el.innerHTML = `<div class="${type}">[${time}] ${msg}</div>` + el.innerHTML;
        console.log(msg);
    }

    // 1. Инициализация (Без API ключей, используем Cloud Server от PeerJS)
    log("Подключение к PeerJS Cloud...");
    
    peer = new Peer(customId, {
        debug: 2,
        config: {
            // PeerJS использует дефолтные Google STUN. 
            // Иногда они добавляют свои TURN, но это "черный ящик".
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:global.stun.twilio.com:3478' }
            ]
        }
    });

    peer.on('open', (id) => {
        document.getElementById("myId").innerText = id;
        log("Мой ID получен: " + id, "ok");
        log("Жду соединения...", "ok");
    });

    peer.on('error', (err) => {
        log("ОШИБКА: " + err.type, "err");
        log(err.message, "err");
    });

    peer.on('connection', (c) => {
        log("Входящее соединение от: " + c.peer);
        setupConnection(c);
    });

    function connectToPeer() {
        const pid = document.getElementById("partnerId").value.trim();
        if(!pid) return alert("Введите ID партнера!");
        
        log("Пытаюсь соединиться с " + pid + "...");
        const c = peer.connect(pid);
        setupConnection(c);
    }

    function setupConnection(c) {
        conn = c;
        
        conn.on('open', () => {
            document.getElementById("status").innerText = "ПОДКЛЮЧЕНО!";
            document.getElementById("status").style.color = "#00e676";
            document.getElementById("pingBtn").style.display = "block";
            log("!!! P2P КАНАЛ ОТКРЫТ !!!", "ok");
            
            // Отправляем приветствие
            conn.send("Привет, я тут!");
        });

        conn.on('data', (data) => {
            log("Получено: " + data);
            if(data === 'PING') {
                log("Отправляю PONG...", "ok");
                conn.send("PONG");
            }
        });

        conn.on('close', () => {
            document.getElementById("status").innerText = "ОТКЛЮЧЕНО";
            document.getElementById("status").style.color = "red";
            log("Соединение закрыто.", "err");
        });
        
        conn.on('error', (err) => log("Ошибка соединения: " + err, "err"));
    }

    function sendMsg(msg) {
        if(conn && conn.open) {
            conn.send(msg);
            log("Отправлено: " + msg);
        } else {
            log("Нет связи для отправки.", "err");
        }
    }
</script>

</body>
</html>
