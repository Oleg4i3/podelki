<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebRTC Multi-TURN Test</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        body { background: #fff; color: #000; font-family: monospace; padding: 10px; font-size: 15px; }
        .box { border: 1px solid #333; padding: 15px; margin-bottom: 10px; border-radius: 6px; background: #111; }
        button { width: 100%; padding: 15px; background: #0055ff; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; }
        input { width: 100%; box-sizing: border-box; padding: 10px; background: #222; color: #fff; border: 1px solid #444; margin-bottom: 10px; }
        
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 5px; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .val { font-weight: bold; color: #fff; }
        .good { color: #0f0; } .bad { color: #f00; } .warn { color: orange; }
        
        #logs { height: 250px; overflow-y: scroll; border-top: 1px solid #444; font-size: 11px; color: #aaa; }
        #logs div { margin-bottom: 2px; }
    </style>
</head>
<body>

<div class="box" id="setup">
    <h3 style="margin-top:0">1. Настройка</h3>
    <button onclick="createRoom()">СОЗДАТЬ (HOST)</button>
    <div style="text-align:center; margin:10px; color:#666">--- ИЛИ ---</div>
    <div style="text-align:center; color:#888">Просто откройте ссылку на iPad</div>
</div>

<div class="box" id="active" style="display:none">
    <h3 style="margin-top:0">2. Ссылка для партнера</h3>
    <input id="shareLink" readonly onclick="this.select()">
    <div id="mqttStatus" class="warn">MQTT: Подключение...</div>
</div>

<div class="box">
    <div class="stat-row"><div>Статус:</div> <div id="status" class="warn">IDLE</div></div>
    <div class="stat-row"><div>Тип:</div> <div id="pairType" class="val">-</div></div>
    <div style="margin-top:10px; font-size:11px; color:#888;">НАЙДЕННЫЕ КАНДИДАТЫ:</div>
    <div class="stat-row"><div>SRFLX (STUN):</div> <div id="cntStun" class="val">0</div></div>
    <div class="stat-row"><div>RELAY (TURN):</div> <div id="cntTurn" class="val">0</div></div>
</div>

<div id="logs"></div>

<script>
// === САМЫЙ ПОЛНЫЙ СПИСОК БЕСПЛАТНЫХ СЕРВЕРОВ ===
const rtcConfig = {
    iceServers: [
        // 1. Google STUN (Основа)
        { urls: "stun:stun.l.google.com:19302" },

        // 2. OpenRelay (Популярный, часто банится, но пробуем разные порты)
        { 
            urls: [
                "turn:openrelay.metered.ca:80", 
                "turn:openrelay.metered.ca:443", 
                "turn:openrelay.metered.ca:443?transport=tcp"
            ], 
            username: "openrelayproject", 
            credential: "openrelayproject" 
        },

        // 3. Glitch / Viagenie (Резерв, если доступен)
        // Иногда срабатывает на старых списках
        { 
             urls: "turn:numb.viagenie.ca", 
             username: "webrtc@live.com", 
             credential: "muazkh" 
        }
    ],
    iceCandidatePoolSize: 2,
    bundlePolicy: 'max-bundle'
};

// MQTT (Сигналинг)
const mqttCfg = { host: "broker.emqx.io", port: 8084, path: "/mqtt", useSSL: true };

// --- LOGIC ---
let pc, mqtt;
let myId = "u" + Math.random().toString(16).substr(2, 4);
let roomId = new URLSearchParams(window.location.search).get("room");
let isHost = !roomId;
let cStun = 0, cTurn = 0;

function log(msg, type="") {
    const box = document.getElementById("logs");
    const color = type === 'err' ? 'red' : (type === 'ok' ? '#0f0' : '#ccc');
    box.innerHTML = `<div><span style="color:${color}">></span> ${msg}</div>` + box.innerHTML;
    console.log(msg);
}

window.onload = () => {
    if (roomId) {
        document.getElementById("setup").style.display = 'none';
        log(`Режим: ГОСТЬ. Комната: ${roomId}`);
        initMqtt();
    }
};

function createRoom() {
    roomId = Math.random().toString(36).substr(2, 6);
    const url = location.origin + location.pathname + "?room=" + roomId;
    document.getElementById("setup").style.display = 'none';
    document.getElementById("active").style.display = 'block';
    document.getElementById("shareLink").value = url;
    log(`Создана комната: ${roomId}`);
    initMqtt();
}

function initMqtt() {
    mqtt = new Paho.MQTT.Client(mqttCfg.host, mqttCfg.port, mqttCfg.path, myId);
    mqtt.onConnectionLost = (e) => log("MQTT Lost: " + e.errorMessage, "err");
    mqtt.onMessageArrived = (m) => {
        const d = JSON.parse(m.payloadString);
        if (d.f !== myId) handleSignal(d);
    };
    mqtt.connect({
        useSSL: true,
        onSuccess: () => {
            document.getElementById("mqttStatus").innerText = "MQTT: OK";
            document.getElementById("mqttStatus").className = "good";
            mqtt.subscribe(`rtc-multi/${roomId}`);
            if (!isHost) send({ t: 'hello' });
        }
    });
}

function send(d) {
    d.f = myId;
    mqtt.send(`rtc-multi/${roomId}`, JSON.stringify(d));
}

async function startPeer() {
    log("Запуск WebRTC...", "warn");
    pc = new RTCPeerConnection(rtcConfig);
    
    pc.onicecandidate = (e) => {
        if (e.candidate) {
            const type = e.candidate.type; // host, srflx, relay
            if (type === 'srflx') { cStun++; document.getElementById("cntStun").innerText = cStun; }
            if (type === 'relay') { 
                cTurn++; 
                document.getElementById("cntTurn").innerText = cTurn; 
                document.getElementById("cntTurn").className = "good"; // УРА!
                log("!!! ПОЛУЧЕН TURN КАНДИДАТ !!!", "ok");
            }
            send({ t: 'ice', c: e.candidate });
        }
    };

    pc.oniceconnectionstatechange = () => {
        const s = pc.iceConnectionState;
        const el = document.getElementById("status");
        el.innerText = s.toUpperCase();
        el.className = s === 'connected' ? 'good' : (s === 'failed' ? 'bad' : 'warn');
        
        log(`ICE State: ${s}`);
        if(s === 'connected' || s === 'completed') checkStats();
    };

    if (isHost) {
        const dc = pc.createDataChannel("test");
        dc.onopen = () => log("КАНАЛ ДАННЫХ ОТКРЫТ (P2P РАБОТАЕТ)", "ok");
    }
}

async function handleSignal(d) {
    if (!pc) await startPeer();
    
    try {
        if (d.t === 'hello' && isHost) {
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            send({ t: 'off', s: offer });
        } else if (d.t === 'off' && !isHost) {
            await pc.setRemoteDescription(d.s);
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            send({ t: 'ans', s: answer });
        } else if (d.t === 'ans') {
            await pc.setRemoteDescription(d.s);
        } else if (d.t === 'ice') {
            await pc.addIceCandidate(d.c);
        }
    } catch (e) { log("Err: " + e, "err"); }
}

async function checkStats() {
    const stats = await pc.getStats();
    stats.forEach(rep => {
        if(rep.type === 'candidate-pair' && rep.state === 'succeeded') {
            const loc = stats.get(rep.localCandidateId);
            const rem = stats.get(rep.remoteCandidateId);
            const txt = `${loc.candidateType} <-> ${rem.candidateType}`;
            document.getElementById("pairType").innerText = txt;
            log(`Успешная пара: ${txt}`, "ok");
        }
    });
}
</script>
</body>
</html>
