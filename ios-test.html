<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebRTC Deep Diagnostic</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        body { background: #121212; color: #00ff00; font-family: 'Courier New', monospace; padding: 10px; margin: 0; font-size: 12px; }
        .panel { border: 1px solid #333; padding: 10px; margin-bottom: 10px; background: #1e1e1e; }
        button { width: 100%; padding: 15px; background: #2962ff; color: white; border: none; font-weight: bold; margin-bottom: 5px; font-size: 14px;}
        input { width: 100%; box-sizing: border-box; background: #000; color: #fff; border: 1px solid #555; padding: 8px; }
        .red { color: #ff5252; } .yellow { color: #ffd740; } .green { color: #69f0ae; }
        #log { height: 300px; overflow-y: scroll; white-space: pre-wrap; border-top: 1px solid #333; }
        .candidate-box { border-left: 2px solid #555; padding-left: 5px; margin: 2px 0; font-size: 10px; color: #aaa; }
    </style>
</head>
<body>

<div class="panel">
    <h3 style="margin:0 0 10px 0;">WebRTC NAT SCANNER</h3>
    <div id="controls">
        <button onclick="startHost()">Я ХОСТ (PC/Android)</button>
        <div style="text-align:center; padding:5px;">--- ИЛИ ---</div>
        <div style="color:#aaa; text-align:center;">Если iPad - просто открой ссылку</div>
    </div>
    
    <div id="share" style="display:none">
        Ссылка: <input id="link" readonly onclick="this.select()">
        <div id="mqttStat" class="yellow">MQTT: Connecting...</div>
    </div>
</div>

<div class="panel">
    <div>ICE: <span id="iceState">IDLE</span></div>
    <div>Пары: <span id="connPair">-</span></div>
    <div id="gatheringStatus">Сбор кандидатов: ...</div>
</div>

<div id="log"></div>

<script>
// === РАСШИРЕННЫЙ СПИСОК СЕРВЕРОВ ===
const rtcConfig = {
    iceServers: [
        // 1. Google STUN (стандарт)
        { urls: "stun:stun.l.google.com:19302" },
        { urls: "stun:stun1.l.google.com:19302" },
        
        // 2. OpenRelay TURN (Попытка UDP и TCP)
        { urls: "turn:openrelay.metered.ca:80", username: "openrelayproject", credential: "openrelayproject" },
        { urls: "turn:openrelay.metered.ca:443", username: "openrelayproject", credential: "openrelayproject" },
        { urls: "turn:openrelay.metered.ca:443?transport=tcp", username: "openrelayproject", credential: "openrelayproject" }
    ],
    iceCandidatePoolSize: 4,     // Собираем заранее
    bundlePolicy: 'max-bundle',  // Обязательно для iOS
    iceTransportPolicy: 'all'    // Разрешить всё (не только relay)
};

const mqttCfg = { host: "broker.emqx.io", port: 8084, path: "/mqtt", useSSL: true };
let pc, mqtt, myId = "u" + Math.random().toString(16).substr(2,4);
let roomId = new URLSearchParams(window.location.search).get("r");
let isHost = !roomId;
let candidatesCount = { host: 0, srflx: 0, relay: 0 };

function log(msg, color="") {
    const d = new Date();
    const ts = `${d.getMinutes()}:${d.getSeconds()}.${d.getMilliseconds()}`;
    const el = document.getElementById("log");
    const span = color ? `<span class="${color}">` : "<span>";
    el.innerHTML = `<div><span style="color:#555">[${ts}]</span> ${span}${msg}</span></div>` + el.innerHTML;
}

window.onload = () => {
    if(roomId) {
        document.getElementById("controls").style.display = 'none';
        log(`Роль: ГОСТЬ (iPad?). Комната: ${roomId}`);
        initMqtt();
    }
};

function startHost() {
    roomId = Math.random().toString(36).substr(2,6);
    document.getElementById("controls").style.display = 'none';
    document.getElementById("share").style.display = 'block';
    document.getElementById("link").value = location.origin + location.pathname + "?r=" + roomId;
    log(`Роль: ХОСТ. Комната создана.`);
    initMqtt();
}

function initMqtt() {
    mqtt = new Paho.MQTT.Client(mqttCfg.host, mqttCfg.port, mqttCfg.path, myId);
    mqtt.onConnectionLost = (e) => log("MQTT Lost: " + e.errorMessage, "red");
    mqtt.onMessageArrived = (m) => {
        const d = JSON.parse(m.payloadString);
        if(d.f !== myId) handleSignal(d);
    };
    mqtt.connect({
        useSSL: true,
        onSuccess: () => {
            document.getElementById("mqttStat").innerText = "MQTT: OK";
            document.getElementById("mqttStat").className = "green";
            mqtt.subscribe(`dgn/${roomId}`);
            if(!isHost) send({t:'hello'});
        }
    });
}

function send(d) {
    d.f = myId;
    mqtt.send(`dgn/${roomId}`, JSON.stringify(d));
}

async function createPC() {
    log("Запуск RTCPeerConnection...", "yellow");
    pc = new RTCPeerConnection(rtcConfig);
    
    // === ГЛАВНАЯ ДИАГНОСТИКА: СБОР КАНДИДАТОВ ===
    pc.onicecandidate = (e) => {
        if (e.candidate) {
            const c = e.candidate;
            // Парсинг типа: host (local), srflx (stun), relay (turn)
            const type = c.candidate.match(/typ ([a-z]+)/)?.[1] || "unknown";
            const protocol = c.protocol;
            const port = c.port;
            
            candidatesCount[type] = (candidatesCount[type] || 0) + 1;
            updateGatheringStats();

            log(`Нашел себя: ${type.toUpperCase()} (${protocol}:${port})`, type === 'relay' ? 'green' : '');
            send({t:'ice', c:c});
        } else {
            log("Сбор кандидатов завершен.", "yellow");
        }
    };

    pc.oniceconnectionstatechange = () => {
        const s = pc.iceConnectionState;
        document.getElementById("iceState").innerText = s.toUpperCase();
        document.getElementById("iceState").className = s === 'connected' ? 'green' : (s === 'failed' ? 'red' : 'yellow');
        log(`ICE State changed: ${s}`, s==='failed' ? 'red' : '');
        
        if (s === 'connected') showStats();
    };
    
    // Создаем DataChannel чтобы запустить ICE проверки
    if(isHost) pc.createDataChannel("chat"); 
    else pc.ondatachannel = () => {}; 
}

function updateGatheringStats() {
    document.getElementById("gatheringStatus").innerText = 
        `Host:${candidatesCount.host} | Stun:${candidatesCount.srflx} | Turn:${candidatesCount.relay}`;
}

async function handleSignal(d) {
    if(!pc) await createPC();
    try {
        if(d.t === 'hello' && isHost) {
            log("Гость тут. Создаю Offer...");
            const off = await pc.createOffer();
            await pc.setLocalDescription(off);
            send({t:'off', s:off});
        }
        else if(d.t === 'off' && !isHost) {
            log("Получил Offer. Шлю Answer...");
            await pc.setRemoteDescription(d.s);
            const ans = await pc.createAnswer();
            await pc.setLocalDescription(ans);
            send({t:'ans', s:ans});
        }
        else if(d.t === 'ans' && isHost) {
            log("Получил Answer.");
            await pc.setRemoteDescription(d.s);
        }
        else if(d.t === 'ice') {
            await pc.addIceCandidate(d.c);
            log(`Получил кандидата партнера!`, "yellow");
        }
    } catch(e) { log("ERR: " + e, "red"); }
}

async function showStats() {
    const stats = await pc.getStats();
    stats.forEach(r => {
        if(r.type === 'candidate-pair' && r.state === 'succeeded') {
            const loc = stats.get(r.localCandidateId);
            const rem = stats.get(r.remoteCandidateId);
            const txt = `${loc.candidateType} -> ${rem.candidateType}`;
            document.getElementById("connPair").innerText = txt;
            log(`УСПЕХ! Соединение: ${txt}`, "green");
        }
    });
}
</script>
</body>
</html>
