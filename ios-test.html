<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STUN+TURN iOS Connectivity Test</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        body { font-family: monospace; background: #1a1a1a; color: #0f0; padding: 15px; margin: 0; }
        .box { border: 1px solid #444; padding: 15px; margin-bottom: 15px; border-radius: 8px; background: #222; }
        h3 { margin-top: 0; color: #fff; }
        
        button {
            width: 100%; padding: 15px; font-size: 16px; 
            background: #007aff; color: white; border: none; border-radius: 6px; cursor: pointer;
            margin-bottom: 10px; font-weight: bold;
        }
        button:disabled { background: #555; color: #888; }
        
        input { width: 100%; box-sizing: border-box; padding: 10px; background: #000; color: #fff; border: 1px solid #555; margin-bottom: 10px; }
        
        .status { padding: 5px 10px; display: inline-block; border-radius: 4px; color: #000; font-weight: bold; }
        .wait { background: #ffd700; }
        .ok { background: #32cd32; }
        .fail { background: #ff4500; }
        
        #logArea { height: 200px; overflow-y: scroll; font-size: 11px; border-top: 1px solid #444; padding-top: 5px; opacity: 0.8; }
        
        /* Индикатор работы канала */
        #pingPong {
            text-align: center; font-size: 24px; padding: 20px; border: 2px dashed #555; margin-top: 10px;
        }
        #pingPong.live { border-color: #0f0; background: rgba(0, 255, 0, 0.1); }
    </style>
</head>
<body>

<div class="box">
    <h3>1. Настройка (STUN+TURN)</h3>
    <div id="roleSelect">
        <button onclick="startAsHost()">Я ХОСТ (Создать)</button>
        <div style="text-align:center; margin: 5px;">--- ИЛИ ---</div>
        <div id="guestMsg">Если вы гость, просто откройте ссылку от хоста.</div>
    </div>
    
    <div id="shareSection" style="display:none">
        <label>Ссылка для партнера (iPad):</label>
        <input type="text" id="shareLink" readonly onclick="this.select()">
        <div class="status wait" id="sigStatus">Жду MQTT...</div>
    </div>
</div>

<div class="box">
    <h3>2. Статус P2P</h3>
    <div>ICE State: <span id="iceState" class="status wait">IDLE</span></div>
    <div style="margin-top:5px">Pair: <span id="pairType" style="color:#fff">...</span></div>
    
    <div id="pingPong">НЕТ СВЯЗИ</div>
    <button id="sendBtn" onclick="sendData()" disabled>Отправить PING</button>
</div>

<div id="logArea"></div>

<script>
// === КОНФИГУРАЦИЯ "БРОНЕБОЙНАЯ" ===
// Используем OpenRelay (бесплатный Tier)
const rtcConfig = {
    iceServers: [
        // 1. Google STUN (классика)
        { urls: "stun:stun.l.google.com:19302" },
        
        // 2. OpenRelay TURN (UDP:80)
        { 
            urls: "turn:openrelay.metered.ca:80", 
            username: "openrelayproject", 
            credential: "openrelayproject" 
        },
        // 3. OpenRelay TURN (UDP:443)
        { 
            urls: "turn:openrelay.metered.ca:443", 
            username: "openrelayproject", 
            credential: "openrelayproject" 
        },
        // 4. OpenRelay TURN (TCP:443) - <<< ВАЖНО ДЛЯ iOS
        { 
            urls: "turn:openrelay.metered.ca:443?transport=tcp", 
            username: "openrelayproject", 
            credential: "openrelayproject" 
        }
    ],
    iceCandidatePoolSize: 2,
    bundlePolicy: 'max-bundle'
};

// MQTT (EMQX - WSS/8084)
const mqttCfg = { host: "broker.emqx.io", port: 8084, path: "/mqtt", useSSL: true };

// Глобальные переменные
let pc, dc, mqtt;
let roomId = new URLSearchParams(window.location.search).get("room");
let isHost = !roomId;
let myId = "u" + Math.random().toString(16).substr(2, 4);

// --- ЛОГИРОВАНИЕ ---
function log(msg) {
    const d = new Date().toLocaleTimeString();
    const line = `[${d}] ${msg}`;
    console.log(line);
    const area = document.getElementById("logArea");
    area.innerHTML = `<div>${line}</div>` + area.innerHTML;
}

// --- СТАРТ ---
window.onload = () => {
    if (roomId) {
        document.getElementById("roleSelect").style.display = 'none';
        log(`Режим: ГОСТЬ. Комната: ${roomId}`);
        initMqtt();
    }
};

function startAsHost() {
    roomId = Math.random().toString(36).substr(2, 6);
    const url = location.origin + location.pathname + "?room=" + roomId;
    document.getElementById("roleSelect").style.display = 'none';
    document.getElementById("shareSection").style.display = 'block';
    document.getElementById("shareLink").value = url;
    log(`Режим: ХОСТ. Создана комната: ${roomId}`);
    initMqtt();
}

// --- MQTT SIGNALING ---
function initMqtt() {
    mqtt = new Paho.MQTT.Client(mqttCfg.host, mqttCfg.port, mqttCfg.path, myId);
    
    mqtt.onConnectionLost = (e) => {
        if (e.errorCode !== 0) log("MQTT обрыв: " + e.errorMessage);
    };
    
    mqtt.onMessageArrived = (msg) => {
        const data = JSON.parse(msg.payloadString);
        if (data.from === myId) return;
        handleSignal(data);
    };
    
    mqtt.connect({
        useSSL: true,
        onSuccess: () => {
            log("MQTT Подключен.");
            document.getElementById("sigStatus").innerText = "MQTT OK";
            document.getElementById("sigStatus").className = "status ok";
            mqtt.subscribe(`turn-test/${roomId}`);
            if (!isHost) sendSignal({ type: 'hello' });
        },
        onFailure: (e) => log("MQTT Ошибка: " + e.errorMessage)
    });
}

function sendSignal(data) {
    data.from = myId;
    const msg = new Paho.MQTT.Message(JSON.stringify(data));
    msg.destinationName = `turn-test/${roomId}`;
    mqtt.send(msg);
}

// --- WEBRTC CORE ---
async function createPeer() {
    log("Создание RTCPeerConnection (с TURN)...");
    pc = new RTCPeerConnection(rtcConfig);
    
    pc.onicecandidate = (e) => {
        if (e.candidate) {
            // Логируем тип кандидата для проверки
            // typ host = локальный IP, srflx = STUN, relay = TURN
            const type = e.candidate.candidate.split(' typ ')[1].split(' ')[0];
            // log(`Найден кандидат: ${type}`); 
            sendSignal({ type: 'candidate', candidate: e.candidate });
        }
    };
    
    pc.oniceconnectionstatechange = () => {
        const s = pc.iceConnectionState;
        const el = document.getElementById("iceState");
        el.innerText = s.toUpperCase();
        log(`ICE State: ${s}`);
        
        if (s === 'connected' || s === 'completed') {
            el.className = "status ok";
            checkStats(); // Проверяем, как именно мы соединились
        } else if (s === 'failed') {
            el.className = "status fail";
            log("КРИТИЧЕСКАЯ ОШИБКА: Не удалось пробить NAT даже через TURN.");
        }
    };
    
    // Data Channel
    if (isHost) {
        dc = pc.createDataChannel("test");
        setupDc(dc);
    } else {
        pc.ondatachannel = (e) => setupDc(e.channel);
    }
}

async function handleSignal(data) {
    if (!pc) await createPeer();
    
    try {
        if (data.type === 'hello' && isHost) {
            log("Гость на связи. Создаю Offer...");
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            sendSignal({ type: 'offer', sdp: offer });
        }
        else if (data.type === 'offer' && !isHost) {
            log("Получен Offer. Шлю Answer...");
            await pc.setRemoteDescription(data.sdp);
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            sendSignal({ type: 'answer', sdp: answer });
        }
        else if (data.type === 'answer' && isHost) {
            log("Получен Answer.");
            await pc.setRemoteDescription(data.sdp);
        }
        else if (data.type === 'candidate') {
            await pc.addIceCandidate(data.candidate);
        }
    } catch(e) {
        log("Signal Error: " + e);
    }
}

// --- DATA CHANNEL & UI ---
function setupDc(channel) {
    dc = channel;
    dc.onopen = () => {
        log("КАНАЛ ОТКРЫТ!");
        document.getElementById("sendBtn").disabled = false;
        document.getElementById("pingPong").innerText = "ГОТОВО";
        document.getElementById("pingPong").className = "live";
        // Отключаем MQTT чтобы доказать P2P
        setTimeout(() => { 
            if(mqtt.isConnected()) { mqtt.disconnect(); log("MQTT отключен. Работаем на P2P."); }
        }, 2000);
    };
    dc.onmessage = (e) => {
        log(`Получено: ${e.data}`);
        const box = document.getElementById("pingPong");
        box.innerText = e.data;
        // Анимация
        box.style.background = "#fff";
        setTimeout(() => box.style.background = "rgba(0,255,0,0.1)", 200);
    };
}

function sendData() {
    const msg = isHost ? "PING" : "PONG";
    if (dc && dc.readyState === 'open') {
        dc.send(msg);
        log(`Отправлено: ${msg}`);
    }
}

// --- ДИАГНОСТИКА СОЕДИНЕНИЯ ---
async function checkStats() {
    // Пытаемся понять, идет ли через TURN
    if (!pc) return;
    try {
        const stats = await pc.getStats();
        stats.forEach(report => {
            if (report.type === 'candidate-pair' && report.state === 'succeeded') {
                const local = stats.get(report.localCandidateId);
                const remote = stats.get(report.remoteCandidateId);
                const pairInfo = `${local.candidateType} <-> ${remote.candidateType}`;
                document.getElementById("pairType").innerText = pairInfo;
                log(`Успешная пара: ${pairInfo}`);
                
                if (pairInfo.includes('relay')) {
                    log("УСПЕХ: Используется TURN сервер!");
                } else {
                    log("УСПЕХ: Прямое соединение (или STUN).");
                }
            }
        });
    } catch(e) {
        console.log("Stats error", e);
    }
}

</script>
</body>
</html>
