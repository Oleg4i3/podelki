<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>HR Monitor - Sticky Y-Axis & Scrollable Graph</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0a0c0e;
            font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif;
            color: #ccffcc;
            text-align: center;
            padding-bottom: 24px;
        }

        #hr {
            font-size: 196px;
            font-weight: 800;
            font-family: monospace;
            margin: 12px 0 6px;
            background: #000000aa;
            display: inline-block;
            padding: 0 28px;
            border-radius: 60px;
            text-shadow: 0 0 6px #0f0;
            letter-spacing: 4px;
        }

        .control-panel {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 14px;
            margin: 16px 10px;
        }

        button, .csv-btn {
            background: #1e2a2a;
            border: none;
            color: #0f0;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 60px;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
        }

        button:hover, .csv-btn:hover {
            background: #2c3e3e;
            transform: scale(1.02);
        }

        .recording {
            background: #c0392b;
            color: white;
            box-shadow: 0 0 8px #ff5555;
        }

        .range-wrap {
            background: #11181c;
            padding: 8px 20px;
            border-radius: 40px;
            display: inline-flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            margin: 8px auto;
            width: fit-content;
        }

        input[type="range"] {
            width: 140px;
            cursor: pointer;
        }

        #zoneLabel {
            background: #000000aa;
            padding: 4px 12px;
            border-radius: 32px;
            font-family: monospace;
            font-weight: bold;
        }

        .interval-box {
            background: #11181c;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 6px 18px;
            border-radius: 40px;
        }

        .interval-box input {
            width: 70px;
            background: #2c3e3e;
            border: 1px solid #2e8b57;
            color: #0f0;
            border-radius: 24px;
            padding: 6px;
            text-align: center;
            font-weight: bold;
        }

        /* ---------- GRAPH WITH STICKY Y-AXIS ---------- */
        .graph-container {
            width: 96%;
            max-width: 1400px;
            margin: 20px auto 5px auto;
            background: #0b0e10;
            border-radius: 20px;
            border: 1px solid #2a4a3a;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }

        .graph-row {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            background: #0b0e10;
        }

        /* Sticky left panel: BPM labels + horizontal grid */
        .y-axis-panel {
            flex-shrink: 0;
            width: 60px;
            background: #0b0e10;
            position: relative;
            border-right: 1px solid #2c5a3a;
            z-index: 15;
            box-shadow: 2px 0 8px rgba(0,0,0,0.3);
        }

        .y-axis-canvas {
            display: block;
            width: 60px;
            height: 100%;
            background: #0b0e10;
        }

        /* Scrollable area for the main graph */
        .scroll-area {
            flex: 1;
            overflow-x: auto;
            overflow-y: hidden;
            position: relative;
            background: #0b0e10;
        }

        .main-canvas {
            display: block;
            background: #0b0e10;
            cursor: grab;
        }

        .graph-caption {
            font-size: 12px;
            color: #8fbc8f;
            text-align: right;
            padding: 6px 20px 8px 0;
        }

        .toolbar {
            display: flex;
            justify-content: center;
            margin: 12px;
        }

        .csv-btn {
            background: #2c5e3f;
        }
    </style>
</head>
<body>

<div id="hr">--</div>

<div class="control-panel">
    <button id="connect">🔗 Connect HR</button>
    <button id="recordBtn">⏺ REC OFF</button>
</div>

<div class="interval-box">
    <span>🗣️ Voice every</span>
    <input id="interval" type="number" value="10" min="2" max="60" step="1">
    <span>sec</span>
</div>

<div class="range-wrap">
    <span>🎯 HR zone (green)</span>
    <input id="minZone" type="range" min="40" max="200" value="120">
    <span>–</span>
    <input id="maxZone" type="range" min="40" max="200" value="140">
    <div id="zoneLabel">120 - 140</div>
</div>

<!-- Graph with fixed Y axis and scrollable data canvas -->
<div class="graph-container">
    <div class="graph-row" id="graphRow">
        <!-- Sticky left panel (BPM scale & horizontal grid) -->
        <div class="y-axis-panel" id="yAxisPanel">
            <canvas id="yAxisCanvas" class="y-axis-canvas" width="60" height="220"></canvas>
        </div>
        <!-- Scrollable main canvas -->
        <div class="scroll-area" id="scrollArea">
            <canvas id="mainCanvas" class="main-canvas"></canvas>
        </div>
    </div>
</div>
<div class="graph-caption">↔️ Scroll horizontally • Y‑axis stays fixed • green = in zone</div>
<div class="toolbar">
    <button id="exportCsvBtn" class="csv-btn">📎 Export CSV</button>
</div>

<script>
    // ---------- DOM elements ----------
    const hrDisplay = document.getElementById("hr");
    const connectBtn = document.getElementById("connect");
    const recordBtn = document.getElementById("recordBtn");
    const minSlider = document.getElementById("minZone");
    const maxSlider = document.getElementById("maxZone");
    const zoneLabel = document.getElementById("zoneLabel");
    const intervalInput = document.getElementById("interval");
    const mainCanvas = document.getElementById("mainCanvas");
    const yAxisCanvas = document.getElementById("yAxisCanvas");
    const scrollArea = document.getElementById("scrollArea");

    // ---------- Global state ----------
    let device = null;
    let hrCharacteristic = null;
    let currentHR = 0;
    let recording = false;
    let recordingStartTime = null;        // ms
    let hrData = [];                      // { t: seconds, hr: bpm }

    // Graph constants
    const PX_PER_SECOND = 22;
    const LEFT_MARGIN = 12;               // small inner margin inside main canvas (starts after Y-panel)
    const RIGHT_MARGIN = 24;
    const GRAPH_HEIGHT = 220;             // px
    const MIN_BPM = 40;
    const MAX_BPM = 190;

    // helper: zone range
    let currentMinZone = 120, currentMaxZone = 140;

    // ---------- Y-axis drawing (fixed panel) ----------
    function drawYAxis() {
        const ctx = yAxisCanvas.getContext("2d");
        yAxisCanvas.width = 60;
        yAxisCanvas.height = GRAPH_HEIGHT;
        ctx.clearRect(0, 0, 60, GRAPH_HEIGHT);
        ctx.fillStyle = "#0b0e10";
        ctx.fillRect(0, 0, 60, GRAPH_HEIGHT);
        
        // draw horizontal grid lines + BPM labels
        ctx.font = "bold 11px 'JetBrains Mono', monospace";
        ctx.fillStyle = "#999999";
        ctx.strokeStyle = "#999999";
        ctx.lineWidth = 0.8;
        
   for (let bpm = MIN_BPM; bpm <= MAX_BPM; bpm += 10) {
    const y = bpmToY(bpm, GRAPH_HEIGHT);
    if (y < 5 || y > GRAPH_HEIGHT - 5) continue;
    ctx.fillStyle = "#c2f0c2";
    ctx.fillText(`${bpm}`, 8, y - 3);
}
        
        // additionally show zone highlight on axis? optional subtle
        const minZ = currentMinZone, maxZ = currentMaxZone;
        if (minZ < maxZ) {
            const yTop = bpmToY(maxZ, GRAPH_HEIGHT);
            const yBottom = bpmToY(minZ, GRAPH_HEIGHT);
            ctx.globalAlpha = 0.2;
            ctx.fillStyle = "#2aff6e";
            ctx.fillRect(0, yTop, 60, yBottom - yTop);
            ctx.globalAlpha = 1;
        }
    }

    // Y conversion function (reusable)
    function bpmToY(bpm, canvasHeight = GRAPH_HEIGHT) {
        const percent = (bpm - MIN_BPM) / (MAX_BPM - MIN_BPM);
        const clamped = Math.min(1, Math.max(0, percent));
        const topMargin = 18;
        const bottomMargin = 18;
        const drawHeight = canvasHeight - topMargin - bottomMargin;
        return topMargin + drawHeight * (1 - clamped);
    }

    // ---------- Main graph drawing (only data curve + vertical time grid) ----------
    function drawMainGraph() {
        if (!mainCanvas) return;
        
        let totalDuration = 0;
        if (hrData.length > 0) totalDuration = Math.max(...hrData.map(p => p.t));
        
        const neededWidth = LEFT_MARGIN + (totalDuration * PX_PER_SECOND) + RIGHT_MARGIN;
        const containerWidth = scrollArea.clientWidth;
        const finalWidth = Math.max(containerWidth, neededWidth);
        
        mainCanvas.width = finalWidth;
        mainCanvas.height = GRAPH_HEIGHT;
        const ctx = mainCanvas.getContext("2d");
        ctx.clearRect(0, 0, finalWidth, GRAPH_HEIGHT);
        ctx.fillStyle = "#0b0e10";
        ctx.fillRect(0, 0, finalWidth, GRAPH_HEIGHT);
        ctx.save();
ctx.strokeStyle = "#999999";
ctx.lineWidth = 0.8;
for (let bpm = MIN_BPM; bpm <= MAX_BPM; bpm += 10) {
    const y = bpmToY(bpm, GRAPH_HEIGHT);
    if (y < 5 || y > GRAPH_HEIGHT - 5) continue;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(finalWidth, y);
    ctx.stroke();
}
ctx.restore();

        // draw vertical time grid (seconds) - moves with scroll, that's intended
        ctx.save();
        ctx.font = "10px monospace";
        ctx.fillStyle = "#999999";
        ctx.strokeStyle = "#999999";
        ctx.lineWidth = 0.6;
        
        if (totalDuration > 0.2) {
            let stepSeconds = 5;
            if (totalDuration > 180) stepSeconds = 15;
            else if (totalDuration > 80) stepSeconds = 10;
            else if (totalDuration > 30) stepSeconds = 8;
            else stepSeconds = 5;
            
            for (let t = 0; t <= totalDuration + 0.5; t += stepSeconds) {
                const x = LEFT_MARGIN + t * PX_PER_SECOND;
                if (x < 0 || x > finalWidth - 10) continue;
                ctx.beginPath();
                ctx.moveTo(x, 12);
                ctx.lineTo(x, GRAPH_HEIGHT - 12);
                ctx.stroke();
                ctx.fillStyle = "#bed9b3";
                ctx.fillText(`${t}s`, x - 10, GRAPH_HEIGHT - 6);
            }
        } else {
            ctx.fillStyle = "#7f8c8d";
            ctx.font = "italic 12px monospace";
            ctx.fillText("⏺ Start recording → data appears", finalWidth/2 - 140, GRAPH_HEIGHT/2);
        }
        
        // draw HR curve (colored by zone)
        if (hrData.length >= 2) {
            const points = [...hrData].sort((a,b) => a.t - b.t);
            ctx.lineWidth = 2.6;
            ctx.lineJoin = "round";
            const zoneMin = currentMinZone, zoneMax = currentMaxZone;
            
            for (let i = 1; i < points.length; i++) {
                const p1 = points[i-1];
                const p2 = points[i];
                const x1 = LEFT_MARGIN + p1.t * PX_PER_SECOND;
                const x2 = LEFT_MARGIN + p2.t * PX_PER_SECOND;
                const y1 = bpmToY(p1.hr, GRAPH_HEIGHT);
                const y2 = bpmToY(p2.hr, GRAPH_HEIGHT);
                
                if ((x1 < -50 && x2 < -50) || (x1 > finalWidth + 50 && x2 > finalWidth + 50)) continue;
                const inZone = (p2.hr >= zoneMin && p2.hr <= zoneMax);
                ctx.strokeStyle = inZone ? "#2ecc71" : "#e67e22";
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();
            }
            
            // tiny markers
            ctx.fillStyle = "#ffffffcc";
            for (const p of points) {
                const x = LEFT_MARGIN + p.t * PX_PER_SECOND;
                if (x > -5 && x < finalWidth + 10) {
                    const y = bpmToY(p.hr, GRAPH_HEIGHT);
                    ctx.beginPath();
                    ctx.arc(x, y, 1, 0, Math.PI*2);
                    ctx.fillStyle = "#c0ffc0";
                    ctx.fill();
                }
            }
        }
        ctx.restore();
        
        // optional border
        ctx.strokeStyle = "#3e6a4a";
        ctx.lineWidth = 1;
        ctx.strokeRect(2, 2, mainCanvas.width - 4, mainCanvas.height - 4);
    }
    
    // combined redraw: Y-axis + main graph
    function redrawAll() {
        drawYAxis();
        drawMainGraph();
        // auto-scroll behavior: if recording and user is near right edge -> follow
        if (recording && scrollArea && hrData.length > 3) {
            const maxScroll = scrollArea.scrollWidth - scrollArea.clientWidth;
            const atRight = (maxScroll - scrollArea.scrollLeft) <= 40;
            if (atRight || maxScroll <= 0) {
                scrollArea.scrollLeft = scrollArea.scrollWidth;
            }
        }
    }
    
    // ---------- Data recording ----------
    function addHrDataPoint(bpm) {
        if (!recording || recordingStartTime === null) return;
        const elapsed = (Date.now() - recordingStartTime) / 1000;
        hrData.push({ t: elapsed, hr: bpm });
        if (hrData.length > 8000) hrData = hrData.slice(-7000);
        redrawAll();
    }
    
    function resetSession() {
        hrData = [];
        recordingStartTime = null;
        redrawAll();
    }
    
    function startRecording() {
        resetSession();
        recordingStartTime = Date.now();
        recording = true;
        recordBtn.textContent = "🔴 REC ON";
        recordBtn.classList.add("recording");
        redrawAll();
    }
    
    function stopRecording() {
        recording = false;
        recordBtn.textContent = "⏺ REC OFF";
        recordBtn.classList.remove("recording");
        redrawAll();
    }
    
    // ---------- Heart Rate BLE handler ----------
    function handleHeartRate(event) {
        const val = event.target.value;
        if (!val || val.byteLength < 2) return;
        let hrValue = 0;
        const flags = val.getUint8(0);
        if (flags & 0x01) hrValue = val.getUint16(1, true);
        else hrValue = val.getUint8(1);
        
        if (hrValue > 20 && hrValue < 250) {
            currentHR = hrValue;
            hrDisplay.textContent = currentHR;
            const inZone = (currentHR >= currentMinZone && currentHR <= currentMaxZone);
            hrDisplay.style.color = inZone ? "#9bff9b" : "#ff8c5a";
            
            if (recording && recordingStartTime !== null) {
                addHrDataPoint(currentHR);
            } else if (recording && recordingStartTime === null) {
                recordingStartTime = Date.now();
                addHrDataPoint(currentHR);
            }
            voiceAnnounce(currentHR);
        }
    }
    
    let lastVoice = 0;
    function voiceAnnounce(bpm) {
        const intervalSec = parseFloat(intervalInput.value);
        if (isNaN(intervalSec) || intervalSec < 2) return;
        const now = Date.now();
        if (now - lastVoice >= intervalSec * 1000) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(bpm.toString());
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
            lastVoice = now;
        }
    }
    
    // ---------- Bluetooth connection ----------
    async function connectHR() {
        if (!navigator.bluetooth) {
            alert("Web Bluetooth is not supported. Use Chrome / Edge.");
            return;
        }
        try {
            const btDevice = await navigator.bluetooth.requestDevice({
                filters: [{ services: ['heart_rate'] }]
            });
            device = btDevice;
            const server = await device.gatt.connect();
            const service = await server.getPrimaryService('heart_rate');
            hrCharacteristic = await service.getCharacteristic('heart_rate_measurement');
            await hrCharacteristic.startNotifications();
            hrCharacteristic.addEventListener('characteristicvaluechanged', handleHeartRate);
            connectBtn.textContent = "✅ Connected";
            connectBtn.style.background = "#2c6e3e";
            const msg = new SpeechSynthesisUtterance("Heart rate connected");
            window.speechSynthesis.speak(msg);
        } catch (err) {
            alert("Connection error: " + err.message);
            connectBtn.textContent = "⚠️ Connect";
        }
    }
    
    // ---------- CSV export ----------
    function exportCSV() {
        if (hrData.length === 0) {
            alert("No recorded data. Turn REC ON and get heart rate values.");
            return;
        }
        const sorted = [...hrData].sort((a,b) => a.t - b.t);
        const rows = [["Time (seconds)", "Heart Rate (BPM)"]];
        for (const p of sorted) rows.push([p.t.toFixed(2), p.hr]);
        const csv = rows.map(r => r.join(",")).join("\n");
        const blob = new Blob([csv], { type: "text/csv" });
        const link = document.createElement("a");
        const url = URL.createObjectURL(blob);
        const date = new Date();
        const ts = `${date.getFullYear()}-${date.getMonth()+1}-${date.getDate()}_${date.getHours()}-${date.getMinutes()}`;
        link.href = url;
        link.download = `hr_log_${ts}.csv`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        const btn = document.getElementById("exportCsvBtn");
        const orig = btn.innerText;
        btn.innerText = "✅ Exported!";
        setTimeout(() => btn.innerText = orig, 1500);
    }
    
    // ---------- Event binding & zone change ----------
    function updateZone() {
        currentMinZone = parseInt(minSlider.value, 10);
        currentMaxZone = parseInt(maxSlider.value, 10);
        zoneLabel.innerText = `${currentMinZone} - ${currentMaxZone}`;
        redrawAll();
    }
    
    minSlider.addEventListener("input", updateZone);
    maxSlider.addEventListener("input", updateZone);
    updateZone();
    
    connectBtn.addEventListener("click", connectHR);
    recordBtn.addEventListener("click", () => {
        if (!recording) startRecording();
        else stopRecording();
    });
    document.getElementById("exportCsvBtn").addEventListener("click", exportCSV);
    
    // resize & scroll sync (keep Y-axis always sharp)
    window.addEventListener("resize", () => {
        setTimeout(() => {
            redrawAll();
            if (recording && scrollArea) scrollArea.scrollLeft = scrollArea.scrollWidth;
        }, 30);
    });
    
    // manual call after load
    redrawAll();
</script>
</body>
</html>
