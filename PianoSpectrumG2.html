<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pro CQT Piano Roll</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; overflow:hidden; font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #000; }
body { display: flex; flex-direction: column; }

/* ─── CONTROL PANEL ────────────────────────────────────────────── */
#panel {
  flex-shrink: 0; background: #f0f2f5; border-bottom: 1px solid #c8cdd6;
  padding: 10px 16px 12px; display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; z-index: 10;
}
.btn {
  align-self: center; height: 42px; padding: 0 18px; border-radius: 6px; border: none;
  background: #2563eb; color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.15s;
}
.btn:hover { background: #1d4fd8; }
.btn.on { background: #16a34a; }
.btn.modal-trigger { background: #4b5563; }
.btn.modal-trigger:hover { background: #374151; }

.ctrl { display: flex; flex-direction: column; gap: 4px; min-width: 120px; }
.ctrl-label { font-size: 11px; font-weight: 600; color: #374151; display: flex; justify-content: space-between; }
.ctrl-val { color: #2563eb; }
input[type=range] { -webkit-appearance: none; width: 100%; height: 6px; border-radius: 3px; background: #d1d5db; cursor: pointer; outline: none; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #2563eb; transition: 0.1s; }

/* ─── CANVAS AREA ──────────────────────────────────────────────── */
#wrap { flex: 1; overflow-x: auto; overflow-y: hidden; }
canvas { display: block; cursor: crosshair; }
#tip { position: fixed; background: #ffffffee; border: 1px solid #ccc; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 4px; pointer-events: none; display: none; z-index: 99; }

/* ─── MODALS ───────────────────────────────────────────────────── */
.modal-overlay {
  position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.5);
  display: none; justify-content: center; align-items: center; z-index: 100;
}
.modal { background: #fff; padding: 20px; border-radius: 8px; width: 380px; max-width: 90vw; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-weight: bold; font-size: 16px; }
.close-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: #6b7280; }
.modal-row { margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
select { padding: 4px 8px; border-radius: 4px; border: 1px solid #ccc; font-size: 13px; outline: none; }

/* EQ STYLES */
.eq-band { border: 1px solid #e5e7eb; padding: 10px; border-radius: 6px; margin-bottom: 10px; position: relative; background: #f9fafb; }
.eq-band-header { font-size: 12px; font-weight: bold; margin-bottom: 8px; display: flex; justify-content: space-between;}
.eq-del { background: #ef4444; color: #fff; border: none; border-radius: 3px; cursor: pointer; padding: 2px 6px; font-size: 10px; }
.eq-sliders { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.eq-slider-col { display: flex; flex-direction: column; font-size: 10px; text-align: center; }
.eq-slider-col input { margin-top: 4px; }
</style>
</head>
<body>

<div id="panel">
  <button id="startBtn" class="btn">▶ Start</button>
  <button class="btn modal-trigger" onclick="document.getElementById('eqModal').style.display='flex'">Эквалайзер</button>
  <button class="btn modal-trigger" onclick="document.getElementById('metronomeModal').style.display='flex'">Метроном</button>

  <div class="ctrl">
    <div class="ctrl-label">Mic In Gain <span class="ctrl-val" id="vPreG">1.0×</span></div>
    <input type="range" id="sPreG" min="1" max="20" step="1" value="1">
  </div>
  <div class="ctrl">
    <div class="ctrl-label">Vis Gain <span class="ctrl-val" id="vG">50×</span></div>
    <input type="range" id="sG" min="1" max="150" step="1" value="50">
  </div>
  <div class="ctrl">
    <div class="ctrl-label">Скорость <span class="ctrl-val" id="vR">30/с</span></div>
    <input type="range" id="sR" min="10" max="60" step="1" value="30">
  </div>
  <div class="ctrl">
    <div class="ctrl-label">Порог <span class="ctrl-val" id="vTh">4%</span></div>
    <input type="range" id="sTh" min="1" max="40" step="1" value="4">
  </div>
</div>

<div id="wrap"><canvas id="cv"></canvas></div>
<div id="tip"></div>

<div id="eqModal" class="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <span>Параметрический EQ</span>
      <button class="close-btn" onclick="this.closest('.modal-overlay').style.display='none'">×</button>
    </div>
    <div class="modal-row">
      <select id="eqType">
        <option value="peaking">Полосовой (Peaking)</option>
        <option value="lowshelf">Low Shelf</option>
        <option value="highshelf">High Shelf</option>
      </select>
      <button class="btn" style="height:28px; padding: 0 10px; font-size: 12px;" onclick="addEqBand()">+ Добавить</button>
    </div>
    <div id="eqList"></div>
  </div>
</div>

<div id="metronomeModal" class="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <span>Метроном</span>
      <button class="close-btn" onclick="this.closest('.modal-overlay').style.display='none'">×</button>
    </div>
    <div class="modal-row" style="justify-content: space-between;">
      <span>Размер:</span>
      <select id="mSig">
        <option value="2">2/4</option><option value="3">3/4</option>
        <option value="4" selected>4/4</option><option value="5">5/4</option>
        <option value="6">6/8</option><option value="7">7/8</option>
      </select>
    </div>
    <div class="ctrl" style="margin-bottom: 15px;">
      <div class="ctrl-label">Темп (BPM) <span class="ctrl-val" id="vBpm">120</span></div>
      <input type="range" id="sBpm" min="40" max="240" step="1" value="120">
    </div>
    <div class="ctrl">
      <div class="ctrl-label">Громкость <span class="ctrl-val" id="vMVol">50%</span></div>
      <input type="range" id="sMVol" min="0" max="100" step="1" value="50">
    </div>
  </div>
</div>

<script>
'use strict';

// ─── Constants & Utils ───────────────────────────────────────────
const MIDI_A0 = 21, N_KEYS = 88, COL_W = 12, KB_H = 96, MAX_PK = 5;
const BLK_PC = new Set([1, 3, 6, 8, 10]);
const isBlack = k => BLK_PC.has((MIDI_A0 + k) % 12);
const midi2freq = m => 440 * 2 ** ((m - 69) / 12);
const midi2name = m => ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'][m % 12] + (Math.floor(m / 12) - 1);
const NOTE_HUE = [0, 30, 60, 90, 120, 150, 180, 210, 240, 270, 300, 330];

function hsl2rgb(h, s, l) {
  const c = (1 - Math.abs(2*l - 1)) * s;
  const x = c * (1 - Math.abs(((h/60) % 2) - 1));
  const m = l - c/2;
  let r=0,g=0,b=0;
  if(h<60){r=c;g=x;b=0}else if(h<120){r=x;g=c;b=0}else if(h<180){r=0;g=c;b=x}
  else if(h<240){r=0;g=x;b=c}else if(h<300){r=x;g=0;b=c}else{r=c;g=0;b=x}
  return [Math.round((r+m)*255), Math.round((g+m)*255), Math.round((b+m)*255)];
}
const PC_LUT = Array.from({length:12}, (_, pc) => {
  const lut = new Uint8Array(256 * 3);
  for (let i = 0; i < 256; i++) {
    const [r,g,b] = hsl2rgb(NOTE_HUE[pc], 1.0, 0.06 + (i/255) * 0.56);
    lut[i*3]=r; lut[i*3+1]=g; lut[i*3+2]=b;
  }
  return lut;
});

// ─── State ───────────────────────────────────────────────────────
let audioCtx, micSource, cqtNode, preGainNode;
let running = false;
let visGain = 50.0;
let rowMs   = 1000 / 30;
let thresh  = 0.04;
const targetVals = new Float32Array(N_KEYS), semVals = new Float32Array(N_KEYS), peakMask = new Uint8Array(N_KEYS);

// EQ State
let eqBands = [];
let eqNodes = [];

// Metronome State
let bpm = 120, metroVol = 0.5, beatsPerBar = 4;
let nextNoteTime = 0, currentBeat = 0, visualBeatQueue = [];

// ─── Canvas Init ─────────────────────────────────────────────────
const canvas = document.getElementById('cv'), ctx = canvas.getContext('2d', {alpha:false});
let wfH = 0, wfBuf = null, CANVAS_W = N_KEYS * COL_W;

function initCanvas() {
  const h = document.getElementById('wrap').clientHeight;
  canvas.width = CANVAS_W; canvas.height = h;
  wfH = Math.max(20, h - KB_H);
  wfBuf = new ImageData(CANVAS_W, wfH);
  const d = wfBuf.data;
  
  // Fill default background: dark grey for white keys, black for black keys
  for (let y = 0; y < wfH; y++) {
    for (let k = 0; k < N_KEYS; k++) {
      const isBlk = isBlack(k);
      const c = isBlk ? 0 : 25; // Base brightness
      for (let px = 0; px < COL_W; px++) {
        let i = (y * CANVAS_W + k * COL_W + px) * 4;
        d[i]=c; d[i+1]=c; d[i+2]=c; d[i+3]=255;
      }
    }
  }
  drawKeyboard(new Uint8Array(N_KEYS));
}

// ─── Metronome Logic ─────────────────────────────────────────────
function playClick(time, isStrong) {
  if (metroVol <= 0.01) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.frequency.value = isStrong ? 1200 : 800;
  gain.gain.setValueAtTime(metroVol, time);
  gain.gain.exponentialRampToValueAtTime(0.001, time + 0.05);
  osc.start(time); osc.stop(time + 0.05);
}

function scheduleMetronome() {
  if (!running) return;
  while (nextNoteTime < audioCtx.currentTime + 0.1) {
    let isStrong = (currentBeat === 0);
    playClick(nextNoteTime, isStrong);
    visualBeatQueue.push({ time: nextNoteTime, type: isStrong ? 1 : 2 });
    
    currentBeat = (currentBeat + 1) % beatsPerBar;
    nextNoteTime += 60.0 / bpm;
  }
  setTimeout(scheduleMetronome, 25);
}

// ─── Draw Logic ──────────────────────────────────────────────────
function drawKeyboard(pm) {
  const top = wfH;
  ctx.fillStyle = '#e8eaf0'; ctx.fillRect(0, top, CANVAS_W, KB_H);
  ctx.fillStyle = '#222'; ctx.fillRect(0, top, CANVAS_W, 2);
  for (let k = 0; k < N_KEYS; k++) {
    if (isBlack(k)) continue;
    const x = k * COL_W, lit = pm[k], g = ctx.createLinearGradient(0, top+2, 0, top+KB_H);
    if (lit) { g.addColorStop(0, `hsl(${NOTE_HUE[(MIDI_A0+k)%12]},90%,72%)`); g.addColorStop(1, `hsl(${NOTE_HUE[(MIDI_A0+k)%12]},90%,58%)`); }
    else { g.addColorStop(0, '#f8f9fc'); g.addColorStop(1, '#d4d8e5'); }
    ctx.fillStyle = g; ctx.fillRect(x+1, top+2, COL_W-1, KB_H-3);
    ctx.fillStyle = lit ? `hsl(${NOTE_HUE[(MIDI_A0+k)%12]},60%,50%)` : '#aab0c0'; ctx.fillRect(x + COL_W - 1, top+2, 1, KB_H-3);
  }
  const BK_H = Math.round(KB_H * 0.6), BK_W = Math.round(COL_W * 0.65), BK_OX = Math.floor((COL_W - BK_W) / 2);
  for (let k = 0; k < N_KEYS; k++) {
    if (!isBlack(k)) continue;
    const x = k * COL_W + BK_OX, y = top + 2, lit = pm[k], g = ctx.createLinearGradient(0, y, 0, y+BK_H);
    if (lit) { g.addColorStop(0, `hsl(${NOTE_HUE[(MIDI_A0+k)%12]},100%,40%)`); g.addColorStop(1, `hsl(${NOTE_HUE[(MIDI_A0+k)%12]},100%,38%)`); }
    else { g.addColorStop(0, '#3a3c4c'); g.addColorStop(1, '#12131c'); }
    ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(x, y, BK_W, BK_H, [0,0,3,3]); ctx.fill();
  }
}

function addRow(sv, pm, beatLineType) {
  const d = wfBuf.data, rowB = CANVAS_W * 4, base = (wfH-1) * rowB;
  d.copyWithin(0, rowB); // Scroll up
  
  for (let k = 0; k < N_KEYS; k++) {
    const isBlk = isBlack(k);
    let r = isBlk ? 0 : 25, g = isBlk ? 0 : 25, b = isBlk ? 0 : 25;
    
    // Draw horizontal metronome line
    if (beatLineType === 1) { r+=60; g+=60; b+=60; }      // Strong beat
    else if (beatLineType === 2) { r+=30; g+=30; b+=30; } // Weak beat

    if (pm[k]) {
      const v = Math.round(Math.min(1, Math.max(0, sv[k])) * 255), lut = PC_LUT[(MIDI_A0+k) % 12];
      r = Math.max(r, lut[v*3]); g = Math.max(g, lut[v*3+1]); b = Math.max(b, lut[v*3+2]);
    }
    for (let px = 0; px < COL_W; px++) {
      const i = base + (k * COL_W + px)*4;
      d[i]=r; d[i+1]=g; d[i+2]=b;
    }
  }
}

let lastRowTs = 0;
function frame(ts) {
  if (!running) return;
  requestAnimationFrame(frame);

  for (let k = 0; k < N_KEYS; k++) semVals[k] = semVals[k] * 0.7 + targetVals[k] * 0.3;
  
  peakMask.fill(0);
  const c = [];
  for (let k = 1; k < N_KEYS-1; k++) if (semVals[k] > thresh && semVals[k] >= semVals[k-1] && semVals[k] >= semVals[k+1]) c.push(k);
  c.sort((a,b)=>semVals[b]-semVals[a]);
  for (const k of c.slice(0, MAX_PK)) peakMask[k] = 1;

  if (ts - lastRowTs >= rowMs) {
    lastRowTs = ts;
    let bType = 0;
    if (visualBeatQueue.length > 0 && audioCtx.currentTime >= visualBeatQueue[0].time) {
      bType = visualBeatQueue.shift().type;
    }
    addRow(semVals, peakMask, bType);
    ctx.putImageData(wfBuf, 0, 0);
  }
  drawKeyboard(peakMask);
}

// ─── EQ Graph Builder ────────────────────────────────────────────
function rebuildAudioGraph() {
  if (!micSource || !cqtNode) return;
  micSource.disconnect();
  preGainNode.disconnect();
  eqNodes.forEach(n => n.disconnect());

  let prev = micSource;
  prev.connect(preGainNode);
  prev = preGainNode;

  eqNodes.forEach(n => { prev.connect(n); prev = n; });
  prev.connect(cqtNode);
}

function updateEQNode(idx) {
  if (!eqNodes[idx]) return;
  const data = eqBands[idx];
  eqNodes[idx].type = data.type;
  eqNodes[idx].frequency.value = data.freq;
  eqNodes[idx].Q.value = data.q;
  eqNodes[idx].gain.value = data.gain;
}

window.addEqBand = function() {
  const type = document.getElementById('eqType').value;
  eqBands.push({ id: Date.now(), type, freq: 1000, q: 1, gain: 0 });
  if (audioCtx) {
    const filter = audioCtx.createBiquadFilter();
    eqNodes.push(filter);
    updateEQNode(eqBands.length - 1);
    rebuildAudioGraph();
  }
  renderEQUI();
};

window.removeEqBand = function(idx) {
  eqBands.splice(idx, 1);
  if (audioCtx) {
    eqNodes[idx].disconnect();
    eqNodes.splice(idx, 1);
    rebuildAudioGraph();
  }
  renderEQUI();
};

function renderEQUI() {
  const list = document.getElementById('eqList');
  list.innerHTML = '';
  eqBands.forEach((band, i) => {
    const tName = band.type === 'peaking' ? 'Полосовой' : (band.type === 'lowshelf' ? 'Low Shelf' : 'High Shelf');
    const html = `
      <div class="eq-band">
        <div class="eq-band-header">
          <span>${tName}</span>
          <button class="eq-del" onclick="removeEqBand(${i})">Удалить</button>
        </div>
        <div class="eq-sliders">
          <div class="eq-slider-col">Freq: <span id="eqFv${i}">${band.freq}Hz</span>
            <input type="range" min="20" max="15000" step="10" value="${band.freq}" oninput="eqBands[${i}].freq=this.value; document.getElementById('eqFv${i}').innerText=this.value+'Hz'; updateEQNode(${i});">
          </div>
          <div class="eq-slider-col">Q (Крутизна): <span id="eqQv${i}">${band.q}</span>
            <input type="range" min="0.1" max="20" step="0.1" value="${band.q}" oninput="eqBands[${i}].q=this.value; document.getElementById('eqQv${i}').innerText=this.value; updateEQNode(${i});">
          </div>
          <div class="eq-slider-col">Gain: <span id="eqGv${i}">${band.gain}dB</span>
            <input type="range" min="-12" max="12" step="0.5" value="${band.gain}" oninput="eqBands[${i}].gain=this.value; document.getElementById('eqGv${i}').innerText=this.value+'dB'; updateEQNode(${i});">
          </div>
        </div>
      </div>`;
    list.insertAdjacentHTML('beforeend', html);
  });
}

// ─── AUDIO WORKLET (CQT) ─────────────────────────────────────────
const cqtWorkletCode = `
class CQTFilterbank extends AudioWorkletProcessor {
  constructor() {
    super();
    this.N = 88; this.fs = sampleRate; this.Q = 17.31;
    this.b0 = new Float32Array(this.N); this.b1 = new Float32Array(this.N); this.b2 = new Float32Array(this.N);
    this.a1 = new Float32Array(this.N); this.a2 = new Float32Array(this.N);
    this.x1 = new Float32Array(this.N); this.x2 = new Float32Array(this.N);
    this.y1 = new Float32Array(this.N); this.y2 = new Float32Array(this.N);
    this.env = new Float32Array(this.N); this.envAlpha = new Float32Array(this.N);
    
    for (let k = 0; k < this.N; k++) {
      let freq = 440 * Math.pow(2, (21 + k - 69) / 12), w0 = 2 * Math.PI * freq / this.fs;
      let alpha = Math.sin(w0) / (2 * this.Q), a0 = 1 + alpha;
      this.b0[k] = alpha / a0; this.b1[k] = 0; this.b2[k] = -alpha / a0;
      this.a1[k] = (-2 * Math.cos(w0)) / a0; this.a2[k] = (1 - alpha) / a0;
      this.envAlpha[k] = Math.exp(-1.0 / (this.fs * Math.max(1.0 / freq * 4, 0.01)));
    }
    this.samplesCount = 0;
  }
  process(inputs) {
    const input = inputs[0][0]; if (!input) return true;
    for (let i = 0; i < input.length; i++) {
      let x = input[i];
      for (let k = 0; k < this.N; k++) {
        let y = this.b0[k]*x + this.b1[k]*this.x1[k] + this.b2[k]*this.x2[k] - this.a1[k]*this.y1[k] - this.a2[k]*this.y2[k];
        this.x2[k] = this.x1[k]; this.x1[k] = x; this.y2[k] = this.y1[k]; this.y1[k] = y;
        this.env[k] = this.env[k] * this.envAlpha[k] + (y * y) * (1 - this.envAlpha[k]);
      }
    }
    this.samplesCount += input.length;
    if (this.samplesCount >= this.fs / 60) { this.port.postMessage(new Float32Array(this.env)); this.samplesCount = 0; }
    return true;
  }
}
registerProcessor('cqt-filterbank', CQTFilterbank);
`;

// ─── Initialization ──────────────────────────────────────────────
async function startAudio() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: {echoCancellation:false, noiseSuppression:false, autoGainControl:false} });
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    await audioCtx.audioWorklet.addModule(URL.createObjectURL(new Blob([cqtWorkletCode], { type: 'application/javascript' })));
    
    micSource = audioCtx.createMediaStreamSource(stream);
    preGainNode = audioCtx.createGain();
    preGainNode.gain.value = document.getElementById('sPreG').value;
    
    // Instantiate EQ nodes if any existed before start
    eqNodes = eqBands.map(b => {
      let f = audioCtx.createBiquadFilter();
      f.type = b.type; f.frequency.value = b.freq; f.Q.value = b.q; f.gain.value = b.gain;
      return f;
    });

    cqtNode = new AudioWorkletNode(audioCtx, 'cqt-filterbank');
    cqtNode.port.onmessage = e => {
      const energies = e.data;
      for (let k = 0; k < N_KEYS; k++) targetVals[k] = Math.sqrt(energies[k]) * visGain;
    };
    
    rebuildAudioGraph();
    
    running = true;
    nextNoteTime = audioCtx.currentTime + 0.1;
    scheduleMetronome();
    
    const btn = document.getElementById('startBtn');
    btn.textContent = '■ Stop'; btn.classList.add('on');
    requestAnimationFrame(frame);
  } catch(e) { alert('Ошибка микрофона: ' + e.message); }
}

document.getElementById('startBtn').addEventListener('click', () => { if (!running) startAudio(); });

// Controls
const bCtrl = (id, fn) => document.getElementById(id).addEventListener('input', e => fn(e.target.value));
bCtrl('sPreG', v => { if(preGainNode) preGainNode.gain.value = v; document.getElementById('vPreG').innerText = v + '×'; });
bCtrl('sG',    v => { visGain = v; document.getElementById('vG').innerText = v + '×'; });
bCtrl('sR',    v => { rowMs = 1000 / v; document.getElementById('vR').innerText = v + '/с'; });
bCtrl('sTh',   v => { thresh = v / 100; document.getElementById('vTh').innerText = v + '%'; });
bCtrl('sBpm',  v => { bpm = parseInt(v); document.getElementById('vBpm').innerText = v; });
bCtrl('sMVol', v => { metroVol = v / 100; document.getElementById('vMVol').innerText = v + '%'; });
bCtrl('mSig',  v => { beatsPerBar = parseInt(v); currentBeat = 0; });

// Tooltip
const tip = document.getElementById('tip');
canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect(), k = Math.floor((e.clientX - r.left) * (canvas.width / r.width) / COL_W);
  if (k >= 0 && k < N_KEYS) {
    const midi = MIDI_A0 + k;
    tip.style.cssText = `display:block;left:${e.clientX+14}px;top:${e.clientY-6}px`;
    tip.textContent = `${midi2name(midi)}  ${midi2freq(midi).toFixed(1)} Hz`;
  }
});
canvas.addEventListener('mouseleave', () => { tip.style.display='none'; });
