<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pro CQT Piano Roll – Full</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body { height:100%; overflow:hidden; font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #000; }
        body { display: flex; flex-direction: column; }

        /* ─── CONTROL PANEL ────────────────────────────────────────── */
        #panel {
            flex-shrink: 0; background: #f0f2f5; border-bottom: 1px solid #c8cdd6;
            padding: 10px 16px 12px; display: flex; align-items: flex-end; gap: 10px;
            flex-wrap: wrap; z-index: 10;
        }
        .btn {
            height: 38px; padding: 0 14px; border-radius: 6px; border: none;
            background: #2563eb; color: #fff; font-size: 12px; font-weight: 600;
            cursor: pointer; transition: 0.15s; white-space: nowrap;
        }
        .btn:hover { background: #1d4fd8; }
        .btn.on { background: #16a34a; }
        .btn.rec { background: #dc2626; }
        .btn.rec:hover { background: #b91c1c; }
        .btn.modal-trigger { background: #4b5563; }
        .btn.modal-trigger:hover { background: #374151; }
        .btn.small { height: 30px; padding: 0 10px; font-size: 11px; }

        .ctrl-row {
            display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end;
            margin-left: 10px;
        }
        .ctrl {
            display: flex; flex-direction: column; gap: 2px; min-width: 100px;
        }
        .ctrl-label {
            font-size: 10px; font-weight: 600; color: #374151;
            display: flex; justify-content: space-between;
        }
        .ctrl-val { color: #2563eb; }
        input[type=range] {
            -webkit-appearance: none; width: 100%; height: 5px;
            border-radius: 3px; background: #d1d5db; cursor: pointer; outline: none;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 14px; height: 14px;
            border-radius: 50%; background: #2563eb; transition: 0.1s;
        }
        .toggle-wrap { display: flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; }
        .toggle-wrap input[type=checkbox] { width: 16px; height: 16px; cursor: pointer; }

        /* ─── CANVAS AREA ──────────────────────────────────────────── */
        #wrap { flex: 1; overflow-x: auto; overflow-y: hidden; }
        canvas { display: block; cursor: crosshair; }
        #tip {
            position: fixed; background: #ffffffee; border:1px solid #ccc;
            font-size: 11px; font-weight: 600; padding: 3px 8px;
            border-radius: 4px; pointer-events: none; display: none; z-index: 99;
        }

        /* ─── MODALS ───────────────────────────────────────────────── */
        .modal-overlay {
            position: fixed; top:0; left:0; right:0; bottom:0;
            background: rgba(0,0,0,0.5); display: none;
            justify-content: center; align-items: center; z-index: 100;
        }
        .modal {
            background: #fff; padding: 18px; border-radius: 8px;
            width: 420px; max-width: 95vw; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            max-height: 90vh; overflow-y: auto;
        }
        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 14px; font-weight: bold; font-size: 16px;
        }
        .close-btn {
            background: none; border: none; font-size: 20px; cursor: pointer; color: #6b7280;
        }
        .modal-row { margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
        select {
            padding: 4px 8px; border-radius: 4px; border:1px solid #ccc; font-size:13px; outline:none;
        }

        /* EQ specific */
        .eq-band {
            border:1px solid #e5e7eb; padding:10px; border-radius:6px;
            margin-bottom:10px; background:#f9fafb;
        }
        .eq-band-header { font-size:12px; font-weight:bold; margin-bottom:6px; display:flex; justify-content:space-between; }
        .eq-del { background:#ef4444; color:#fff; border:none; border-radius:3px; cursor:pointer; padding:2px 6px; font-size:10px; }
        .eq-sliders { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
        .eq-slider-col { display:flex; flex-direction:column; font-size:10px; text-align:center; }
        .eq-slider-col input { margin-top:4px; width:100%; }

        /* hidden sliders */
        #slidersContainer { transition: all 0.2s; }
        .hidden-sliders { display: none !important; }

        /* Calibration */
        .calib-note-big { font-size: 38px; font-weight: 800; letter-spacing: 2px; }
        .calib-bar-bg { background: #e5e7eb; border-radius: 6px; height: 10px; margin: 8px 0; }
        .calib-bar-fill { background: #0891b2; height: 10px; border-radius: 6px; transition: width 0.15s; }
        .calib-rec-bar-bg { background: #fecaca; border-radius: 4px; height: 6px; margin: 4px 0; }
        .calib-rec-bar-fill { background: #dc2626; height: 6px; border-radius: 4px; transition: width 0.1s; }
        .note-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin: 1px; }
        .btn.midi-on { background: #16a34a !important; }
        select.mode-sel { height: 30px; font-size: 11px; font-weight: 600; padding: 0 6px; border-radius: 6px; border: 2px solid #2563eb; color: #1e3a8a; background:#eff6ff; cursor:pointer; }
    </style>
</head>
<body>

<!-- hidden audio element for playback -->
<audio id="audioPlayback" style="display:none;"></audio>

<script>
'use strict';

// ─── Constants & Utilities ───────────────────────────────────────
const MIDI_A0 = 21, N_KEYS = 88, COL_W = 12, KB_H = 96, MAX_PK = 5;
const BLK_PC = new Set([1, 3, 6, 8, 10]);
const isBlack = k => BLK_PC.has((MIDI_A0 + k) % 12);
const midi2freq = m => 440 * 2 ** ((m - 69) / 12);
const midi2name = m => ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'][m % 12] + (Math.floor(m / 12) - 1);
const NOTE_HUE = [0, 30, 60, 90, 120, 150, 180, 210, 240, 270, 300, 330];

// ─── Precomputed Color LUTs ──────────────────────────────────────
function makeLUT(hue, sat, litRange) {
    const lut = new Uint8Array(256 * 3);
    const [l0, l1] = litRange;
    for (let i = 0; i < 256; i++) {
        const l = l0 + (i / 255) * (l1 - l0);
        const [r, g, b] = hsl2rgb(hue, sat, l);
        lut[i * 3] = r;
        lut[i * 3 + 1] = g;
        lut[i * 3 + 2] = b;
    }
    return lut;
}

function hsl2rgb(h, s, l) {
    const c = (1 - Math.abs(2 * l - 1)) * s;
    const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
    const m = l - c / 2;
    let r = 0, g = 0, b = 0;
    if (h < 60) { r = c; g = x; b = 0; }
    else if (h < 120) { r = x; g = c; b = 0; }
    else if (h < 180) { r = 0; g = c; b = x; }
    else if (h < 240) { r = 0; g = x; b = c; }
    else if (h < 300) { r = x; g = 0; b = c; }
    else { r = c; g = 0; b = x; }
    return [
        Math.round((r + m) * 255),
        Math.round((g + m) * 255),
        Math.round((b + m) * 255)
    ];
}

const PC_LUT_COLOR = Array.from({ length: 12 }, (_, pc) =>
    makeLUT(NOTE_HUE[pc], 1.0, [0.06, 0.62])
);
const MONO_LUT = makeLUT(0, 0, [0.1, 0.55]); // grayscale

let rainbow = true; // toggled by checkbox

// ─── Global State ────────────────────────────────────────────────
let audioCtx = null, micSource = null, cqtNode = null, preGainNode = null;
let running = false;
let visGain = 50.0;
let rowMs = 1000 / 30;
let thresh = 0.04;
let hysteresis = 0;                          // close-threshold = thresh*(1-hysteresis)
const noteState = new Uint8Array(N_KEYS);    // per-note on/off state for hysteresis
const targetVals = new Float32Array(N_KEYS), semVals = new Float32Array(N_KEYS), peakMask = new Uint8Array(N_KEYS);

// ─── Harmonic Analysis ───────────────────────────────────────────
// Semitone offsets for harmonics 2–5 relative to fundamental
const HARM_OFFSETS = [12, 19, 24, 28]; // octave, 5th+oct, 2oct, 2oct+3rd
// Weights for HPS boost: how much each harmonic contributes to fundamental detection
const HPS_WEIGHTS  = [0.50, 0.35, 0.25, 0.18];
const detVals = new Float32Array(N_KEYS); // HPS-enhanced detection values
let hpsBoost    = true;   // boost weak fundamentals using harmonic energy
let harmSuppress = true;  // suppress harmonic false-positives
let harmRatio   = 0.35;   // fundamental must be ≥ this fraction of harmonic to suppress it

// ─── Detection Mode ──────────────────────────────────────────────
// 0 = peaks (original), 1 = instrument profile, 2 = combo
let detMode = 0;
let instrProfile = null; // Array(88) of Float32Array(88), or null

// ─── MIDI ────────────────────────────────────────────────────────
let midiEnabled = false, midiAccess = null;
const midiActiveNotes = new Set();
const midiNoteVelocity = new Float32Array(N_KEYS);   // per-key velocity 0-127
let midiFrameId = null;

// ─── MIDI channel / SF2 state ────────────────────────────────────
let midiChannelFilter = -1;                  // -1 = all channels
const channelPrograms = new Array(16).fill(0);
let sf2 = null, sf2Cache = {}, sf2AC = null, sf2MasterGain = null;
let sf2MidiVolume = 0.8;
const activeNoteNodes = new Map();           // channel*128+note → sf2Play node

// ─── Sustain pedal ───────────────────────────────────────────────
let sustainPedal = false;
const sustainHeld = new Map();   // channel*128+note → channel, for deferred note-off

// ─── MIDI recording / playback events ────────────────────────────
let sf2RecordDest = null;
let midiRecordEvents = [];       // [{t, type:'on'/'off', k, vel}] ms from rec start
let midiRecordStartTime = null;
let midiPlaybackEvents = [];     // saved copy of recorded MIDI events for playback
let midiPlaybackIndex = 0;
let midiPlaybackActive = false;
let midiPlaybackRaf = null;
let playbackWallStart = null;   // performance.now() snapshot when playback started
let midiPlaybackMode = false;   // true = replay via SF2 engine; false = audioEl (mic)

// ─── Calibration ─────────────────────────────────────────────────
const CALIB_FRAMES = 60;          // ~2 s at 30 fps
let calibOpen      = false;
let calibNoteIdx   = 0;           // 0–87, current note being calibrated
let calibRecording = false;
let calibAccum     = new Float32Array(N_KEYS);
let calibFrames    = 0;

// EQ
let eqBands = [];
let eqNodes = [];
let showEQCurve = false;

// Metronome
let bpm = 120, metroVol = 0.5, beatsPerBar = 4, metroActive = true;
let nextNoteTime = 0, currentBeat = 0, visualBeatQueue = [];
let beatPattern = []; // will be computed
let noiseClickBuffer = null; // AudioBuffer for metronome click

// Recording / Playback
let mediaRecorder = null, recordedBlob = null;
const audioEl = document.getElementById('audioPlayback');

// ─── Canvas Setup ────────────────────────────────────────────────
const canvas = document.getElementById('cv'), ctx = canvas.getContext('2d', { alpha: false });
let wfH = 0, wfBuf = null, CANVAS_W = N_KEYS * COL_W;
let EQ_H = 100; // height of EQ curve area when visible

function resizeCanvas() {
    const h = document.getElementById('wrap').clientHeight;
    canvas.width = CANVAS_W;
    canvas.height = h;
    const usedForEQ = showEQCurve ? EQ_H : 0;
    wfH = Math.max(20, h - KB_H - usedForEQ);
    wfBuf = new ImageData(CANVAS_W, wfH);
    // fill with dark background
    const d = wfBuf.data;
    for (let y = 0; y < wfH; y++) {
        for (let k = 0; k < N_KEYS; k++) {
            const c = isBlack(k) ? 0 : 25;
            for (let px = 0; px < COL_W; px++) {
                const i = (y * CANVAS_W + k * COL_W + px) * 4;
                d[i] = c; d[i + 1] = c; d[i + 2] = c; d[i + 3] = 255;
            }
        }
    }
    drawKeyboard(peakMask);
    if (showEQCurve) drawEQCurve();
}

// ─── Keyboard Drawing ─────────────────────────────────────────────
// Classic algorithm (Benjamin Pritchard / every standard impl):
//   pass 1 – white background fills the entire area (no holes possible)
//   pass 2 – white key gradients painted in their columns
//   pass 3 – black keys painted on top
function drawKeyboard(pm) {
    const top = wfH + (showEQCurve ? EQ_H : 0);
    const BK_H = Math.round(KB_H * 0.6);
    const BK_W = Math.round(COL_W * 0.65);
    const BK_OX = Math.floor((COL_W - BK_W) / 2);
    const y0 = top + 2;      // keyboard body starts here
    const kH = KB_H - 2;     // keyboard body height

    // Pass 0 – solid white background for the whole keyboard rect.
    // This automatically fills the space around/below black keys — no holes.
    ctx.fillStyle = '#f5f5f8';
    ctx.fillRect(0, top, CANVAS_W, KB_H);
    ctx.fillStyle = '#222';
    ctx.fillRect(0, top, CANVAS_W, 2);   // top border

    // Pass 1 – white keys (full height, their own column)
    for (let k = 0; k < N_KEYS; k++) {
        if (isBlack(k)) continue;
        const x   = k * COL_W;
        const lit = pm[k];
        const hue = rainbow ? NOTE_HUE[(MIDI_A0 + k) % 12] : 210;
        const g = ctx.createLinearGradient(0, y0, 0, y0 + kH);
        if (lit) {
            g.addColorStop(0, `hsl(${hue},90%,78%)`);
            g.addColorStop(1, `hsl(${hue},90%,60%)`);
        } else {
            g.addColorStop(0, '#fafbfc');
            g.addColorStop(1, '#d8dce8');
        }
        ctx.fillStyle = g;
        ctx.fillRect(x, y0, COL_W, kH);
        // 1-px separator only between adjacent white keys (E|F, B|C — no black between them)
        if ((k + 1 < N_KEYS) && !isBlack(k + 1)) {
            ctx.fillStyle = lit ? `hsl(${hue},60%,52%)` : '#aab0c4';
            ctx.fillRect(x + COL_W - 1, y0, 1, kH);
        }
        // Note label on every C
        if ((MIDI_A0 + k) % 12 === 0) {
            ctx.fillStyle = lit ? '#fff' : '#778899';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            ctx.font = 'bold 8px sans-serif';
            ctx.fillText(midi2name(MIDI_A0 + k), x + COL_W / 2, top + KB_H - 3);
        }
    }

    // Pass 2 – black keys on top
    for (let k = 0; k < N_KEYS; k++) {
        if (!isBlack(k)) continue;
        const x   = k * COL_W + BK_OX;
        const lit = pm[k];
        const hue = rainbow ? NOTE_HUE[(MIDI_A0 + k) % 12] : 210;
        const g = ctx.createLinearGradient(0, y0, 0, y0 + BK_H);
        if (lit) {
            g.addColorStop(0, `hsl(${hue},100%,45%)`);
            g.addColorStop(1, `hsl(${hue},100%,35%)`);
        } else {
            g.addColorStop(0, '#3a3c4c');
            g.addColorStop(1, '#12131c');
        }
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.roundRect(x, y0, BK_W, BK_H, [0, 0, 3, 3]);
        ctx.fill();
        if (!lit) {
            ctx.fillStyle = 'rgba(255,255,255,0.10)';
            ctx.fillRect(x + 1, y0, BK_W - 2, BK_H * 0.70);
        }
    }
}

// ─── EQ Curve Drawing ────────────────────────────────────────────
let eqCalcCtx = null; // minimal OfflineAudioContext for getFrequencyResponse without live mic

function drawEQCurve() {
    if (!showEQCurve) return;
    if (eqBands.length === 0) return;

    const top = wfH;
    const h = EQ_H;
    const freqs = new Float32Array(N_KEYS);
    for (let k = 0; k < N_KEYS; k++) freqs[k] = midi2freq(MIDI_A0 + k);

    const magLinear = new Float32Array(N_KEYS);
    const phase = new Float32Array(N_KEYS);
    for (let k = 0; k < N_KEYS; k++) magLinear[k] = 1;

    // Use live eqNodes when audio is running; otherwise spin up temp filters
    let filterSrc;
    if (audioCtx && eqNodes.length === eqBands.length) {
        filterSrc = eqNodes;
    } else {
        if (!eqCalcCtx) eqCalcCtx = new OfflineAudioContext(1, 1, 44100);
        filterSrc = eqBands.map(b => {
            const f = eqCalcCtx.createBiquadFilter();
            f.type = b.type; f.frequency.value = b.freq; f.Q.value = b.q; f.gain.value = b.gain;
            return f;
        });
    }

    filterSrc.forEach(node => {
        const singleMag = new Float32Array(N_KEYS);
        node.getFrequencyResponse(freqs, singleMag, phase);
        for (let k = 0; k < N_KEYS; k++) magLinear[k] *= singleMag[k];
    });

    // draw background
    ctx.fillStyle = '#1e1e2f';
    ctx.fillRect(0, top, CANVAS_W, h);
    // grid
    ctx.strokeStyle = '#3a3a4a';
    ctx.lineWidth = 0.5;
    for (let db = -12; db <= 12; db += 3) {
        const y = top + h / 2 - (db / 12) * (h * 0.8);
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(CANVAS_W, y);
        ctx.stroke();
    }
    // 0 dB line thicker
    ctx.strokeStyle = '#5a5a6a';
    ctx.lineWidth = 1;
    const y0 = top + h / 2;
    ctx.beginPath(); ctx.moveTo(0, y0); ctx.lineTo(CANVAS_W, y0); ctx.stroke();

    // frequency labels (on bottom of EQ area)
    ctx.fillStyle = '#aaa';
    ctx.font = '8px sans-serif';
    ctx.textAlign = 'center';
    for (let k = 0; k < N_KEYS; k++) {
        if ((MIDI_A0 + k) % 12 === 0) { // C notes
            const x = k * COL_W + COL_W / 2;
            const freq = midi2freq(MIDI_A0 + k);
            ctx.fillText(freq.toFixed(0) + ' Hz', x, top + h - 4);
        }
    }

    // draw curve
    ctx.beginPath();
    ctx.strokeStyle = '#f59e0b';
    ctx.lineWidth = 2;
    let first = true;
    for (let k = 0; k < N_KEYS; k++) {
        const db = 20 * Math.log10(Math.max(magLinear[k], 1e-6));
        const y = y0 - (db / 12) * (h * 0.8);
        const x = k * COL_W + COL_W / 2;
        if (first) { ctx.moveTo(x, y); first = false; }
        else ctx.lineTo(x, y);
    }
    ctx.stroke();
}

// ─── Waterfall Row ───────────────────────────────────────────────
function addRow(sv, pm, beatLineType) {
    const d = wfBuf.data;
    const rowB = CANVAS_W * 4;
    const base = (wfH - 1) * rowB;
    d.copyWithin(0, rowB); // scroll up

    for (let k = 0; k < N_KEYS; k++) {
        const isBlk = isBlack(k);
        let r = isBlk ? 0 : 25;
        let g = isBlk ? 0 : 25;
        let b = isBlk ? 0 : 25;

        // metronome line brightness
        if (beatLineType === 1) { r += 60; g += 60; b += 60; }
        else if (beatLineType === 2) { r += 30; g += 30; b += 30; }

        if (pm[k]) {
            // MIDI mode: brightness proportional to velocity
            const isMidiActive = (midiEnabled || midiPlaybackActive) && midiActiveNotes.has(k);
            const displayVal = isMidiActive
                ? (midiNoteVelocity[k] / 127) * 0.85 + 0.10
                : sv[k];
            const v = Math.round(Math.min(1, Math.max(0, displayVal)) * 255);
            const lut = rainbow ? PC_LUT_COLOR[(MIDI_A0 + k) % 12] : MONO_LUT;
            r = Math.max(r, lut[v * 3]);
            g = Math.max(g, lut[v * 3 + 1]);
            b = Math.max(b, lut[v * 3 + 2]);
        }
        for (let px = 0; px < COL_W; px++) {
            const i = base + (k * COL_W + px) * 4;
            d[i] = r; d[i + 1] = g; d[i + 2] = b;
        }
    }
}

// ─── Cosine similarity against instrument profile ─────────────────
function computeProfileScores() {
    const scores = new Float32Array(N_KEYS);
    if (!instrProfile) return scores;
    let normSem = 0;
    for (let k = 0; k < N_KEYS; k++) normSem += semVals[k] * semVals[k];
    normSem = Math.sqrt(normSem) || 1e-9;
    for (let n = 0; n < N_KEYS; n++) {
        const prof = instrProfile[n];
        if (!prof) continue;
        let dot = 0, normP = 0;
        for (let k = 0; k < N_KEYS; k++) { dot += semVals[k] * prof[k]; normP += prof[k] * prof[k]; }
        scores[n] = dot / (normSem * (Math.sqrt(normP) || 1e-9));
    }
    return scores;
}

// ─── Animation Loop ──────────────────────────────────────────────
let lastRowTs = 0;
let mouseHeldKey = -1;  // key index held by mouse (-1 = none)

// MIDI-only frame loop (audio not running) — runs for MIDI keyboard, mouse, or MIDI playback
function midiOnlyFrame(ts) {
    if ((!midiEnabled && mouseHeldKey < 0 && !midiPlaybackActive) || running) { midiFrameId = null; return; }
    midiFrameId = requestAnimationFrame(midiOnlyFrame);
    peakMask.fill(0);
    for (const k of midiActiveNotes) if (k >= 0 && k < N_KEYS) peakMask[k] = 1;
    if (mouseHeldKey >= 0 && mouseHeldKey < N_KEYS) peakMask[mouseHeldKey] = 1;
    if (ts - lastRowTs >= rowMs) {
        lastRowTs = ts;
        addRow(semVals, peakMask, 0);
        ctx.putImageData(wfBuf, 0, 0);
    }
    drawKeyboard(peakMask);
}

// ─── MIDI-event playback ──────────────────────────────────────────
// In midiPlaybackMode we replay recorded events through the SF2 engine directly —
// no audio blob, no <audio> element, perfect sync by construction.
// In non-MIDI mode (mic recording) we keep the old audioEl approach.
function dispatchMidiPlaybackEvents() {
    if (!midiPlaybackActive) { midiPlaybackRaf = null; return; }

    if (midiPlaybackMode) {
        // ── Pure MIDI replay ──────────────────────────────────
        if (playbackWallStart === null) { midiPlaybackRaf = null; return; }
        const currentMs = performance.now() - playbackWallStart;

        while (midiPlaybackIndex < midiPlaybackEvents.length &&
               midiPlaybackEvents[midiPlaybackIndex].t <= currentMs) {
            const ev = midiPlaybackEvents[midiPlaybackIndex++];
            const midiNote = MIDI_A0 + ev.k;
            if (ev.type === 'on') {
                handleSF2NoteOn(0, midiNote, ev.vel);
                midiActiveNotes.add(ev.k);
                midiNoteVelocity[ev.k] = ev.vel;
            } else {
                handleSF2NoteOff(0, midiNote);
                midiActiveNotes.delete(ev.k);
                midiNoteVelocity[ev.k] = 0;
            }
        }

        // Finish when all events dispatched
        if (midiPlaybackIndex >= midiPlaybackEvents.length) {
            midiPlaybackActive = false;
            midiPlaybackMode = false;
            playbackWallStart = null;
            midiPlaybackRaf = null;
            document.getElementById('playBtn').textContent = '▶ Play';
            return;
        }

        midiPlaybackRaf = requestAnimationFrame(dispatchMidiPlaybackEvents);
        return;
    }

    // ── audioEl mode (mic recording) ─────────────────────────
    if (audioEl.ended) {
        midiActiveNotes.clear();
        midiNoteVelocity.fill(0);
        midiPlaybackActive = false;
        midiPlaybackRaf = null;
        return;
    }
    if (!audioEl.paused && playbackWallStart !== null) {
        const currentMs = performance.now() - playbackWallStart;
        while (midiPlaybackIndex < midiPlaybackEvents.length &&
               midiPlaybackEvents[midiPlaybackIndex].t <= currentMs) {
            const ev = midiPlaybackEvents[midiPlaybackIndex++];
            if (ev.type === 'on') {
                midiActiveNotes.add(ev.k);
                midiNoteVelocity[ev.k] = ev.vel;
            } else {
                midiActiveNotes.delete(ev.k);
                midiNoteVelocity[ev.k] = 0;
            }
        }
    }
    midiPlaybackRaf = requestAnimationFrame(dispatchMidiPlaybackEvents);
}

function frame(ts) {
    if (!running) return;
    requestAnimationFrame(frame);

    // ── Smooth audio energy ──
    for (let k = 0; k < N_KEYS; k++) semVals[k] = semVals[k] * 0.7 + targetVals[k] * 0.3;

    // ── Calibration accumulation ──
    if (calibOpen && calibRecording) {
        for (let k = 0; k < N_KEYS; k++) calibAccum[k] += semVals[k];
        calibFrames++;
        const pct = (calibFrames / CALIB_FRAMES * 100).toFixed(0);
        const recBar = document.getElementById('calibRecBar');
        if (recBar) recBar.style.width = pct + '%';
        if (calibFrames >= CALIB_FRAMES) finishCalibNote();
    }

    peakMask.fill(0);

    if (midiEnabled) {
        // ── MIDI mode: notes from keyboard ──
        for (const k of midiActiveNotes) if (k >= 0 && k < N_KEYS) peakMask[k] = 1;
    } else {
        // ── Audio detection ──

        // HPS boost: add weighted harmonic energy upward into each bin's fundamental
        for (let k = 0; k < N_KEYS; k++) {
            detVals[k] = semVals[k];
            if (hpsBoost) {
                for (let h = 0; h < HARM_OFFSETS.length; h++) {
                    const hk = k + HARM_OFFSETS[h];
                    if (hk < N_KEYS) detVals[k] += HPS_WEIGHTS[h] * semVals[hk];
                }
            }
        }

        let scoreVals = null;
        if (detMode === 1 || detMode === 2) scoreVals = computeProfileScores();

        // Build composite detection signal per mode
        const useVals = new Float32Array(N_KEYS);
        for (let k = 0; k < N_KEYS; k++) {
            if (detMode === 0) {
                useVals[k] = detVals[k];
            } else if (detMode === 1) {
                // Pure profile: cosine score (only valid notes have profile)
                useVals[k] = instrProfile && instrProfile[k] ? scoreVals[k] : 0;
            } else {
                // Combo: HPS-boosted * profile weight; falls back to peaks if no profile
                const w = (instrProfile && instrProfile[k]) ? (0.35 + 0.65 * scoreVals[k]) : 1.0;
                useVals[k] = detVals[k] * w;
            }
        }

        // Find local peaks
        const c = [];
        for (let k = 1; k < N_KEYS - 1; k++)
            if (useVals[k] > thresh && useVals[k] >= useVals[k - 1] && useVals[k] >= useVals[k + 1])
                c.push(k);
        c.sort((a, b) => useVals[b] - useVals[a]);

        // Harmonic suppression (modes 0 & 2; in pure-profile mode the profile handles this)
        const confirmed = [];
        for (const k of c) {
            if (harmSuppress && detMode !== 1) {
                let isHarm = false;
                for (const off of HARM_OFFSETS) {
                    const fk = k - off;
                    if (fk >= 0 && semVals[fk] >= semVals[k] * harmRatio) { isHarm = true; break; }
                }
                if (isHarm) continue;
            }
            confirmed.push(k);
            if (confirmed.length >= MAX_PK) break;
        }

        // Hysteresis: release notes only when energy drops below closeThresh
        const closeThresh = thresh * (1 - hysteresis);
        for (let k = 0; k < N_KEYS; k++) {
            if (noteState[k] && useVals[k] < closeThresh) noteState[k] = 0;
        }
        for (const k of confirmed) noteState[k] = 1;
        for (let k = 0; k < N_KEYS; k++) if (noteState[k]) peakMask[k] = 1;
    }

    if (ts - lastRowTs >= rowMs) {
        lastRowTs = ts;
        let bType = 0;
        if (visualBeatQueue.length > 0 && audioCtx && audioCtx.currentTime >= visualBeatQueue[0].time) {
            bType = visualBeatQueue.shift().type;
        }
        addRow(semVals, peakMask, bType);
        ctx.putImageData(wfBuf, 0, 0);
    }
    drawKeyboard(peakMask);
    if (showEQCurve) drawEQCurve();
}

// ─── Metronome Logic ─────────────────────────────────────────────
function generateNoiseClickBuffer() {
    const len = audioCtx.sampleRate * 0.03; // 30ms
    const buffer = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (len * 0.2));
    return buffer;
}

function playClick(time, gainLevel) {
    if (!metroActive || metroVol <= 0.01 || !noiseClickBuffer) return;
    const src = audioCtx.createBufferSource();
    src.buffer = noiseClickBuffer;
    const gainNode = audioCtx.createGain();
    src.connect(gainNode).connect(audioCtx.destination);
    gainNode.gain.setValueAtTime(gainLevel * metroVol, time);
    gainNode.gain.exponentialRampToValueAtTime(0.001, time + 0.03);
    src.start(time);
    src.stop(time + 0.03);
}

function updateBeatPattern() {
    beatPattern = [];
    if (beatsPerBar === 4) beatPattern = [1, 0, 2, 0]; // strong, weak, half, weak
    else if (beatsPerBar === 6) beatPattern = [1, 0, 0, 2, 0, 0];
    else {
        beatPattern = new Array(beatsPerBar).fill(0);
        beatPattern[0] = 1; // strong on first
    }
}

function scheduleMetronome() {
    if (!running || !metroActive) return;
    while (nextNoteTime < audioCtx.currentTime + 0.1) {
        const type = beatPattern[currentBeat];
        let gain = 0;
        if (type === 1) gain = 1.0;
        else if (type === 2) gain = 0.65;
        else gain = 0.35;
        playClick(nextNoteTime, gain);
        visualBeatQueue.push({ time: nextNoteTime, type: type });
        currentBeat = (currentBeat + 1) % beatsPerBar;
        nextNoteTime += 60.0 / bpm;
    }
    setTimeout(scheduleMetronome, 25);
}

// ─── EQ Management ───────────────────────────────────────────────
function rebuildAudioGraph() {
    if (!micSource || !cqtNode) return;
    micSource.disconnect();
    preGainNode.disconnect();
    eqNodes.forEach(n => n.disconnect());
    let prev = micSource;
    prev.connect(preGainNode);
    prev = preGainNode;
    eqNodes.forEach(n => { prev.connect(n); prev = n; });
    prev.connect(cqtNode);
}

function updateEQNode(idx) {
    if (!eqNodes[idx]) return;
    const d = eqBands[idx];
    eqNodes[idx].type = d.type;
    eqNodes[idx].frequency.value = d.freq;
    eqNodes[idx].Q.value = d.q;
    eqNodes[idx].gain.value = d.gain;
    eqCalcCtx = null; // force rebuild of temp filters next curve draw
    if (showEQCurve) drawEQCurve();
}

window.addEqBand = function () {
    const type = document.getElementById('eqType').value;
    eqBands.push({ id: Date.now(), type, freq: 1000, q: 1, gain: 0 });
    eqCalcCtx = null;
    if (audioCtx) {
        const filter = audioCtx.createBiquadFilter();
        eqNodes.push(filter);
        updateEQNode(eqBands.length - 1);
        rebuildAudioGraph();
    }
    renderEQUI();
};

window.removeEqBand = function (idx) {
    eqBands.splice(idx, 1);
    eqCalcCtx = null;
    if (audioCtx && eqNodes[idx]) {
        eqNodes[idx].disconnect();
        eqNodes.splice(idx, 1);
        rebuildAudioGraph();
    }
    renderEQUI();
    if (showEQCurve) drawEQCurve();
};

const LOG_MIN = Math.log10(20), LOG_MAX = Math.log10(15000);
function freqToSlider(freq) {
    return ((Math.log10(freq) - LOG_MIN) / (LOG_MAX - LOG_MIN)) * 100;
}
function sliderToFreq(val) {
    return Math.pow(10, LOG_MIN + (LOG_MAX - LOG_MIN) * (val / 100));
}

function renderEQUI() {
    const list = document.getElementById('eqList');
    list.innerHTML = '';
    eqBands.forEach((band, i) => {
        const tName = band.type === 'peaking' ? 'Полосовой' : (band.type === 'lowshelf' ? 'Low Shelf' : 'High Shelf');
        const sliderVal = freqToSlider(band.freq).toFixed(1);
        const html = `
        <div class="eq-band">
            <div class="eq-band-header">
                <span>${tName}</span>
                <button class="eq-del" onclick="removeEqBand(${i})">Удалить</button>
            </div>
            <div class="eq-sliders">
                <div class="eq-slider-col">
                    Freq: <span id="eqFv${i}">${band.freq.toFixed(0)}Hz</span>
                    <input type="range" min="0" max="100" step="0.1" value="${sliderVal}"
                        oninput="let freq=sliderToFreq(parseFloat(this.value)); eqBands[${i}].freq=freq; document.getElementById('eqFv${i}').innerText=freq.toFixed(0)+'Hz'; updateEQNode(${i});">
                </div>
                <div class="eq-slider-col">
                    Q: <span id="eqQv${i}">${band.q}</span>
                    <input type="range" min="0.1" max="20" step="0.1" value="${band.q}"
                        oninput="eqBands[${i}].q=parseFloat(this.value); document.getElementById('eqQv${i}').innerText=this.value; updateEQNode(${i});">
                </div>
                <div class="eq-slider-col">
                    Gain: <span id="eqGv${i}">${band.gain.toFixed(1)}dB</span>
                    <input type="range" min="-12" max="12" step="0.1" value="${band.gain}"
                        oninput="eqBands[${i}].gain=parseFloat(this.value); document.getElementById('eqGv${i}').innerText=parseFloat(this.value).toFixed(1)+'dB'; updateEQNode(${i});">
                </div>
            </div>
        </div>`;
        list.insertAdjacentHTML('beforeend', html);
    });
}

// ─── Recording / Playback / Save ─────────────────────────────────
async function startRecording() {
    let stream;
    if (midiEnabled) {
        // Record synthesized SF2 audio only — metronome (on audioCtx) is excluded
        const ctx = getSF2AC();
        sf2RecordDest = ctx.createMediaStreamDestination();
        sf2MasterGain.connect(sf2RecordDest);
        stream = sf2RecordDest.stream;
        midiRecordEvents = [];
        midiRecordStartTime = performance.now();
    } else {
        if (!micSource) return;
        stream = micSource.mediaStream;
    }

    const mimeType = (typeof MediaRecorder !== 'undefined' && MediaRecorder.isTypeSupported('audio/webm;codecs=opus'))
        ? 'audio/webm;codecs=opus' : 'audio/webm';
    mediaRecorder = new MediaRecorder(stream, { mimeType });
    const chunks = [];
    mediaRecorder.ondataavailable = e => chunks.push(e.data);
    mediaRecorder.onstop = () => {
        recordedBlob = new Blob(chunks, { type: 'audio/webm' });
        audioEl.src = URL.createObjectURL(recordedBlob);
        // Save MIDI events for roll display during playback
        midiPlaybackEvents = [...midiRecordEvents];
        midiPlaybackIndex = 0;
        // Disconnect recording dest
        if (sf2RecordDest) {
            try { sf2MasterGain.disconnect(sf2RecordDest); } catch(e) {}
            sf2RecordDest = null;
        }
        midiRecordStartTime = null;
        document.getElementById('playBtn').disabled = false;
        document.getElementById('saveBtn').disabled = false;
    };
    mediaRecorder.start();
}

// ─── Start / Stop Audio ──────────────────────────────────────────
async function startAudio() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
        });
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        await audioCtx.audioWorklet.addModule(URL.createObjectURL(new Blob([`
            class CQTFilterbank extends AudioWorkletProcessor {
                constructor() {
                    super();
                    this.N = 88; this.fs = sampleRate; this.Q = 17.31;
                    this.b0=new Float32Array(this.N); this.b1=new Float32Array(this.N); this.b2=new Float32Array(this.N);
                    this.a1=new Float32Array(this.N); this.a2=new Float32Array(this.N);
                    this.x1=new Float32Array(this.N); this.x2=new Float32Array(this.N);
                    this.y1=new Float32Array(this.N); this.y2=new Float32Array(this.N);
                    this.env=new Float32Array(this.N); this.envAlpha=new Float32Array(this.N);
                    for(let k=0;k<this.N;k++){
                        let freq=440*Math.pow(2,(21+k-69)/12), w0=2*Math.PI*freq/this.fs;
                        let alpha=Math.sin(w0)/(2*this.Q), a0=1+alpha;
                        this.b0[k]=alpha/a0; this.b1[k]=0; this.b2[k]=-alpha/a0;
                        this.a1[k]=(-2*Math.cos(w0))/a0; this.a2[k]=(1-alpha)/a0;
                        this.envAlpha[k]=Math.exp(-1.0/(this.fs*Math.max(1.0/freq*4,0.01)));
                    }
                    this.samplesCount=0;
                }
                process(inputs){
                    const input=inputs[0][0]; if(!input) return true;
                    for(let i=0;i<input.length;i++){
                        let x=input[i];
                        for(let k=0;k<this.N;k++){
                            let y=this.b0[k]*x+this.b1[k]*this.x1[k]+this.b2[k]*this.x2[k]-this.a1[k]*this.y1[k]-this.a2[k]*this.y2[k];
                            this.x2[k]=this.x1[k]; this.x1[k]=x; this.y2[k]=this.y1[k]; this.y1[k]=y;
                            this.env[k]=this.env[k]*this.envAlpha[k]+(y*y)*(1-this.envAlpha[k]);
                        }
                    }
                    this.samplesCount+=input.length;
                    if(this.samplesCount>=this.fs/60){ this.port.postMessage(new Float32Array(this.env)); this.samplesCount=0; }
                    return true;
                }
            }
            registerProcessor('cqt-filterbank', CQTFilterbank);
        `], { type: 'application/javascript' })));

        micSource = audioCtx.createMediaStreamSource(stream);
        preGainNode = audioCtx.createGain();
        preGainNode.gain.value = parseFloat(document.getElementById('sPreG').value);

        // restore EQ nodes
        eqNodes = eqBands.map(b => {
            const f = audioCtx.createBiquadFilter();
            f.type = b.type; f.frequency.value = b.freq; f.Q.value = b.q; f.gain.value = b.gain;
            return f;
        });
        cqtNode = new AudioWorkletNode(audioCtx, 'cqt-filterbank');
        cqtNode.port.onmessage = e => {
            const energies = e.data;
            for (let k = 0; k < N_KEYS; k++) targetVals[k] = Math.sqrt(energies[k]) * visGain;
        };
        rebuildAudioGraph();

        // metronome noise buffer
        noiseClickBuffer = generateNoiseClickBuffer();
        updateBeatPattern();
        nextNoteTime = audioCtx.currentTime + 0.1;
        currentBeat = 0;

        running = true;
        // If MIDI-only loop was running, stop it (main frame() handles MIDI too)
        if (midiFrameId) { cancelAnimationFrame(midiFrameId); midiFrameId = null; }
        const btn = document.getElementById('startBtn');
        btn.textContent = '■ Stop'; btn.classList.add('on');
        scheduleMetronome();
        requestAnimationFrame(frame);
    } catch (e) { alert('Ошибка микрофона: ' + e.message); }
}

function stopAudio() {
    if (!running) return;
    running = false; calibRecording = false;
    if (audioCtx) { audioCtx.close(); audioCtx = null; }
    micSource = null; cqtNode = null; preGainNode = null;
    eqNodes = [];
    visualBeatQueue.length = 0;
    const btn = document.getElementById('startBtn');
    btn.textContent = '▶ Start'; btn.classList.remove('on');
    // Resume MIDI-only loop if MIDI is still on
    if (midiEnabled) { lastRowTs = 0; midiFrameId = requestAnimationFrame(midiOnlyFrame); }
}

function parseSF2(ab) {
    const v = new DataView(ab);
    const fcc = o => String.fromCharCode(v.getUint8(o),v.getUint8(o+1),v.getUint8(o+2),v.getUint8(o+3));
    if (fcc(0)!=='RIFF') throw new Error('Not a RIFF file');
    if (fcc(8)!=='sfbk') throw new Error('Not SF2 (sfbk)');
    const lists = {};
    let off = 12;
    while (off+8 <= ab.byteLength) {
        const id = fcc(off), sz = v.getUint32(off+4,true);
        if (id==='LIST') {
            const lid = fcc(off+8), sub = {};
            let so=off+12, se=off+8+sz;
            while (so+8<=se) {
                const sid=fcc(so), ssz=v.getUint32(so+4,true);
                sub[sid]={start:so+8,size:ssz}; so+=8+ssz; if(so&1)so++;
            }
            lists[lid]=sub;
        }
        off+=8+sz; if(off&1)off++;
    }
    const sdta=lists.sdta||{}, pdta=lists.pdta||{};
    const smpl=sdta.smpl;
    if (!smpl) throw new Error('No smpl chunk');
    for (const k of ['shdr','inst','ibag','igen','phdr','pbag','pgen'])
        if (!pdta[k]) throw new Error('Missing SF2 chunk: '+k);
    const C=pdta;
    const shdrN=Math.floor(C.shdr.size/46), shdrs=[];
    for (let i=0;i<shdrN;i++) {
        const o=C.shdr.start+i*46, st=v.getUint16(o+44,true);
        if (st===0||(st&0x8000)){shdrs.push(null);continue;}
        const dS=v.getUint32(o+20,true), dE=v.getUint32(o+24,true);
        if (dE<=dS){shdrs.push(null);continue;}
        shdrs.push({dS,dE,dSl:v.getUint32(o+28,true),dEl:v.getUint32(o+32,true),
            sr:v.getUint32(o+36,true),pitch:v.getUint8(o+40),fine:v.getUint8(o+41)});
    }
    const ibagN=Math.floor(C.ibag.size/4), ibagG=new Uint16Array(ibagN);
    for(let i=0;i<ibagN;i++) ibagG[i]=v.getUint16(C.ibag.start+i*4,true);
    const igenN=Math.floor(C.igen.size/4), iOp=new Uint16Array(igenN), iAm=new Uint16Array(igenN);
    for(let i=0;i<igenN;i++){const o=C.igen.start+i*4;iOp[i]=v.getUint16(o,true);iAm[i]=v.getUint16(o+2,true);}
    const instN=Math.floor(C.inst.size/22), instB=new Uint16Array(instN);
    for(let i=0;i<instN;i++) instB[i]=v.getUint16(C.inst.start+i*22+20,true);
    function buildZones(ii) {
        if (ii>=instN-1) return [];
        const bs=instB[ii], be=instB[ii+1], zones=[];
        for (let b=bs;b<be;b++) {
            const gs=ibagG[b], ge=(b+1<ibagN)?ibagG[b+1]:igenN;
            let kl=0,kh=127,vl=0,vh=127,sid=-1,rk=-1,ct=0,ft=0,sc=100;
            let atk=-12000,dec=-12000,sus=0,rel=-12000; // SF2 envelope timecents/cB
            for (let g=gs;g<ge;g++) {
                const op=iOp[g],am=iAm[g];
                const sam=(am>32767)?am-65536:am; // signed interpretation
                if(op===43){kl=am&0xFF;kh=(am>>8)&0xFF;}
                if(op===44){vl=am&0xFF;vh=(am>>8)&0xFF;}
                if(op===51){ct=am&0xFF;if(ct>127)ct-=256;}
                if(op===52){ft=am&0xFF;if(ft>127)ft-=256;}
                if(op===53) sid=am;
                if(op===56) sc=am&0xFFFF;
                if(op===58){const rr=am&0xFF;if(rr<=127)rk=rr;}
                if(op===33) atk=sam;   // attackVolEnv (timecents)
                if(op===35) dec=sam;   // decayVolEnv  (timecents)
                if(op===36) sus=am;    // sustainVolEnv (centiBels attenuation, unsigned)
                if(op===38) rel=sam;   // releaseVolEnv (timecents)
            }
            if (sid>=0 && sid<shdrs.length && shdrs[sid]) {
                const sh=shdrs[sid];
                const sf=sh.fine>127?sh.fine-256:sh.fine;
                zones.push({kl,kh,vl,vh,sid,rk:rk>=0?rk:sh.pitch,ct,ft:ft+sf,
                    sc:sc>0?sc:100,lS:sh.dSl-sh.dS,lE:sh.dEl-sh.dS,
                    hasLoop:sh.dEl>sh.dSl&&sh.dSl>=sh.dS,
                    atk,dec,sus,rel});
            }
        }
        return zones;
    }
    const pbagN=Math.floor(C.pbag.size/4), pbagG=new Uint16Array(pbagN);
    for(let i=0;i<pbagN;i++) pbagG[i]=v.getUint16(C.pbag.start+i*4,true);
    const pgenN=Math.floor(C.pgen.size/4), pOp=new Uint16Array(pgenN), pAm=new Uint16Array(pgenN);
    for(let i=0;i<pgenN;i++){const o=C.pgen.start+i*4;pOp[i]=v.getUint16(o,true);pAm[i]=v.getUint16(o+2,true);}
    const phdrN=Math.floor(C.phdr.size/38);
    const progZ={}, percZ={};
    for (let i=0;i<phdrN-1;i++) {
        const o=C.phdr.start+i*38;
        const preset=v.getUint16(o+20,true), bank=v.getUint16(o+22,true);
        if(bank!==0&&bank!==128) continue;
        const bs=v.getUint16(o+24,true), be=v.getUint16(C.phdr.start+(i+1)*38+24,true);
        const zones=[];
        for(let b=bs;b<be;b++){
            const gs=pbagG[b], ge=(b+1<pbagN)?pbagG[b+1]:pgenN;
            for(let g=gs;g<ge;g++) if(pOp[g]===41) zones.push(...buildZones(pAm[g]));
        }
        if(zones.length>0) (bank===128?percZ:progZ)[preset]=zones;
    }
    if (!Object.keys(progZ).length && !Object.keys(percZ).length)
        throw new Error('No GM presets found');
    return {v, smplOff:smpl.start, shdrs, progZ, percZ};
}

function sf2Buf(ctx, sf2d, cache, sid) {
    if (cache[sid]) return cache[sid];
    const sh=sf2d.shdrs[sid];
    if (!sh||sh.sr<=0) return null;
    const n=sh.dE-sh.dS; if(n<=0||n>8e6) return null;
    const buf=ctx.createBuffer(1,n,sh.sr), data=buf.getChannelData(0);
    const base=sf2d.smplOff+sh.dS*2;
    for(let i=0;i<n;i++) data[i]=sf2d.v.getInt16(base+i*2,true)/32768;
    cache[sid]=buf; return buf;
}

function sf2Zone(sf2d, prog, note, vel, isPerc) {
    let zones;
    if (isPerc) {
        zones = sf2d.percZ[prog] || sf2d.percZ[0] || sf2d.progZ[0];
    } else {
        zones = sf2d.progZ[prog];
        if (!zones) {
            const ks=Object.keys(sf2d.progZ).map(Number).sort((a,b)=>a-b);
            if (!ks.length) return null;
            zones=sf2d.progZ[ks.reduce((p,c)=>Math.abs(c-prog)<Math.abs(p-prog)?c:p)];
        }
    }
    if (!zones) return null;
    const vv=vel??64;
    return zones.find(z=>note>=z.kl&&note<=z.kh&&vv>=(z.vl||0)&&vv<=(z.vh||127))
        || zones.find(z=>note>=z.kl&&note<=z.kh)
        || zones[0];
}

function sf2Play(ctx, sf2d, cache, note, prog, t0, gain, vel, dest, isPerc) {
    if (!sf2d||!ctx) return null;
    const zone=sf2Zone(sf2d, prog, note, vel, isPerc);
    if (!zone) return null;
    const ab=sf2Buf(ctx, sf2d, cache, zone.sid);
    if (!ab) return null;
    const cents = isPerc
        ? zone.ct*100 + zone.ft
        : (note-zone.rk)*zone.sc + zone.ct*100 + zone.ft;
    const rate = Math.pow(2, cents / 1200);

    const src = ctx.createBufferSource();
    src.buffer = ab;
    src.playbackRate.value = rate;

    // ── Loop: enable exactly as in the SF2 zone (WebScore approach) ──────────
    // Let the sample's own loop control sustain: looping = sustained instrument
    // (piano, organ, strings…); non-looping = percussive (xylophone, marimba…).
    if (zone.hasLoop && zone.lE > zone.lS && zone.lE <= ab.length) {
        src.loop      = true;
        src.loopStart = zone.lS / ab.sampleRate;
        src.loopEnd   = zone.lE / ab.sampleRate;
    }

    const gn = ctx.createGain();
    const sg = Math.max(0.001, Math.min(2, gain));
    gn.gain.setValueAtTime(sg, t0);   // full gain from the start — no artificial ADSR

    src.connect(gn);
    gn.connect(dest || ctx.destination);
    src.start(t0);

    // Non-looping: play to natural sample end (natural decay built into sample)
    if (!src.loop) {
        const naturalDur = ab.duration / rate;
        src.stop(t0 + Math.min(naturalDur + 0.05, 30));
    }

    return {
        src, gn,
        stop() { try { gn.gain.cancelScheduledValues(0); src.stop(0); } catch(e){} },
        // stopAt: called on note-off or sustain-pedal release.
        // 50 ms fade mirrors WebScore's "short click-prevention fade".
        stopAt(t) {
            try {
                const rt = Math.max(t0 + 0.001, t);
                const rel = 0.05; // 50 ms — long enough to avoid clicks, short enough for staccato
                if (gn.gain.cancelAndHoldAtTime) {
                    gn.gain.cancelAndHoldAtTime(rt);
                } else {
                    gn.gain.cancelScheduledValues(rt);
                    gn.gain.setValueAtTime(gn.gain.value, rt);
                }
                gn.gain.linearRampToValueAtTime(0.0001, rt + rel);
                src.stop(rt + rel + 0.01);
            } catch(e) {}
        }
    };
}

function getSF2AC() {
    if (!sf2AC || sf2AC.state === 'closed') {
        sf2AC = new (window.AudioContext || window.webkitAudioContext)();
        sf2Cache = {};
        sf2MasterGain = sf2AC.createGain();
        sf2MasterGain.gain.value = sf2MidiVolume;
        sf2MasterGain.connect(sf2AC.destination);
    }
    if (sf2AC.state === 'suspended') sf2AC.resume();
    return sf2AC;
}

function handleSF2NoteOn(channel, note, velocity) {
    if (!sf2) return;
    const ctx = getSF2AC();
    const key = channel * 128 + note;
    if (activeNoteNodes.has(key)) { activeNoteNodes.get(key).stopAt(ctx.currentTime); activeNoteNodes.delete(key); }
    const prog = channelPrograms[channel];
    const isPerc = (channel === 9);
    // Route to master gain so volume slider and recording destination both work
    const node = sf2Play(ctx, sf2, sf2Cache, note, prog, ctx.currentTime, velocity / 127, velocity, sf2MasterGain, isPerc);
    if (node) activeNoteNodes.set(key, node);
}

function handleSF2NoteOff(channel, note) {
    const key = channel * 128 + note;
    if (!activeNoteNodes.has(key)) return;
    const ctx = sf2AC;
    if (ctx) activeNoteNodes.get(key).stopAt(ctx.currentTime);
    else activeNoteNodes.get(key).stop();
    activeNoteNodes.delete(key);
}

function sf2AllNotesOff() {
    activeNoteNodes.forEach(n => { try { n.stop(); } catch(e){} });
    activeNoteNodes.clear();
    sustainHeld.clear();
    sustainPedal = false;
    midiNoteVelocity.fill(0);
}

function buildMidiChanSel() {

    sel.innerHTML = '<option value="-1">Все</option>';
    for (let i = 0; i < 16; i++)
        sel.innerHTML += `<option value="${i}">${i+1}${i===9?' (ударн.)':''}</option>`;

function buildMidiProgSel() {
    const sel = document.getElementById('midiProgSel');
    sel.innerHTML = '';
    if (sf2) {
        // Show presets available in SF2
        const isPerc = (midiChannelFilter === 9);
        const map = isPerc ? sf2.percZ : sf2.progZ;
        const ids = Object.keys(map).map(Number).sort((a,b)=>a-b);
        for (const id of ids) {
            const opt = document.createElement('option');
            opt.value = id;
            opt.textContent = isPerc ? `${id}: (percussion)` : `${id}: ${GM_NAMES[id]||'?'}`;
            sel.appendChild(opt);
        }
    } else {
        // GM fallback
        for (let i = 0; i < 128; i++) {
            const opt = document.createElement('option');
            opt.value = i;
            opt.textContent = `${i}: ${GM_NAMES[i]}`;
            sel.appendChild(opt);
        }
    }
    const ch = midiChannelFilter >= 0 ? midiChannelFilter : 0;
    sel.value = String(channelPrograms[ch]);
}

// ─── MIDI ────────────────────────────────────────────────────────
function handleMIDIMessage(msg) {
    const data = msg.data;
    if (!data || data.length < 2) return;
    const status = data[0], note = data[1], velocity = data.length > 2 ? data[2] : 0;
    const cmd = status & 0xF0;
    const channel = status & 0x0F;

    // Channel filter
    if (midiChannelFilter >= 0 && channel !== midiChannelFilter) return;

    // Program change
    if (cmd === 0xC0) {
        channelPrograms[channel] = note;
        if (midiChannelFilter < 0 || midiChannelFilter === channel) {
            const sel = document.getElementById('midiProgSel');
            if (sel) sel.value = String(note);
        }
        return;
    }

    // Control change (CC)
    if (cmd === 0xB0) {
        if (note === 64) { // sustain pedal
            const pedOn = velocity >= 64;
            if (sustainPedal && !pedOn) {
                // Pedal released → send deferred note-offs
                for (const [k, ch] of sustainHeld) {
                    handleSF2NoteOff(ch, k + MIDI_A0);
                    midiActiveNotes.delete(k);
                    midiNoteVelocity[k] = 0;
                    // Record note-off event
                    if (mediaRecorder && mediaRecorder.state === 'recording' && midiRecordStartTime !== null) {
                        midiRecordEvents.push({ t: performance.now() - midiRecordStartTime, type: 'off', k, vel: 0 });
                    }
                }
                sustainHeld.clear();
            }
            sustainPedal = pedOn;
        }
        return;
    }

    const k = note - MIDI_A0;
    if (cmd === 0x90 && velocity > 0) {
        // Note On
        if (k >= 0 && k < N_KEYS) {
            midiActiveNotes.add(k);
            midiNoteVelocity[k] = velocity;
            sustainHeld.delete(k); // cancel any pending deferred off
        }
        handleSF2NoteOn(channel, note, velocity);
        // Record MIDI event
        if (mediaRecorder && mediaRecorder.state === 'recording' && midiRecordStartTime !== null) {
            midiRecordEvents.push({ t: performance.now() - midiRecordStartTime, type: 'on', k, vel: velocity });
        }
    } else if (cmd === 0x80 || (cmd === 0x90 && velocity === 0)) {
        // Note Off
        if (k >= 0 && k < N_KEYS) {
            if (sustainPedal) {
                // Defer actual off until pedal releases
                sustainHeld.set(k, channel);
            } else {
                midiActiveNotes.delete(k);
                midiNoteVelocity[k] = 0;
                handleSF2NoteOff(channel, note);
                // Record MIDI event
                if (mediaRecorder && mediaRecorder.state === 'recording' && midiRecordStartTime !== null) {
                    midiRecordEvents.push({ t: performance.now() - midiRecordStartTime, type: 'off', k, vel: 0 });
                }
            }
        }
    }
}

async function toggleMIDI() {
    const btn = document.getElementById('midiBtn');
    if (midiEnabled) {
        midiEnabled = false;
        midiActiveNotes.clear();
        sf2AllNotesOff();
        if (midiFrameId) { cancelAnimationFrame(midiFrameId); midiFrameId = null; }
        btn.textContent = '🎹 MIDI'; btn.classList.remove('midi-on'); btn.style.background = '#7c3aed';
        document.getElementById('midiExtControls').style.display = 'none';
        return;
    }
    if (!navigator.requestMIDIAccess) { alert('Web MIDI API не поддерживается этим браузером.\nИспользуйте Chrome или Edge.'); return; }
    try {
        midiAccess = await navigator.requestMIDIAccess({ sysex: false });
        const attach = inp => { inp.onmidimessage = handleMIDIMessage; };
        for (const inp of midiAccess.inputs.values()) attach(inp);
        midiAccess.onstatechange = e => { if (e.port.type === 'input' && e.port.state === 'connected') attach(e.port); };
        midiEnabled = true;
        btn.textContent = '🎹 MIDI ✓'; btn.classList.add('midi-on'); btn.style.background = '';
        const n = midiAccess.inputs.size;
        btn.title = n === 0 ? 'MIDI включён — устройств не найдено' : `MIDI включён: ${n} устройств`;
        // Show extended controls and populate selects
        document.getElementById('midiExtControls').style.display = 'flex';
        buildMidiChanSel();
        buildMidiProgSel();
        // Start MIDI-only loop if audio not running
        if (!running) { lastRowTs = 0; midiFrameId = requestAnimationFrame(midiOnlyFrame); }
    } catch(e) { alert('MIDI ошибка: ' + e.message); }
}

function updateCalibUI() {

    const midi = MIDI_A0 + k;

    document.getElementById('calibNFreq').textContent = midi2freq(midi).toFixed(2) + ' Hz';

    document.getElementById('calibMsg').textContent = instrProfile && instrProfile[k]
        ? '✅ Записана — можно перезаписать' : 'Сыграйте ноту и нажмите Записать';
    document.getElementById('calibRecBar').style.width = '0%';
    // Profile status
    const recorded = instrProfile ? instrProfile.filter(Boolean).length : 0;
    document.getElementById('calibProfileStatus').textContent =
        `Профиль: ${recorded} / ${N_KEYS} нот записано`;
    // Dots visualization (compact 88-dot grid)
    if (!instrProfile) { document.getElementById('calibDots').innerHTML = ''; return; }
    let html = '';
    for (let i = 0; i < N_KEYS; i++) {
        const clr = i === k ? '#0891b2' : (instrProfile[i] ? '#16a34a' : '#d1d5db');
        html += `<span class="note-dot" style="background:${clr}" title="${midi2name(MIDI_A0+i)}"></span>`;
    }
    document.getElementById('calibDots').innerHTML = html;
}

function startCalibRecord() {
    if (!running) { alert('Сначала запустите микрофон (▶ Start)'); return; }
    calibAccum.fill(0); calibFrames = 0; calibRecording = true;
    document.getElementById('calibRecBtn').textContent = '⏺ Запись…';
    document.getElementById('calibRecBtn').disabled = true;
    document.getElementById('calibMsg').textContent = 'Удерживайте ноту…';
}

function finishCalibNote() {
    calibRecording = false;
    if (!instrProfile) instrProfile = new Array(N_KEYS).fill(null);
    // Average & normalize
    let mx = 0;
    for (let k = 0; k < N_KEYS; k++) { calibAccum[k] /= calibFrames; if (calibAccum[k] > mx) mx = calibAccum[k]; }
    if (mx > 0) for (let k = 0; k < N_KEYS; k++) calibAccum[k] /= mx;
    instrProfile[calibNoteIdx] = new Float32Array(calibAccum);
    const btn = document.getElementById('calibRecBtn');
    if (btn) { btn.textContent = '⏺ Записать (2с)'; btn.disabled = false; }
    // Auto-advance
    if (calibNoteIdx < N_KEYS - 1) calibNoteIdx++;
    updateCalibUI();
}

function calibGo(delta) {
    calibRecording = false;
    calibNoteIdx = Math.max(0, Math.min(N_KEYS - 1, calibNoteIdx + delta));
    const btn = document.getElementById('calibRecBtn');
    if (btn) { btn.textContent = '⏺ Записать (2с)'; btn.disabled = false; }
    updateCalibUI();
}

function clearProfile() {
    if (!confirm('Очистить весь профиль инструмента?')) return;
    instrProfile = null;
    updateCalibUI();
}

// ─── Profile save / load ──────────────────────────────────────────
function saveProfile() {
    if (!instrProfile || !instrProfile.some(Boolean)) { alert('Профиль пуст — нечего сохранять.'); return; }
    const recorded = instrProfile.map(v => v ? Array.from(v) : null);
    const blob = new Blob([JSON.stringify({ instrument: 'My Piano', date: new Date().toISOString(), profiles: recorded }, null, 1)],
        { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'instrument_profile.json'; a.click();
}

function loadProfileFromJSON(json) {
    if (!json.profiles || !Array.isArray(json.profiles)) throw new Error('Неверный формат профиля');
    instrProfile = json.profiles.map(v => v ? new Float32Array(v) : null);
    if (calibOpen) updateCalibUI();
}

document.getElementById('saveProfileBtn').addEventListener('click', saveProfile);
document.getElementById('loadProfileInput').addEventListener('change', function(e) {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = () => { try { loadProfileFromJSON(JSON.parse(reader.result)); alert('Профиль загружен!'); } catch(err) { alert('Ошибка: ' + err); } };
    reader.readAsText(file); e.target.value = '';
});
document.getElementById('midiBtn').addEventListener('click', toggleMIDI);
document.getElementById('detModeSelect').addEventListener('change', e => { detMode = parseInt(e.target.value); });

// SF2 file load
document.getElementById('sf2Input').addEventListener('change', async function(e) {
    const file = e.target.files[0]; if (!file) return;
    const stat = document.getElementById('sf2LoadStatus');
    stat.textContent = '⏳ Загрузка…';
    try {
        const ab = await file.arrayBuffer();
        sf2 = parseSF2(ab);
        sf2Cache = {};
        const np = Object.keys(sf2.progZ).length, nd = Object.keys(sf2.percZ).length;
        stat.textContent = `✅ ${file.name.replace(/\.sf2$/i,'')} (${np}+${nd})`;
        buildMidiProgSel(); // repopulate with SF2 presets
    } catch(err) {
        sf2 = null;
        stat.textContent = '❌ Ошибка SF2';
        console.error('SF2 parse error:', err);
        alert('Ошибка загрузки SF2: ' + err.message);
    }
    e.target.value = '';
});

// MIDI channel filter
document.getElementById('midiChanSel').addEventListener('change', function() {
    midiChannelFilter = parseInt(this.value);
    sf2AllNotesOff();
    buildMidiProgSel();
});

// Program selection
document.getElementById('midiProgSel').addEventListener('change', function() {
    const prog = parseInt(this.value);
    if (midiChannelFilter >= 0) {
        channelPrograms[midiChannelFilter] = prog;
    } else {
        channelPrograms.fill(prog);
    }
});

document.getElementById('startBtn').addEventListener('click', () => {
    if (!running) startAudio(); else stopAudio();
});

// Metronome toggle
document.getElementById('metroToggle').addEventListener('click', function () {
    metroActive = !metroActive;
    this.classList.toggle('on', metroActive);
    this.textContent = metroActive ? '🔊 Метроном' : '🔇 Метроном';
    if (metroActive && running) {
        nextNoteTime = audioCtx.currentTime + 0.05;
        scheduleMetronome();
    }
});

// Sliders spoiler
document.getElementById('toggleSlidersBtn').addEventListener('click', function () {
    const container = document.getElementById('slidersContainer');
    container.classList.toggle('hidden-sliders');
    this.textContent = container.classList.contains('hidden-sliders') ? 'Показать слайдеры' : 'Скрыть слайдеры';
});

// Rainbow checkbox
document.getElementById('rainbowChk').addEventListener('change', e => {
    rainbow = e.target.checked;
});

// EQ curve checkbox
document.getElementById('eqShowCurveChk').addEventListener('change', e => {
    showEQCurve = e.target.checked;
    eqCalcCtx = null; // fresh temp filters on next draw
    resizeCanvas();
    if (showEQCurve && eqBands.length > 0) drawEQCurve();
});

// Metronome settings
document.getElementById('sBpm').addEventListener('input', e => {
    bpm = parseInt(e.target.value);
    document.getElementById('vBpm').innerText = e.target.value;
});
document.getElementById('sMVol').addEventListener('input', e => {
    metroVol = parseFloat(e.target.value) / 100;
    document.getElementById('vMVol').innerText = e.target.value + '%';
});
document.getElementById('mSig').addEventListener('change', e => {
    beatsPerBar = parseInt(e.target.value);
    currentBeat = 0;
    updateBeatPattern();
});

// Slider bindings
function bindSlider(id, updateFn) {
    document.getElementById(id).addEventListener('input', e => updateFn(e.target.value));
}
bindSlider('sPreG', v => {
    if (preGainNode) preGainNode.gain.value = parseFloat(v);
    document.getElementById('vPreG').innerText = parseFloat(v).toFixed(1) + '×';
});
bindSlider('sG', v => { visGain = parseFloat(v); document.getElementById('vG').innerText = v + '×'; });
bindSlider('sR', v => { rowMs = 1000 / parseFloat(v); document.getElementById('vR').innerText = v + '/с'; });
bindSlider('sTh', v => { thresh = parseFloat(v) / 100; document.getElementById('vTh').innerText = v + '%'; });
bindSlider('sHyst', v => { hysteresis = parseFloat(v) / 100; document.getElementById('vHyst').innerText = v + '%'; });
bindSlider('sHarm', v => { harmRatio = parseFloat(v) / 100; document.getElementById('vHarm').innerText = v + '%'; });

document.getElementById('harmSuppChk').addEventListener('change', e => { harmSuppress = e.target.checked; });
document.getElementById('hpsChk').addEventListener('change', e => { hpsBoost = e.target.checked; });

// Record / Play / Save
document.getElementById('recBtn').addEventListener('click', () => {
    // In MIDI mode: work without mic; in mic mode: require running
    if (!midiEnabled && !running) return;

    if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
        document.getElementById('recBtn').classList.remove('on');
        document.getElementById('recBtn').textContent = '⏺ Rec';
    } else {
        startRecording();
        document.getElementById('recBtn').classList.add('on');
        document.getElementById('recBtn').textContent = '⏺ Rec ●';
    }
});

document.getElementById('playBtn').addEventListener('click', () => {
    // ── MIDI recording exists → replay via SF2 engine (perfect sync, no blob) ──
    if (midiPlaybackEvents.length > 0) {
        if (midiPlaybackActive && midiPlaybackMode) {
            // Pause: stop dispatching and silence all audio
            midiPlaybackActive = false;
            midiPlaybackMode = false;
            playbackWallStart = null;
            sf2AllNotesOff();
            midiActiveNotes.clear();
            midiNoteVelocity.fill(0);
            document.getElementById('playBtn').textContent = '▶ Play';
        } else {
            startMidiEventPlayback();
        }
        return;
    }

    // ── Mic recording → audioEl playback ──
    if (!audioEl.src) return;
    if (audioEl.paused) {
        audioEl.play();
        playbackWallStart = performance.now();
        document.getElementById('playBtn').textContent = '⏸ Play';
    } else {
        audioEl.pause();
        playbackWallStart = null;
        document.getElementById('playBtn').textContent = '▶ Play';
    }
});

// Double-click on Play → restart from the very beginning
document.getElementById('playBtn').addEventListener('dblclick', () => {
    if (midiPlaybackEvents.length > 0) {
        startMidiEventPlayback();
        return;
    }
    if (!audioEl.src) return;
    audioEl.pause();
    audioEl.currentTime = 0;
    midiPlaybackActive = false;
    midiActiveNotes.clear();
    midiNoteVelocity.fill(0);
    midiPlaybackIndex = 0;
    cancelAnimationFrame(midiPlaybackRaf);
    midiPlaybackRaf = null;
    audioEl.play();
    playbackWallStart = performance.now();
    document.getElementById('playBtn').textContent = '⏸ Play';
});

// Helper: start MIDI-event replay via SF2 from the beginning
function startMidiEventPlayback() {
    if (midiPlaybackRaf) { cancelAnimationFrame(midiPlaybackRaf); midiPlaybackRaf = null; }
    sf2AllNotesOff();
    midiActiveNotes.clear();
    midiNoteVelocity.fill(0);
    midiPlaybackIndex = 0;
    midiPlaybackActive = true;
    midiPlaybackMode = true;
    playbackWallStart = performance.now();
    lastRowTs = 0;
    if (!running && !midiFrameId) midiFrameId = requestAnimationFrame(midiOnlyFrame);
    midiPlaybackRaf = requestAnimationFrame(dispatchMidiPlaybackEvents);
    document.getElementById('playBtn').textContent = '⏸ Play';
}

audioEl.addEventListener('ended', () => {
    midiActiveNotes.clear();
    midiNoteVelocity.fill(0);
    midiPlaybackActive = false;
    playbackWallStart = null;
    document.getElementById('playBtn').textContent = '▶ Play';
});
audioEl.addEventListener('pause', () => {
    playbackWallStart = null;
    document.getElementById('playBtn').textContent = '▶ Play';
});

document.getElementById('saveBtn').addEventListener('click', () => {
    if (!recordedBlob) return;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(recordedBlob);
    a.download = 'recording.webm';
    a.click();
});

// MIDI volume slider
bindSlider('sMidiVol', v => {
    sf2MidiVolume = parseFloat(v) / 100;
    if (sf2MasterGain) sf2MasterGain.gain.value = sf2MidiVolume;
    document.getElementById('vMidiVol').innerText = v + '%';
});

// Config save / load
function gatherConfig() {
    return {
        preGain: parseFloat(document.getElementById('sPreG').value),
        visGain: parseFloat(document.getElementById('sG').value),
        speed: parseFloat(document.getElementById('sR').value),
        thresh: parseFloat(document.getElementById('sTh').value),
        bpm: bpm,
        metroVol: metroVol,
        beatsPerBar: beatsPerBar,
        metroActive: metroActive,
        rainbow: rainbow,
        harmSuppress: harmSuppress,
        harmRatio: harmRatio,
        hpsBoost: hpsBoost,
        eqBands: eqBands.map(b => ({ type: b.type, freq: b.freq, q: b.q, gain: b.gain }))
    };
}
function applyConfig(cfg) {
    document.getElementById('sPreG').value = cfg.preGain;
    document.getElementById('sPreG').dispatchEvent(new Event('input'));
    document.getElementById('sG').value = cfg.visGain;
    document.getElementById('sG').dispatchEvent(new Event('input'));
    document.getElementById('sR').value = cfg.speed;
    document.getElementById('sR').dispatchEvent(new Event('input'));
    document.getElementById('sTh').value = cfg.thresh;
    document.getElementById('sTh').dispatchEvent(new Event('input'));
    bpm = cfg.bpm; document.getElementById('sBpm').value = cfg.bpm; document.getElementById('vBpm').innerText = cfg.bpm;
    metroVol = cfg.metroVol; document.getElementById('sMVol').value = cfg.metroVol * 100; document.getElementById('vMVol').innerText = (cfg.metroVol*100).toFixed(0)+'%';
    beatsPerBar = cfg.beatsPerBar; document.getElementById('mSig').value = cfg.beatsPerBar;
    metroActive = cfg.metroActive;
    const metroBtn = document.getElementById('metroToggle');
    metroBtn.classList.toggle('on', metroActive);
    metroBtn.textContent = metroActive ? '🔊 Метроном' : '🔇 Метроном';
    rainbow = cfg.rainbow; document.getElementById('rainbowChk').checked = rainbow;
    if (cfg.harmSuppress !== undefined) {
        harmSuppress = cfg.harmSuppress;
        document.getElementById('harmSuppChk').checked = harmSuppress;
    }
    if (cfg.harmRatio !== undefined) {
        harmRatio = cfg.harmRatio;
        const hv = Math.round(cfg.harmRatio * 100);
        document.getElementById('sHarm').value = hv;
        document.getElementById('vHarm').innerText = hv + '%';
    }
    if (cfg.hpsBoost !== undefined) {
        hpsBoost = cfg.hpsBoost;
        document.getElementById('hpsChk').checked = hpsBoost;
    }
    // EQ bands
    eqBands = [];
    if (audioCtx) { eqNodes.forEach(n => n.disconnect()); eqNodes = []; }
    cfg.eqBands.forEach(b => {
        eqBands.push({ id: Date.now()+Math.random(), type: b.type, freq: b.freq, q: b.q, gain: b.gain });
        if (audioCtx) {
            const f = audioCtx.createBiquadFilter();
            f.type = b.type; f.frequency.value = b.freq; f.Q.value = b.q; f.gain.value = b.gain;
            eqNodes.push(f);
        }
    });
    if (audioCtx) rebuildAudioGraph();
    renderEQUI();
    updateBeatPattern();
}
document.getElementById('saveConfigBtn').addEventListener('click', () => {
    const cfg = gatherConfig();
    const blob = new Blob([JSON.stringify(cfg, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'cqt_config.json';
    a.click();
});
document.getElementById('loadConfigInput').addEventListener('change', function (e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
        try {
            const cfg = JSON.parse(reader.result);
            applyConfig(cfg);
        } catch (err) { alert('Ошибка чтения конфига: ' + err); }
    };
    reader.readAsText(file);
});

// ─── Keyboard hit-test ───────────────────────────────────────────
function keyAtPoint(canvasX, canvasY) {
    const kbTop = wfH + (showEQCurve ? EQ_H : 0);
    if (canvasY < kbTop || canvasY > kbTop + KB_H) return -1;
    const relY = canvasY - kbTop;
    const BK_H = Math.round(KB_H * 0.6);
    const BK_W = Math.round(COL_W * 0.65);
    const BK_OX = Math.floor((COL_W - BK_W) / 2);
    // Black keys have priority (they overlay white keys)
    if (relY <= BK_H) {
        for (let k = 0; k < N_KEYS; k++) {
            if (!isBlack(k)) continue;
            const bx = k * COL_W + BK_OX;
            if (canvasX >= bx && canvasX < bx + BK_W) return k;
        }
    }
    // White key
    const k = Math.floor(canvasX / COL_W);
    return (k >= 0 && k < N_KEYS && !isBlack(k)) ? k : -1;
}

function canvasXY(e) {
    const r = canvas.getBoundingClientRect();
    return [
        (e.clientX - r.left) * (canvas.width / r.width),
        (e.clientY - r.top)  * (canvas.height / r.height)
    ];
}

function mouseKeyOn(k) {
    if (k === mouseHeldKey) return;
    mouseKeyOff();
    mouseHeldKey = k;
    if (sf2) handleSF2NoteOn(0, MIDI_A0 + k, 90);
    if (midiEnabled) { midiActiveNotes.add(k); midiNoteVelocity[k] = 90; }
    // Kick off animation if nothing else is running
    if (!running && !midiFrameId) { lastRowTs = 0; midiFrameId = requestAnimationFrame(midiOnlyFrame); }
}

function mouseKeyOff() {
    if (mouseHeldKey < 0) return;
    if (sf2) handleSF2NoteOff(0, MIDI_A0 + mouseHeldKey);
    if (midiEnabled) { midiActiveNotes.delete(mouseHeldKey); midiNoteVelocity[mouseHeldKey] = 0; }
    mouseHeldKey = -1;
}

// Tooltip
const tip = document.getElementById('tip');

canvas.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    const [cx, cy] = canvasXY(e);
    const k = keyAtPoint(cx, cy);
    if (k >= 0) { e.preventDefault(); mouseKeyOn(k); }
});

canvas.addEventListener('mousemove', e => {
    const [cx, cy] = canvasXY(e);
    const kbTop = wfH + (showEQCurve ? EQ_H : 0);
    const overKb = cy >= kbTop;

    // Tooltip (only over waterfall area)
    if (!overKb) {
        const k = Math.floor(cx / COL_W);
        if (k >= 0 && k < N_KEYS) {
            const midi = MIDI_A0 + k;
            tip.style.cssText = `display:block;left:${e.clientX+14}px;top:${e.clientY-6}px`;
            tip.textContent = `${midi2name(midi)}  ${midi2freq(midi).toFixed(1)} Hz`;
        }
    } else {
        tip.style.display = 'none';
    }

    // Cursor
    canvas.style.cursor = overKb ? 'pointer' : 'crosshair';

    // Slide to new key while held
    if (mouseHeldKey >= 0) {
        const k = keyAtPoint(cx, cy);
        if (k >= 0 && k !== mouseHeldKey) mouseKeyOn(k);
    }
});

canvas.addEventListener('mouseup',    () => mouseKeyOff());
canvas.addEventListener('mouseleave', () => { tip.style.display = 'none'; mouseKeyOff(); });

// Resize handler
let rsT;
window.addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(resizeCanvas, 120); });

// Initial canvas
resizeCanvas();
renderEQUI();
updateBeatPattern();
</script>
