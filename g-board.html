<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PeerJS Vector Board</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #f4f4f8; font-family: sans-serif; }
        
        #canvas-wrapper { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }

        /* Меню подключения (Сверху) */
        .connection-panel {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: white; padding: 10px 20px; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); z-index: 1000;
            display: flex; gap: 10px; align-items: center;
        }
        .connection-panel input { padding: 8px; border: 1px solid #ddd; border-radius: 6px; width: 120px; }
        .btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; color: white; transition: 0.2s; }
        .btn-host { background: #2563eb; } .btn-host:hover { background: #1d4ed8; }
        .btn-join { background: #059669; } .btn-join:hover { background: #047857; }
        .hidden { display: none !important; }

        /* Тулбар (Снизу) */
        .toolbar {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: white; padding: 8px 16px; border-radius: 50px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15); display: flex; gap: 12px; z-index: 1000;
        }
        .tool-btn {
            border: none; background: transparent; font-size: 20px; cursor: pointer;
            width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
        }
        .tool-btn:hover { background: #f0f0f0; }
        .tool-btn.active { background: #e6f0ff; color: #0066ff; }
        
        #status-msg { margin-left: 10px; font-size: 12px; color: #666; }
    </style>
</head>
<body>

    <div class="connection-panel" id="conn-panel">
        <button class="btn btn-host" onclick="startHost()">Host (Create)</button>
        <span style="color:#aaa">or</span>
        <input type="text" id="remote-id" placeholder="Paste ID here">
        <button class="btn btn-join" onclick="connectToPeer()">Connect</button>
    </div>
    
    <div class="connection-panel hidden" id="status-panel">
        <span id="my-id-display" style="font-weight:bold; color:#333;"></span>
        <span id="status-msg">Waiting...</span>
    </div>

    <div class="toolbar">
        <button class="tool-btn active" id="btn-select" onclick="setMode('select')">👆</button>
        <button class="tool-btn" id="btn-pen" onclick="setMode('pen')">✏️</button>
        <button class="tool-btn" onclick="deleteSelected()">🗑️</button>
    </div>

    <div id="canvas-wrapper">
        <canvas id="c"></canvas>
    </div>

    <script src="https://unpkg.com/fabric@5.3.0/dist/fabric.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>

    <script>
        // ============================
        // 1. ИНИЦИАЛИЗАЦИЯ КАНВЫ
        // ============================
        const canvas = new fabric.Canvas('c', {
            isDrawingMode: false,
            selection: true,
            preserveObjectStacking: true
        });

        function resizeCanvas() {
            canvas.setWidth(window.innerWidth);
            canvas.setHeight(window.innerHeight);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        canvas.freeDrawingBrush = new fabric.PencilBrush(canvas);
        canvas.freeDrawingBrush.width = 3;
        canvas.freeDrawingBrush.color = "#333";

        // ============================
        // 2. PEERJS (СЕТЕВАЯ ЧАСТЬ)
        // ============================
        const peer = new Peer(); // Использует бесплатный облачный брокер PeerJS
        let conn = null;
        let myPeerId = null;
        let isReceiving = false; // Блокировка петли обновлений

        // Получили свой ID
        peer.on('open', (id) => {
            myPeerId = id;
            console.log('My ID:', id);
        });

        // К нам кто-то подключается (Мы - Хост)
        peer.on('connection', (connection) => {
            conn = connection;
            setupConnection();
            document.getElementById('status-msg').innerText = "🟢 Friend Connected!";
            
            // Отправляем текущее состояние доски новому гостю
            setTimeout(() => {
                const fullState = JSON.stringify(canvas.toJSON());
                conn.send({ type: 'full-sync', data: fullState });
            }, 500);
        });

        // Мы создаем комнату
        function startHost() {
            if(!myPeerId) return alert("Connecting to signaling server... wait a sec.");
            navigator.clipboard.writeText(myPeerId).then(() => {
                alert("ID Copied! Send it to your friend: " + myPeerId);
            });
            showConnectedUI("Hosting: " + myPeerId.substr(0,5)+"...");
        }

        // Мы подключаемся к другу
        function connectToPeer() {
            const remoteId = document.getElementById('remote-id').value.trim();
            if(!remoteId) return alert("Enter ID");
            
            conn = peer.connect(remoteId);
            setupConnection();
            showConnectedUI("Connected to host");
        }

        function setupConnection() {
            // Обработка входящих данных
            conn.on('data', (payload) => {
                isReceiving = true; // Не отправлять обратно то, что пришло
                
                if (payload.type === 'draw' || payload.type === 'modify') {
                    // payload.data = json объекта
                    fabric.util.enlivenObjects([payload.data], (objs) => {
                        objs.forEach(o => {
                            const existing = canvas.getObjects().find(ex => ex.id === o.id);
                            if (existing) {
                                // Если объект есть - обновляем
                                existing.set(o.toObject());
                                existing.setCoords();
                            } else {
                                // Если нет - добавляем
                                canvas.add(o);
                            }
                        });
                        canvas.requestRenderAll();
                    });
                }
                
                if (payload.type === 'delete') {
                    const obj = canvas.getObjects().find(o => o.id === payload.id);
                    if(obj) canvas.remove(obj);
                }

                if (payload.type === 'full-sync') {
                    // Полная замена канвы (при входе)
                    canvas.loadFromJSON(JSON.parse(payload.data), () => {
                        canvas.requestRenderAll();
                    });
                }

                isReceiving = false;
            });

            conn.on('open', () => {
                document.getElementById('status-msg').innerText = "🟢 Connected!";
            });
            
            conn.on('error', (err) => console.error(err));
        }

        function showConnectedUI(text) {
            document.getElementById('conn-panel').classList.add('hidden');
            document.getElementById('status-panel').classList.remove('hidden');
            document.getElementById('my-id-display').innerText = text;
        }

        // ============================
        // 3. ОТПРАВКА ДАННЫХ
        // ============================
        
        function broadcast(type, data) {
            if (conn && conn.open && !isReceiving) {
                conn.send({ type, ...data });
            }
        }

        // Добавление / Рисование
        canvas.on('path:created', (e) => {
            e.path.id = Math.random().toString(36).substr(2, 9);
            broadcast('draw', { data: e.path.toObject(['id']) });
        });

        // Модификация (движение, ресайз)
        canvas.on('object:modified', (e) => {
            if (!e.target.id) e.target.id = Math.random().toString(36).substr(2, 9);
            broadcast('modify', { data: e.target.toObject(['id']) });
        });

        // Удаление
        function deleteSelected() {
            const active = canvas.getActiveObjects();
            if (active.length) {
                active.forEach(obj => {
                    broadcast('delete', { id: obj.id });
                    canvas.remove(obj);
                });
                canvas.discardActiveObject();
            }
        }

        // ============================
        // 4. ИНТЕРФЕЙС И ЖЕСТЫ
        // ============================
        
        let currentMode = 'select';
        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            if(mode === 'pen') document.getElementById('btn-pen').classList.add('active');
            if(mode === 'select') document.getElementById('btn-select').classList.add('active');

            if (mode === 'pen') {
                canvas.isDrawingMode = true;
                canvas.discardActiveObject();
                canvas.selection = false;
            } else {
                canvas.isDrawingMode = false;
                canvas.selection = true;
            }
        }

        // Горячие клавиши
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;
            if (e.key.toLowerCase() === 'p') setMode('pen');
            if (e.key.toLowerCase() === 'v') setMode('select');
            if (e.key === 'Delete') deleteSelected();
        });

        // Zoom (Колесико)
        canvas.on('mouse:wheel', function(opt) {
            if(opt.e.ctrlKey) return;
            var delta = opt.e.deltaY;
            var zoom = canvas.getZoom();
            zoom *= 0.999 ** delta;
            if (zoom > 5) zoom = 5;
            if (zoom < 0.1) zoom = 0.1;
            canvas.zoomToPoint({ x: opt.e.offsetX, y: opt.e.offsetY }, zoom);
            opt.e.preventDefault();
            opt.e.stopPropagation();
        });

        // Pan (Сдвиг с Alt или средней кнопкой)
        let isDragging = false;
        let lastPosX, lastPosY;
        canvas.on('mouse:down', function(opt) {
            var evt = opt.e;
            if (evt.altKey || evt.button === 1) {
                this.isDragging = true;
                this.selection = false;
                lastPosX = evt.clientX;
                lastPosY = evt.clientY;
            }
        });
        canvas.on('mouse:move', function(opt) {
            if (this.isDragging) {
                var e = opt.e;
                var vpt = this.viewportTransform;
                vpt[4] += e.clientX - lastPosX;
                vpt[5] += e.clientY - lastPosY;
                this.requestRenderAll();
                lastPosX = e.clientX;
                lastPosY = e.clientY;
            }
        });
        canvas.on('mouse:up', function(opt) {
            this.isDragging = false;
            if(currentMode === 'select') this.selection = true;
        });

        // --- Touch Gestures (Zoom/Pan) ---
        const touchState = { active: false, dist: 0, scale: 1, startP: {x:0, y:0} };
        const upperCanvas = document.querySelector('.upper-canvas');

        upperCanvas.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                touchState.active = true;
                touchState.dist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                touchState.startP = {
                    x: (e.touches[0].clientX + e.touches[1].clientX)/2,
                    y: (e.touches[0].clientY + e.touches[1].clientY)/2
                };
                touchState.scale = canvas.getZoom();
                canvas.isDrawingMode = false;
                canvas.selection = false;
                e.preventDefault();
            }
        });

        upperCanvas.addEventListener('touchmove', (e) => {
            if (touchState.active && e.touches.length === 2) {
                const dist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                const p = {
                    x: (e.touches[0].clientX + e.touches[1].clientX)/2,
                    y: (e.touches[0].clientY + e.touches[1].clientY)/2
                };

                // Zoom
                const zoom = touchState.scale * (dist / touchState.dist);
                canvas.zoomToPoint(p, zoom);

                // Pan
                const vpt = canvas.viewportTransform;
                vpt[4] += p.x - touchState.startP.x;
                vpt[5] += p.y - touchState.startP.y;
                canvas.requestRenderAll();
                
                touchState.startP = p;
                e.preventDefault();
            }
        });

        upperCanvas.addEventListener('touchend', () => {
            touchState.active = false;
            if(currentMode === 'pen') canvas.isDrawingMode = true;
            if(currentMode === 'select') canvas.selection = true;
        });

    </script>
</body>
</html>
