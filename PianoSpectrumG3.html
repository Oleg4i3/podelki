<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pro CQT Piano Roll (v3 - Ultimate)</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; overflow:hidden; font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #000; }
body { display: flex; flex-direction: column; }

/* ─── CONTROL PANEL ────────────────────────────────────────────── */
#panel {
  flex-shrink: 0; background: #f0f2f5; border-bottom: 1px solid #c8cdd6;
  padding: 10px 16px; display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; z-index: 10;
}
.btn {
  align-self: center; height: 38px; padding: 0 14px; border-radius: 6px; border: none;
  background: #2563eb; color: #fff; font-size: 12px; font-weight: 600; cursor: pointer; transition: 0.15s;
}
.btn:hover { background: #1d4fd8; }
.btn.on { background: #16a34a; }
.btn.danger { background: #ef4444; }
.btn.danger.on { background: #dc2626; animation: pulse 1.5s infinite; }
.btn.util { background: #4b5563; }
.btn.util:hover { background: #374151; }
@keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

.ctrl { display: flex; flex-direction: column; gap: 4px; min-width: 110px; }
.ctrl-label { font-size: 11px; font-weight: 600; color: #374151; display: flex; justify-content: space-between; }
.ctrl-val { color: #2563eb; }
input[type=range] { -webkit-appearance: none; width: 100%; height: 6px; border-radius: 3px; background: #d1d5db; cursor: pointer; outline: none; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #2563eb; transition: 0.1s; }

/* ─── CANVAS AREA ──────────────────────────────────────────────── */
#wrap { flex: 1; overflow-x: auto; overflow-y: hidden; position: relative; }
canvas { display: block; cursor: crosshair; }
#tip { position: fixed; background: #ffffffee; border: 1px solid #ccc; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 4px; pointer-events: none; display: none; z-index: 99; }

/* ─── MODALS ───────────────────────────────────────────────────── */
.modal-overlay { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 100; }
.modal { background: #fff; padding: 20px; border-radius: 8px; width: 400px; max-width: 90vw; box-shadow: 0 10px 25px rgba(0,0,0,0.2); max-height: 90vh; overflow-y: auto;}
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-weight: bold; font-size: 16px; }
.close-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: #6b7280; }
.modal-row { margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
select { padding: 4px 8px; border-radius: 4px; border: 1px solid #ccc; font-size: 13px; outline: none; }

/* EQ STYLES */
.eq-band { border: 1px solid #e5e7eb; padding: 10px; border-radius: 6px; margin-bottom: 10px; background: #f9fafb; }
.eq-band-header { font-size: 12px; font-weight: bold; margin-bottom: 8px; display: flex; justify-content: space-between;}
.eq-del { background: #ef4444; color: #fff; border: none; border-radius: 3px; cursor: pointer; padding: 2px 6px; font-size: 10px; }
.eq-sliders { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.eq-slider-col { display: flex; flex-direction: column; font-size: 10px; text-align: center; }
.eq-slider-col input { margin-top: 4px; }
</style>
</head>
<body>

<div id="panel">
  <button id="startBtn" class="btn">▶ Start</button>
  
  <div style="border-right: 1px solid #ccc; height: 38px; margin: 0 4px;"></div>
  
  <button class="btn util" onclick="document.getElementById('eqModal').style.display='flex'">Эквалайзер</button>
  <button class="btn util" id="btnEqCurve" onclick="toggleEqCurve()">АЧХ: Выкл</button>
  <button class="btn util" onclick="document.getElementById('metronomeModal').style.display='flex'">Метроном</button>

  <div style="border-right: 1px solid #ccc; height: 38px; margin: 0 4px;"></div>

  <div class="ctrl">
    <div class="ctrl-label">Гармоники (Гасить) <span class="ctrl-val" id="vHarm">70%</span></div>
    <input type="range" id="sHarm" min="0" max="100" step="5" value="70">
  </div>
  <div class="ctrl" style="min-width: 80px;">
    <div class="ctrl-label">Mic Gain <span class="ctrl-val" id="vPreG">1.0×</span></div>
    <input type="range" id="sPreG" min="1" max="20" step="1" value="1">
  </div>
  <div class="ctrl" style="min-width: 80px;">
    <div class="ctrl-label">Vis Gain <span class="ctrl-val" id="vG">50×</span></div>
    <input type="range" id="sG" min="1" max="150" step="1" value="50">
  </div>
  <div class="ctrl" style="min-width: 80px;">
    <div class="ctrl-label">Порог <span class="ctrl-val" id="vTh">4%</span></div>
    <input type="range" id="sTh" min="1" max="40" step="1" value="4">
  </div>
  <div class="ctrl" style="min-width: 80px;">
    <div class="ctrl-label">Скорость <span class="ctrl-val" id="vSpd">30/с</span></div>
    <input type="range" id="sSpd" min="10" max="120" step="1" value="30">
  </div>

  <div style="border-right: 1px solid #ccc; height: 38px; margin: 0 4px;"></div>

  <button class="btn util" onclick="saveConfig()">💾 Сохранить</button>
  <button class="btn util" onclick="document.getElementById('fileInput').click()">📂 Загрузить</button>
  <input type="file" id="fileInput" style="display:none" accept=".json" onchange="loadConfig(event)">

  <div style="border-right: 1px solid #ccc; height: 38px; margin: 0 4px;"></div>

  <button id="recBtn" class="btn danger" onclick="toggleRecord()">⏺ Запись</button>
  <button id="playRecBtn" class="btn util" style="display:none;" onclick="playRecording()">▶ Play</button>
  <a id="saveRecBtn" class="btn util" style="display:none; text-decoration:none; line-height:38px;" download="piano-recording.webm">↓ Audio</a>
</div>

<div id="wrap"><canvas id="cv"></canvas></div>
<div id="tip"></div>

<div id="eqModal" class="modal-overlay">
  <div class="modal">
    <div class="modal-header"><span>Параметрический EQ</span><button class="close-btn" onclick="this.closest('.modal-overlay').style.display='none'">×</button></div>
    <div class="modal-row">
      <select id="eqType"><option value="peaking">Полосовой (Peaking)</option><option value="lowshelf">Low Shelf</option><option value="highshelf">High Shelf</option></select>
      <button class="btn" style="height:28px; padding: 0 10px; font-size: 12px;" onclick="addEqBand()">+ Добавить</button>
    </div>
    <div id="eqList"></div>
  </div>
</div>

<div id="metronomeModal" class="modal-overlay">
  <div class="modal">
    <div class="modal-header"><span>Метроном (Маракас)</span><button class="close-btn" onclick="this.closest('.modal-overlay').style.display='none'">×</button></div>
    <div class="modal-row" style="justify-content: space-between;">
      <label style="font-weight: bold; display:flex; align-items:center; gap:8px;">
        <input type="checkbox" id="mOn" checked onchange="metroOn=this.checked" style="width:18px; height:18px;"> Включить звук
      </label>
      <select id="mSig" onchange="beatsPerBar=parseInt(this.value); currentBeat=0;">
        <option value="2">2/4</option><option value="3">3/4</option>
        <option value="4" selected>4/4</option><option value="5">5/4</option>
        <option value="6">6/8</option><option value="7">7/8</option>
      </select>
    </div>
    <div class="ctrl" style="margin-bottom: 15px;">
      <div class="ctrl-label">Темп (BPM) <span class="ctrl-val" id="vBpm">120</span></div>
      <input type="range" id="sBpm" min="40" max="240" step="1" value="120" oninput="bpm=parseInt(this.value); document.getElementById('vBpm').innerText=this.value;">
    </div>
    <div class="ctrl">
      <div class="ctrl-label">Громкость <span class="ctrl-val" id="vMVol">50%</span></div>
      <input type="range" id="sMVol" min="0" max="100" step="1" value="50" oninput="metroVol=this.value/100; document.getElementById('vMVol').innerText=this.value+'%';">
    </div>
  </div>
</div>

<script>
'use strict';
const fMin = 20, fMax = 15000;
const sliderToFreq = v => Math.round(fMin * Math.pow(fMax / fMin, v));
const freqToSlider = f => Math.log(f / fMin) / Math.log(fMax / fMin);


// ─── Constants & Utils ───────────────────────────────────────────
const MIDI_A0 = 21, N_KEYS = 88, COL_W = 12, KB_H = 96, MAX_PK = 5;
const BLK_PC = new Set([1, 3, 6, 8, 10]);
const isBlack = k => BLK_PC.has((MIDI_A0 + k) % 12);
const midi2freq = m => 440 * 2 ** ((m - 69) / 12);
const midi2name = m => ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'][m % 12] + (Math.floor(m / 12) - 1);
const NOTE_HUE = [0, 30, 60, 90, 120, 150, 180, 210, 240, 270, 300, 330];

function hsl2rgb(h, s, l) {
  const c = (1 - Math.abs(2*l - 1)) * s; const x = c * (1 - Math.abs(((h/60) % 2) - 1)); const m = l - c/2;
  let r=0,g=0,b=0;
  if(h<60){r=c;g=x;b=0}else if(h<120){r=x;g=c;b=0}else if(h<180){r=0;g=c;b=x}
  else if(h<240){r=0;g=x;b=c}else if(h<300){r=x;g=0;b=c}else{r=c;g=0;b=x}
  return [Math.round((r+m)*255), Math.round((g+m)*255), Math.round((b+m)*255)];
}
const PC_LUT = Array.from({length:12}, (_, pc) => {
  const lut = new Uint8Array(256 * 3);
  for (let i = 0; i < 256; i++) {
    const [r,g,b] = hsl2rgb(NOTE_HUE[pc], 1.0, 0.06 + (i/255) * 0.56);
    lut[i*3]=r; lut[i*3+1]=g; lut[i*3+2]=b;
  }
  return lut;
});

// ─── State ───────────────────────────────────────────────────────
let audioCtx, micSource, cqtNode, preGainNode;
let recDestNode, mediaRecorder, recChunks = [], recBlobUrl = null;
let running = false, visGain = 50.0, rowMs = 1000 / 30, thresh = 0.04, harmSupression = 0.7;
const targetVals = new Float32Array(N_KEYS), semVals = new Float32Array(N_KEYS), peakMask = new Uint8Array(N_KEYS);

let eqBands = [], eqNodes = [], drawEQ = false;
let bpm = 120, metroVol = 0.5, beatsPerBar = 4, metroOn = true;
let nextNoteTime = 0, currentBeat = 0, visualBeatQueue = [];
let noiseBuffer = null;

// ─── Canvas Init ─────────────────────────────────────────────────
const canvas = document.getElementById('cv'), ctx = canvas.getContext('2d', {alpha:false});
let wfH = 0, wfBuf = null, CANVAS_W = N_KEYS * COL_W;

function initCanvas() {
  const h = document.getElementById('wrap').clientHeight;
  canvas.width = CANVAS_W; canvas.height = h;
  wfH = Math.max(20, h - KB_H);
  wfBuf = new ImageData(CANVAS_W, wfH);
  const d = wfBuf.data;
  for (let y = 0; y < wfH; y++) {
    for (let k = 0; k < N_KEYS; k++) {
      const isBlk = isBlack(k); const c = isBlk ? 0 : 25;
      for (let px = 0; px < COL_W; px++) { let i = (y * CANVAS_W + k * COL_W + px) * 4; d[i]=c; d[i+1]=c; d[i+2]=c; d[i+3]=255; }
    }
  }
  drawKeyboard(new Uint8Array(N_KEYS));
}

// ─── Metronome (Shaker) Logic ────────────────────────────────────
function createNoiseBuffer() {
  const bSize = audioCtx.sampleRate * 0.2; // 200ms
  noiseBuffer = audioCtx.createBuffer(1, bSize, audioCtx.sampleRate);
  const data = noiseBuffer.getChannelData(0);
  for (let i = 0; i < bSize; i++) data[i] = Math.random() * 2 - 1;
}

function playShaker(time, isStrong) {
  if (!metroOn || metroVol <= 0.01) return;
  if (!noiseBuffer) createNoiseBuffer();
  
  const noise = audioCtx.createBufferSource();
  noise.buffer = noiseBuffer;
  const bp = audioCtx.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = isStrong ? 7000 : 5000;
  bp.Q.value = 1.5;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(metroVol, time);
  gain.gain.exponentialRampToValueAtTime(0.001, time + 0.08); // Short decay
  
  noise.connect(bp).connect(gain).connect(audioCtx.destination);
  noise.start(time); noise.stop(time + 0.1);
}

function scheduleMetronome() {
  if (!running) return;
  while (nextNoteTime < audioCtx.currentTime + 0.1) {
    let isStrong = (currentBeat === 0);
    playShaker(nextNoteTime, isStrong);
    visualBeatQueue.push({ time: nextNoteTime, type: isStrong ? 1 : 2 });
    currentBeat = (currentBeat + 1) % beatsPerBar;
    nextNoteTime += 60.0 / bpm;
  }
  setTimeout(scheduleMetronome, 25);
}

// ─── Draw Logic ──────────────────────────────────────────────────
function drawKeyboard(pm) {
  const top = wfH;
  ctx.fillStyle = '#e8eaf0'; ctx.fillRect(0, top, CANVAS_W, KB_H);
  ctx.fillStyle = '#222'; ctx.fillRect(0, top, CANVAS_W, 2);
  for (let k = 0; k < N_KEYS; k++) {
    if (isBlack(k)) continue;
    const x = k * COL_W, lit = pm[k], g = ctx.createLinearGradient(0, top+2, 0, top+KB_H);
    if (lit) { g.addColorStop(0, `hsl(${NOTE_HUE[(MIDI_A0+k)%12]},90%,72%)`); g.addColorStop(1, `hsl(${NOTE_HUE[(MIDI_A0+k)%12]},90%,58%)`); }
    else { g.addColorStop(0, '#f8f9fc'); g.addColorStop(1, '#d4d8e5'); }
    ctx.fillStyle = g; ctx.fillRect(x+1, top+2, COL_W-1, KB_H-3);
    ctx.fillStyle = lit ? `hsl(${NOTE_HUE[(MIDI_A0+k)%12]},60%,50%)` : '#aab0c0'; ctx.fillRect(x + COL_W - 1, top+2, 1, KB_H-3);
  }
  const BK_H = Math.round(KB_H * 0.6), BK_W = Math.round(COL_W * 0.65), BK_OX = Math.floor((COL_W - BK_W) / 2);
  for (let k = 0; k < N_KEYS; k++) {
    if (!isBlack(k)) continue;
    const x = k * COL_W + BK_OX, y = top + 2, lit = pm[k], g = ctx.createLinearGradient(0, y, 0, y+BK_H);
    if (lit) { g.addColorStop(0, `hsl(${NOTE_HUE[(MIDI_A0+k)%12]},100%,40%)`); g.addColorStop(1, `hsl(${NOTE_HUE[(MIDI_A0+k)%12]},100%,38%)`); }
    else { g.addColorStop(0, '#3a3c4c'); g.addColorStop(1, '#12131c'); }
    ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(x, y, BK_W, BK_H, [0,0,3,3]); ctx.fill();
  }
}

function addRow(sv, pm, beatLineType) {
  const d = wfBuf.data, rowB = CANVAS_W * 4, base = (wfH-1) * rowB;
  d.copyWithin(0, rowB); 
  for (let k = 0; k < N_KEYS; k++) {
    const isBlk = isBlack(k);
    let r = isBlk ? 0 : 25, g = isBlk ? 0 : 25, b = isBlk ? 0 : 25;
    if (beatLineType === 1) { r+=60; g+=60; b+=60; } else if (beatLineType === 2) { r+=30; g+=30; b+=30; }
    if (pm[k]) {
      const v = Math.round(Math.min(1, Math.max(0, sv[k])) * 255), lut = PC_LUT[(MIDI_A0+k) % 12];
      r = Math.max(r, lut[v*3]); g = Math.max(g, lut[v*3+1]); b = Math.max(b, lut[v*3+2]);
    }
    for (let px = 0; px < COL_W; px++) { const i = base + (k * COL_W + px)*4; d[i]=r; d[i+1]=g; d[i+2]=b; }
  }
}

function drawEQCurveOverlay() {
  if (!drawEQ || eqNodes.length === 0) return;
  const freqs = new Float32Array(N_KEYS), magRes = new Float32Array(N_KEYS), phRes = new Float32Array(N_KEYS);
  const totalMag = new Float32Array(N_KEYS).fill(1);
  for(let i=0; i<N_KEYS; i++) freqs[i] = midi2freq(MIDI_A0 + i);
  
  eqNodes.forEach(node => {
    node.getFrequencyResponse(freqs, magRes, phRes);
    for(let i=0; i<N_KEYS; i++) totalMag[i] *= magRes[i];
  });

  ctx.save();
  // Draw base 0dB line
  const baseY = wfH - 30;
  ctx.beginPath(); ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)'; ctx.moveTo(0, baseY); ctx.lineTo(CANVAS_W, baseY); ctx.stroke();
  
  // Draw curve
  ctx.beginPath();
  ctx.strokeStyle = '#eab308'; // Yellow
  ctx.lineWidth = 2;
  for(let i=0; i<N_KEYS; i++) {
    const db = 20 * Math.log10(totalMag[i] || 0.0001);
    const y = baseY - (db * 1.5); // scale
    const x = i * COL_W + COL_W/2;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.restore();
}

let lastRowTs = 0;
function frame(ts) {
  if (!running) return;
  requestAnimationFrame(frame);

  // Smooth target values
  for (let k = 0; k < N_KEYS; k++) semVals[k] = semVals[k] * 0.7 + targetVals[k] * 0.3;
  
  // -- HARMONIC SUPPRESSION --
  let cleanVals = new Float32Array(semVals);
  if (harmSupression > 0.01) {
    for (let k = 0; k < N_KEYS; k++) {
      let e = cleanVals[k];
      if (e > thresh) {
        // Octave (+12), P-Fifth (+19), 2-Octaves (+24), M-Third (+28)
        if (k+12 < N_KEYS) cleanVals[k+12] -= e * harmSupression;
        if (k+19 < N_KEYS) cleanVals[k+19] -= e * harmSupression * 0.7;
        if (k+24 < N_KEYS) cleanVals[k+24] -= e * harmSupression * 0.5;
        if (k+28 < N_KEYS) cleanVals[k+28] -= e * harmSupression * 0.3;
      }
    }
    for (let k = 0; k < N_KEYS; k++) cleanVals[k] = Math.max(0, cleanVals[k]);
  }

  // Peak detection using cleaned vals
  peakMask.fill(0); const c = [];
  for (let k = 1; k < N_KEYS-1; k++) if (cleanVals[k] > thresh && cleanVals[k] >= cleanVals[k-1] && cleanVals[k] >= cleanVals[k+1]) c.push(k);
  c.sort((a,b)=>cleanVals[b]-cleanVals[a]);
  for (const k of c.slice(0, MAX_PK)) peakMask[k] = 1;

  if (ts - lastRowTs >= rowMs) {
    lastRowTs = ts;
    let bType = 0;
    if (visualBeatQueue.length > 0 && audioCtx.currentTime >= visualBeatQueue[0].time) bType = visualBeatQueue.shift().type;
    addRow(cleanVals, peakMask, bType);
    ctx.putImageData(wfBuf, 0, 0);
    drawEQCurveOverlay();
  }
  drawKeyboard(peakMask);
}

// ─── EQ & Graph Setup ────────────────────────────────────────────
function toggleEqCurve() {
  drawEQ = !drawEQ;
  document.getElementById('btnEqCurve').textContent = drawEQ ? 'АЧХ: Вкл' : 'АЧХ: Выкл';
  document.getElementById('btnEqCurve').classList.toggle('on', drawEQ);
}

function rebuildAudioGraph() {
  if (!micSource || !cqtNode) return;
  micSource.disconnect(); preGainNode.disconnect(); eqNodes.forEach(n => n.disconnect());

  let prev = micSource;
  prev.connect(preGainNode); prev = preGainNode;
  eqNodes.forEach(n => { prev.connect(n); prev = n; });
  
  // Route to CQT (Visuals)
  prev.connect(cqtNode);
  
  // Route to Recorder if exists
  if (recDestNode) prev.connect(recDestNode);
}

function updateEQNode(idx) {
  if (!eqNodes[idx]) return;
  const data = eqBands[idx];
  eqNodes[idx].type = data.type; eqNodes[idx].frequency.value = data.freq;
  eqNodes[idx].Q.value = data.q; eqNodes[idx].gain.value = data.gain;
}

window.addEqBand = function(bandConfig) {
  const type = document.getElementById('eqType').value;
  const band = bandConfig || { id: Date.now(), type, freq: 1000, q: 1, gain: 0 };
  eqBands.push(band);
  if (audioCtx) {
    const filter = audioCtx.createBiquadFilter(); eqNodes.push(filter);
    updateEQNode(eqBands.length - 1); rebuildAudioGraph();
  }
  renderEQUI();
};

window.removeEqBand = function(idx) {
  eqBands.splice(idx, 1);
  if (audioCtx) { eqNodes[idx].disconnect(); eqNodes.splice(idx, 1); rebuildAudioGraph(); }
  renderEQUI();
};

function renderEQUI() {
  const list = document.getElementById('eqList'); list.innerHTML = '';
  eqBands.forEach((band, i) => {
    const tName = band.type === 'peaking' ? 'Полосовой' : (band.type === 'lowshelf' ? 'Low Shelf' : 'High Shelf');
    list.insertAdjacentHTML('beforeend', `
      <div class="eq-band">
        <div class="eq-band-header"><span>${tName}</span><button class="eq-del" onclick="removeEqBand(${i})">Удалить</button></div>
        <div class="eq-sliders">
	
<div class="eq-slider-col">Freq: <span id="eqFv${i}">${band.freq}Hz</span>
  <input type="range" min="0" max="1" step="0.001" value="${freqToSlider(band.freq)}" 
    oninput="let f=sliderToFreq(this.value); eqBands[${i}].freq=f; document.getElementById('eqFv${i}').innerText=f+'Hz'; updateEQNode(${i});">
</div>
          <div class="eq-slider-col">Q: <span id="eqQv${i}">${band.q}</span><input type="range" min="0.1" max="20" step="0.1" value="${band.q}" oninput="eqBands[${i}].q=this.value; document.getElementById('eqQv${i}').innerText=this.value; updateEQNode(${i});"></div>
          <div class="eq-slider-col">Gain: <span id="eqGv${i}">${band.gain}dB</span><input type="range" min="-12" max="12" step="0.5" value="${band.gain}" oninput="eqBands[${i}].gain=this.value; document.getElementById('eqGv${i}').innerText=this.value+'dB'; updateEQNode(${i});"></div>
        </div>
      </div>`);
  });
}

// ─── Recording Logic ─────────────────────────────────────────────
function toggleRecord() {
  const btn = document.getElementById('recBtn');
  if (mediaRecorder && mediaRecorder.state === "recording") {
    mediaRecorder.stop();
    btn.classList.remove('on'); btn.textContent = '⏺ Запись';
  } else {
    if (!audioCtx) return alert("Сначала нажмите Start!");
    recChunks = [];
    recDestNode = audioCtx.createMediaStreamDestination();
    rebuildAudioGraph(); // Re-route Mic -> EQ -> DestNode
    
    mediaRecorder = new MediaRecorder(recDestNode.stream, { mimeType: 'audio/webm' });
    mediaRecorder.ondataavailable = e => { if(e.data.size > 0) recChunks.push(e.data); };
    mediaRecorder.onstop = () => {
      const blob = new Blob(recChunks, { type: 'audio/webm' });
      if (recBlobUrl) URL.revokeObjectURL(recBlobUrl);
      recBlobUrl = URL.createObjectURL(blob);
      document.getElementById('playRecBtn').style.display = 'inline-block';
      const a = document.getElementById('saveRecBtn');
      a.href = recBlobUrl; a.style.display = 'inline-block';
    };
    mediaRecorder.start();
    btn.classList.add('on'); btn.textContent = '⏹ Стоп Запись';
    document.getElementById('playRecBtn').style.display = 'none';
    document.getElementById('saveRecBtn').style.display = 'none';
  }
}

function playRecording() {
  if (recBlobUrl) { const a = new Audio(recBlobUrl); a.play(); }
}

// ─── Config Save/Load Logic ──────────────────────────────────────
window.saveConfig = function() {
  const config = {
    eqBands, bpm, metroVol, beatsPerBar, metroOn,
    harmSupression, preGain: document.getElementById('sPreG').value, visGain, thresh
  };
  const blob = new Blob([JSON.stringify(config, null, 2)], {type: 'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'piano-config.json'; a.click();
};

window.loadConfig = function(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const c = JSON.parse(ev.target.result);
      if (c.eqBands) { 
        eqBands = []; if(audioCtx) { eqNodes.forEach(n=>n.disconnect()); eqNodes=[]; }
        c.eqBands.forEach(b => window.addEqBand(b)); 
      }
      if (c.bpm) { bpm = c.bpm; document.getElementById('sBpm').value = bpm; document.getElementById('vBpm').innerText = bpm; }
      if (c.metroVol !== undefined) { metroVol = c.metroVol; document.getElementById('sMVol').value = metroVol*100; document.getElementById('vMVol').innerText = (metroVol*100)+'%'; }
      if (c.beatsPerBar) { beatsPerBar = c.beatsPerBar; document.getElementById('mSig').value = beatsPerBar; }
      if (c.metroOn !== undefined) { metroOn = c.metroOn; document.getElementById('mOn').checked = metroOn; }
      if (c.harmSupression !== undefined) { harmSupression = c.harmSupression; document.getElementById('sHarm').value = harmSupression*100; document.getElementById('vHarm').innerText = (harmSupression*100)+'%'; }
      if (c.preGain) { document.getElementById('sPreG').value = c.preGain; if(preGainNode) preGainNode.gain.value = c.preGain; document.getElementById('vPreG').innerText = c.preGain+'×'; }
      if (c.visGain) { visGain = c.visGain; document.getElementById('sG').value = visGain; document.getElementById('vG').innerText = visGain+'×'; }
      if (c.thresh) { thresh = c.thresh; document.getElementById('sTh').value = thresh*100; document.getElementById('vTh').innerText = (thresh*100)+'%'; }
      alert("Настройки загружены!");
    } catch (err) { alert("Ошибка файла!"); }
  };
  reader.readAsText(file); e.target.value = '';
};

// ─── AUDIO WORKLET (CQT) ─────────────────────────────────────────
const cqtWorkletCode = `
class CQTFilterbank extends AudioWorkletProcessor {
  constructor() {
    super();
    this.N = 88; this.fs = sampleRate; this.Q = 17.31;
    this.b0 = new Float32Array(this.N); this.b1 = new Float32Array(this.N); this.b2 = new Float32Array(this.N);
    this.a1 = new Float32Array(this.N); this.a2 = new Float32Array(this.N);
    this.x1 = new Float32Array(this.N); this.x2 = new Float32Array(this.N);
    this.y1 = new Float32Array(this.N); this.y2 = new Float32Array(this.N);
    this.env = new Float32Array(this.N); this.envAlpha = new Float32Array(this.N);
    for (let k = 0; k < this.N; k++) {
      let freq = 440 * Math.pow(2, (21 + k - 69) / 12), w0 = 2 * Math.PI * freq / this.fs;
      let alpha = Math.sin(w0) / (2 * this.Q), a0 = 1 + alpha;
      this.b0[k] = alpha / a0; this.b1[k] = 0; this.b2[k] = -alpha / a0;
      this.a1[k] = (-2 * Math.cos(w0)) / a0; this.a2[k] = (1 - alpha) / a0;
      this.envAlpha[k] = Math.exp(-1.0 / (this.fs * Math.max(1.0 / freq * 4, 0.01)));
    }
    this.samplesCount = 0;
  }
  process(inputs) {
    const input = inputs[0][0]; if (!input) return true;
    for (let i = 0; i < input.length; i++) {
      let x = input[i];
      for (let k = 0; k < this.N; k++) {
        let y = this.b0[k]*x + this.b1[k]*this.x1[k] + this.b2[k]*this.x2[k] - this.a1[k]*this.y1[k] - this.a2[k]*this.y2[k];
        this.x2[k] = this.x1[k]; this.x1[k] = x; this.y2[k] = this.y1[k]; this.y1[k] = y;
        this.env[k] = this.env[k] * this.envAlpha[k] + (y * y) * (1 - this.envAlpha[k]);
      }
    }
    this.samplesCount += input.length;
    if (this.samplesCount >= this.fs / 60) { this.port.postMessage(new Float32Array(this.env)); this.samplesCount = 0; }
    return true;
  }
}
registerProcessor('cqt-filterbank', CQTFilterbank);`;

// ─── Initialization ──────────────────────────────────────────────
async function startAudio() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: {echoCancellation:false, noiseSuppression:false, autoGainControl:false} });
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    await audioCtx.audioWorklet.addModule(URL.createObjectURL(new Blob([cqtWorkletCode], { type: 'application/javascript' })));
    
    micSource = audioCtx.createMediaStreamSource(stream);
    preGainNode = audioCtx.createGain(); preGainNode.gain.value = document.getElementById('sPreG').value;
    
    eqNodes = eqBands.map(b => { let f = audioCtx.createBiquadFilter(); f.type = b.type; f.frequency.value = b.freq; f.Q.value = b.q; f.gain.value = b.gain; return f; });

    cqtNode = new AudioWorkletNode(audioCtx, 'cqt-filterbank');
    cqtNode.port.onmessage = e => { for (let k = 0; k < N_KEYS; k++) targetVals[k] = Math.sqrt(e.data[k]) * visGain; };
    
    rebuildAudioGraph();
    
    running = true; nextNoteTime = audioCtx.currentTime + 0.1; scheduleMetronome();
    const btn = document.getElementById('startBtn'); btn.textContent = '■ Stop'; btn.classList.add('on');
    requestAnimationFrame(frame);
  } catch(e) { alert('Ошибка микрофона: ' + e.message); }
}

document.getElementById('startBtn').addEventListener('click', () => { if (!running) startAudio(); });

// Bindings
const bCtrl = (id, fn) => document.getElementById(id).addEventListener('input', e => fn(e.target.value));
bCtrl('sHarm', v => { harmSupression = v / 100; document.getElementById('vHarm').innerText = v + '%'; });
bCtrl('sPreG', v => { if(preGainNode) preGainNode.gain.value = v; document.getElementById('vPreG').innerText = v + '×'; });
bCtrl('sG',    v => { visGain = v; document.getElementById('vG').innerText = v + '×'; });
bCtrl('sTh',   v => { thresh = v / 100; document.getElementById('vTh').innerText = v + '%'; });
bCtrl('sSpd', v => { rowMs = 1000 / v; document.getElementById('vSpd').innerText = v + '/с'; });

const tip = document.getElementById('tip');
canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect(), k = Math.floor((e.clientX - r.left) * (canvas.width / r.width) / COL_W);
  if (k >= 0 && k < N_KEYS) { tip.style.cssText = `display:block;left:${e.clientX+14}px;top:${e.clientY-6}px`; tip.textContent = `${midi2name(MIDI_A0 + k)}  ${midi2freq(MIDI_A0 + k).toFixed(1)} Hz`; }
});
canvas.addEventListener('mouseleave', () => { tip.style.display='none'; });

let rsT; window.addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(initCanvas, 120); });
initCanvas();
</script>
