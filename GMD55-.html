<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>МГД</title>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; color: white; font-family: 'Segoe UI', sans-serif; }
        
        /* UI Panel */
        #ui-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            left: auto;
            bottom: auto;
            width: 220px; /* Трохи ширше для нових опцій */
            max-height: 90vh;
            overflow-y: auto;
            background: rgba(10, 10, 15, 0.85);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #333;
            backdrop-filter: blur(10px);
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 5px;
        }
        
        /* Checkbox styling */
        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
            font-size: 0.9em;
            color: #ccc;
            background: rgba(255,255,255,0.05);
            padding: 8px;
            border-radius: 6px;
        }
        input[type=checkbox] {
            accent-color: #0088ff;
            width: 16px; height: 16px; cursor: pointer;
        }

        /* Tabs */
        #tabs {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 10;
            flex-wrap: wrap;
            justify-content: center;
        }
        .tab-btn {
            background: rgba(30, 30, 30, 0.8);
            border: 1px solid #555;
            color: #aaa;
            padding: 8px 15px;
            cursor: pointer;
            border-radius: 6px;
            font-size: 0.9rem;
            transition: all 0.2s;
            font-weight: 500;
        }
        .tab-btn.active {
            background: #0066cc;
            color: white;
            border-color: #3399ff;
            box-shadow: 0 0 15px rgba(0, 102, 204, 0.6);
        }

        /* Controls */
        input[type=range] { width: 100%; cursor: pointer; accent-color: #0088ff; margin-top:5px; }
        .label-row { display: flex; justify-content: space-between; font-size: 0.9em; color: #ccc; margin-top: 5px; }
        #status-title { font-weight: bold; color: #4db8ff; font-size: 1.1em; border-bottom: 1px solid #333; padding-bottom: 5px; margin-bottom: 5px;}
        #status-desc { font-size: 0.85em; color: #aaa; line-height: 1.4; }

        /* Legend */
        #legend {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 8px;
            font-size: 0.85em;
            pointer-events: none;
            border: 1px solid #333;
        }
        .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; vertical-align: middle; }

        /* Help Button & Modal */
        #help-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            background: #333;
            border: 1px solid #666;
            color: white;
            border-radius: 50%;
            font-size: 1.2em;
            cursor: pointer;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
        }
        #help-btn:hover { background: #0066cc; }

        #modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        #modal-content {
            background: #111;
            width: 80%;
            max-width: 800px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #444;
            box-shadow: 0 0 50px rgba(0,0,0,1);
            position: relative;
            color: #ddd;
            line-height: 1.6;
        }
        #modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 1.5em;
            cursor: pointer;
            color: #888;
        }
        #modal-close:hover { color: white; }
        
        .math-block { background: #222; padding: 5px; border-radius: 5px; margin: 5px 0; border-left: 3px solid #0066cc; }
        h2 { color: #4db8ff; border-bottom: 1px solid #333; padding-bottom: 5px; }
        h3 { color: #ccddff; margin-top: 5px; }
        strong { color: #fff; }
    </style>
</head>
<body>

    <div id="tabs">
        <button class="tab-btn" onclick="switchTab('frozen')">Індукція</button>
        <button class="tab-btn" onclick="switchTab('induction')">α-ефект</button>
        <button class="tab-btn" onclick="switchTab('amplification')">Підсилення</button>
        <button class="tab-btn active" onclick="switchTab('toroidal')">Ω-ефект</button>
    </div>

    <button id="help-btn" onclick="openModal()">?</button>

    <div id="legend"></div>

    <div id="ui-panel">
        <div>
            <div id="status-title">Статус</div>
            <div id="status-desc">Опис</div>
        </div>
        
        <div id="controls-frozen" class="control-group" style="display:none;">
            <div class="label-row"><span>Положення провідника</span></div>
            <input type="range" id="froz-pos" min="0" max="100" value="50">
            <div class="label-row"><span>Швидкість руху v: <span id="vel-readout">0</span></span></div>
        </div>

        <div id="controls-induction" class="control-group">
            <div class="label-row"><span>1. Швидкість конвекційних потоків</span></div>
            <input type="range" id="ind-updraft" min="0" max="100" value="0">
            <div class="label-row"><span>2. Сила Коріоліса (Скручування)</span></div>
            <input type="range" id="ind-twist" min="0" max="50" value="0">
            
            <label class="checkbox-row">
                <input type="checkbox" id="ind-hemisphere">
                Показати південну півкулю
            </label>
        </div>

        <div id="controls-amplification" class="control-group" style="display:none;">
            <div class="label-row"><span>Еволюція геометрії</span></div>
            <input type="range" id="amp-morph" min="0" max="1000" value="0">
        </div>

        <div id="controls-toroidal" class="control-group" style="display:none;">
             <div class="label-row"><span>Сила ефекту диференціального обертання</span></div>
             <input type="range" id="tor-rotation" min="0" max="500" value="0">
        </div>
    </div>

    <div id="modal-overlay">
        <div id="modal-content">
            <span id="modal-close" onclick="closeModal()">&times;</span>
            <div id="modal-text"></div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { LineGeometry } from 'three/addons/lines/LineGeometry.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
import { Line2 } from 'three/addons/lines/Line2.js';

let scene, camera, renderer, controls;
let activeTab = 'induction';

// Groups
const groupFrozen = new THREE.Group();
const groupInduction = new THREE.Group();
const groupAmplification = new THREE.Group();
const groupToroidal = new THREE.Group();

// --- VARIABLES: TAB 0 (FROZEN) ---
let frozenLine;
let conductorSphere;
let eddyParticlesSystem;
let inducedFieldArrow;
let lastPos = 0;
let currentVel = 0;
let targetPos = 0;

// --- VARIABLES: TAB 1 (INDUCTION/PARKER) ---
const IND_CONFIG = { baseRadius: 20, lineCount: 7, segs: 400, vortexCount: 4, vortexRadius: 20 };
let indFieldLines = []; // Contains {mesh, radius, baseY, arrows: []}
let plasmaSystems = [];
let yellowCurrentRing;
let yellowCurrentPath = [];
let greenFieldLines = [];
let updraftVal = 0;
let twistVal = 0;
let isSouthern = false;


let torSphereSegments = [];

// --- VARIABLES: TAB 2 (AMPLIFICATION/OMEGA LOOP) ---
let tubeMesh, conductorCurve;
let currentArrowsAmp = [];
let fieldLinesAmpPool = [];
const AMP_CONFIG = { R: 12, tubeSegs: 300, baseTubeRadius: 0.8, arrowSpacing: 20 };
let ampMorphVal = 0;
let ampFlowOffset = 0;

// --- VARIABLES: TAB 3 (POLOIDAL TO TOROIDAL) ---
let torSphere;
let torFieldLines = []; // { line, arrows: [], basePoints: [] }
let torRotationVal = 0;

// Helpers
const _v1 = new THREE.Vector3();
const _v2 = new THREE.Vector3();
const _vTemp = new THREE.Vector3();

init();
animate();

function init() {
    scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050505, 0.005);

    camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 60, 90);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // Lights
    scene.add(new THREE.AmbientLight(0x333333));
    const dl = new THREE.DirectionalLight(0xffffff, 1.2);
    dl.position.set(20, 50, 20);
    scene.add(dl);
    const bl = new THREE.DirectionalLight(0x0044ff, 0.6);
    bl.position.set(-20, -10, -20);
    scene.add(bl);

    initFrozenTab();
    initInductionTab();
    initAmplificationTab();
    initToroidalTab();

    scene.add(groupFrozen);
    scene.add(groupInduction);
    scene.add(groupAmplification);
    scene.add(groupToroidal);

    // Inputs Tab 0
    document.getElementById('froz-pos').addEventListener('input', (e) => {
        targetPos = (parseInt(e.target.value) - 50) / 2;
    });

    // Inputs Tab 1
    const upSlider = document.getElementById('ind-updraft');
    const twistSlider = document.getElementById('ind-twist');
    const hemiCheck = document.getElementById('ind-hemisphere');

    twistSlider.disabled = true;
    twistSlider.style.opacity = '0.4';

    upSlider.addEventListener('input', (e) => {
        const val = parseInt(e.target.value);
        if (val > 0) {
            twistSlider.disabled = false;
            twistSlider.style.opacity = '1.0';
        } else {
            twistSlider.disabled = true;
            twistSlider.style.opacity = '0.4';
            twistSlider.value = 0; 
        }
        updateInductionLogic();
    });
    twistSlider.addEventListener('input', updateInductionLogic);
    hemiCheck.addEventListener('change', (e) => {
        isSouthern = e.target.checked;
        updateInductionLogic();
    });

    // Inputs Tab 2
    document.getElementById('amp-morph').addEventListener('input', (e) => {
        ampMorphVal = parseInt(e.target.value) / 1000;
        updateAmpText();
    });

    // Inputs Tab 3
    document.getElementById('tor-rotation').addEventListener('input', (e) => {
        torRotationVal = parseInt(e.target.value) / 1000;
        updateToroidalText();
    });

    // Expose functions globally
    window.switchTab = switchTab;
    window.openModal = openModal;
    window.closeModal = closeModal;

    switchTab('toroidal');
    window.addEventListener('resize', onResize);
}

function switchTab(name) {
    activeTab = name;
    
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelector(`button[onclick="switchTab('${name}')"]`).classList.add('active');
    
    ['controls-frozen', 'controls-induction', 'controls-amplification', 'controls-toroidal'].forEach(id => {
        document.getElementById(id).style.display = 'none';
    });
    document.getElementById(`controls-${name}`).style.display = 'flex';

    groupFrozen.visible = (name === 'frozen');
    groupInduction.visible = (name === 'induction');
    groupAmplification.visible = (name === 'amplification');
    groupToroidal.visible = (name === 'toroidal');

    const legend = document.getElementById('legend');
    
    if(name === 'frozen') {
        camera.position.set(0, 10, 80);
        controls.target.set(0, 0, 0);
        legend.innerHTML = `
            <div><span class="dot" style="background:#0088ff"></span>Магнітна лінія (B)</div>
            <div><span class="dot" style="background:#ff4444"></span>Провідник</div>
            <div><span class="dot" style="background:#ffff00"></span>Струм Фуко</div>
            <div><span class="dot" style="background:#00ff00"></span>Індуковане поле (B_ind)</div>
        `;
        updateFrozenText();
    }
    else if(name === 'induction') {
        camera.position.set(0, 20, 40);
        controls.target.set(0, 0, 0);
        legend.innerHTML = `
            <div><span class="dot" style="background:#0066aa"></span>Магнітні лінії (тороїдальні)</div>
            <div><span class="dot" style="background:#ffaaaa"></span>Конвекція (Плазма/рідкий метал)</div>
            <div><span class="dot" style="background:#ffff00"></span>Індукований Струм</div>
            <div><span class="dot" style="background:#00ff66"></span>Індуковане поле </div>
        `;
        updateInductionLogic();
    } 
    else if (name === 'amplification') {
        camera.position.set(0, 45, 55);
        controls.target.set(0, 0, 0);
        legend.innerHTML = `
            <div><span class="dot" style="background:#cc0000"></span>Кільце плазми (або рідкого металу ядра)</div>
            <div><span class="dot" style="background:#ffff00"></span>Струм </div>
            <div><span class="dot" style="background:#0088ff"></span>Магнітне поле B</div>
        `;
        updateAmpText();
    }
    else if (name === 'toroidal') {
        camera.position.set(40, 20, 60);
        controls.target.set(0, 0, 0);
        legend.innerHTML = `
            <div><span class="dot" style="background:#933; border:1px solid #fff"></span>Поверхня зорі чи ядра</div>
            <div><span class="dot" style="background:#0088ff"></span>Магнітні лінії (Полоїдальні -> Тороїдальні)</div>
        `;
        updateToroidalText();
    }
}

// ==============================================================
// === TAB 0: FROZEN-IN =========================================
// ==============================================================

function initFrozenTab() {
    const geom = new LineGeometry();
    const pts = [];
    const segs = 100;
    for(let j=0; j<=segs; j++) {
        pts.push(0, (j/segs)*60 - 30, 0);
    }
    geom.setPositions(pts);
    const mat = new LineMaterial({ color: 0x0088ff, linewidth: 5, resolution: new THREE.Vector2(window.innerWidth, window.innerHeight) });
    frozenLine = new Line2(geom, mat);
    groupFrozen.add(frozenLine);

    conductorSphere = new THREE.Mesh(
        new THREE.SphereGeometry(4, 32, 32),
        new THREE.MeshPhysicalMaterial({ color: 0xff4444, metalness: 0.8, roughness: 0.2 })
    );
    groupFrozen.add(conductorSphere);

    const pGeo = new THREE.BufferGeometry();
    const pCount = 10;
    const pPos = [];
    const pAngles = [];
    for(let i=0; i<pCount; i++) {
        pPos.push(0,0,0);
        pAngles.push((i/pCount) * Math.PI * 2);
    }
    pGeo.setAttribute('position', new THREE.Float32BufferAttribute(pPos, 3));
    const pMat = new THREE.PointsMaterial({ color: 0xffff00, size: 0.8 });
    eddyParticlesSystem = new THREE.Points(pGeo, pMat);
    eddyParticlesSystem.userData = { angles: pAngles };
    conductorSphere.add(eddyParticlesSystem);

    inducedFieldArrow = new THREE.ArrowHelper(new THREE.Vector3(1,0,0), new THREE.Vector3(0,0,0), 1, 0x00ff00);
    conductorSphere.add(inducedFieldArrow);
}

function updateFrozenLogic() {
    const smooth = 0.05;
    const dx = targetPos - lastPos;
    currentVel = dx * smooth * 10.0; 
    lastPos += dx * smooth;
    conductorSphere.position.x = lastPos;

    const pts = [];
    const segs = 100;
    for(let j=0; j<=segs; j++) {
        const y = (j/segs)*60 - 30;
        const distY = Math.abs(y);
        const decay = Math.exp( - (distY * distY) / 100.0 );
        const x = currentVel * 8.0 * decay; 
        pts.push(x, y, 0);
    }
    frozenLine.geometry.setPositions(pts);
    frozenLine.computeLineDistances();

    const speedMagnitude = Math.abs(currentVel);
    const particlesVisible = speedMagnitude > 0.1;
    eddyParticlesSystem.visible = particlesVisible;
    inducedFieldArrow.visible = particlesVisible;

    if (particlesVisible) {
        const isMovingAway = (lastPos * currentVel) >= 0;
        const dirY = isMovingAway ? 1 : -1;
        const positions = eddyParticlesSystem.geometry.attributes.position.array;
        const angles = eddyParticlesSystem.userData.angles;
        const radius = 5.0;

        for(let i=0; i<angles.length; i++) {
            angles[i] += speedMagnitude * 0.05 * dirY;
            const theta = angles[i];
            const px = Math.cos(theta) * radius;
            const pz = Math.sin(theta) * radius;
            const idx = i*3;
            positions[idx] = px; positions[idx+1] = 0; positions[idx+2] = pz;
        }
        eddyParticlesSystem.geometry.attributes.position.needsUpdate = true;

        const bDir = new THREE.Vector3(0, dirY, 0);
        inducedFieldArrow.setDirection(bDir);
        const arrowLength = speedMagnitude * 2.0 + 2.0; 
        inducedFieldArrow.setLength(arrowLength, arrowLength*0.2, arrowLength*0.1);
    }
    document.getElementById('vel-readout').innerText = currentVel.toFixed(2);
}

function updateFrozenText() {
    document.getElementById('status-title').innerText = "Фаза: Індукція / Вморожування";
    document.getElementById('status-desc').innerText = "Рух провідника викликає зміну потоку. Жовті частинки — індукований струм Фуко (J). Якщо провідник ідеальний, струм не зникає і поле стає 'вморожене' надпровідник.";
}

// ==============================================================
// === TAB 1: PARKER LOOPS (INDUCTION) ==========================
// ==============================================================

function initInductionTab() {
    // 1. Plasma Particles
    for(let v=0; v<IND_CONFIG.vortexCount; v++) {
        const angle = (v / IND_CONFIG.vortexCount) * Math.PI * 2;
        const cx = Math.cos(angle) * IND_CONFIG.vortexRadius;
        const cz = Math.sin(angle) * IND_CONFIG.vortexRadius;
        const partGeo = new THREE.BufferGeometry();
        const pPos = []; const pData = [];
        for(let i=0; i<80; i++) {
            const r = Math.random() * 3.0;
            const theta = Math.random() * Math.PI * 2;
            const y = (Math.random() - 0.5) * 10;
            pPos.push(cx + r*Math.cos(theta), y, cz + r*Math.sin(theta));
            pData.push({ cx: cx, cz: cz, r: r, theta: theta, y: y, speed: 0.1 + Math.random()*0.1 });
        }
        partGeo.setAttribute('position', new THREE.Float32BufferAttribute(pPos, 3));
        const particles = new THREE.Points(partGeo, new THREE.PointsMaterial({ color: 0xffaaaa, size: 0.6, transparent: true, opacity: 0.6 }));
        groupInduction.add(particles);
        plasmaSystems.push({ mesh: particles, data: pData });
    }

    // 2. Blue Magnetic Lines
    const arrowConeGeo = new THREE.ConeGeometry(0.5, 1.5, 8);
    arrowConeGeo.rotateX(Math.PI/2);
    const arrowMat = new THREE.MeshBasicMaterial({ color: 0x00aaff });

    for(let i=0; i<IND_CONFIG.lineCount; i++) {
        const isMain = (i === 0);
        const rOffset = isMain ? 0 : (Math.random() - 0.5) * 4.0;
        const yOffset = isMain ? 0 : (Math.random() - 0.5) * 1.5;
        const geom = new LineGeometry();
        const arr = new Array((IND_CONFIG.segs + 1) * 3).fill(0);
        geom.setPositions(arr);
        const mat = new LineMaterial({ color: isMain ? 0x0088ff : 0x003366, linewidth: isMain ? 5 : 2, transparent: true, opacity: isMain ? 1.0 : 0.4, resolution: new THREE.Vector2(window.innerWidth, window.innerHeight) });
        const line = new Line2(geom, mat);
        
        // Arrows for direction
const arrows = [];
if (isMain) { // Додаємо цю умову, щоб стрілки створювалися тільки для товстої лінії
    const numArrows = 8; 
    for(let a=0; a<numArrows; a++) {
        const arrMesh = new THREE.Mesh(arrowConeGeo, arrowMat);
        line.add(arrMesh);
        arrows.push(arrMesh);
    }
}

        groupInduction.add(line);
        indFieldLines.push({ mesh: line, radius: IND_CONFIG.baseRadius + rOffset, baseY: yOffset, arrows: arrows });
    }

    // 3. Yellow Current Ring
  //  yellowCurrentRing = new THREE.Group();
   // const arrowGeo = new THREE.ConeGeometry(0.4, 1.5, 8); arrowGeo.rotateX(Math.PI/2);
    //for(let i=0; i<40; i++) { yellowCurrentRing.add(new THREE.Mesh(arrowGeo, new THREE.MeshBasicMaterial({ color: 0xffff00 }))); }
  
	yellowCurrentRing = new THREE.Group();
	const sphereGeo = new THREE.SphereGeometry(0.4, 16, 16); // Створюємо сферу замість конуса
	for(let i=0; i<40; i++) { yellowCurrentRing.add(new THREE.Mesh(sphereGeo, new THREE.MeshStandardMaterial({ color: 0xffff00, emissive: 0x555500 }))); }
	yellowCurrentRing.visible = false;
    groupInduction.add(yellowCurrentRing);

    // 4. Green Induced Field
    for(let i=0; i<32; i++) {
        const gGeo = new LineGeometry();
        const gLine = new Line2(gGeo, new LineMaterial({ color: 0x00ff66, linewidth: 2, transparent: true, opacity: 0, resolution: new THREE.Vector2(window.innerWidth, window.innerHeight) }));
        groupInduction.add(gLine);
        const head = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.6, 6), new THREE.MeshBasicMaterial({color:0x00ff66}));
        head.geometry.rotateX(Math.PI/2);
        groupInduction.add(head);
        greenFieldLines.push({ line: gLine, head: head, seedAngle: (i/32)*Math.PI*2 });
    }
}

function updateInductionLogic() {
    updraftVal = parseInt(document.getElementById('ind-updraft').value) / 100;
    twistVal = parseInt(document.getElementById('ind-twist').value) / 100;
    
    // Physics constants depending on hemisphere
    // North: Updraft(+), Twist(CCW), Field(CCW - assumed)
    // South: Updraft(-), Twist(CW), Field(CW - opposite)
    const hemiSign = isSouthern ? -1 : 1;
    
    const desc = document.getElementById('status-desc');
    if(activeTab === 'induction') {
        let txt = isSouthern ? "Південна півкуля: " : "Північна півкуля: ";
        document.getElementById('status-title').innerText = "Фаза: α-ефект (Петлі Паркера)";
        if (updraftVal < 0.1) desc.innerText = txt + "Спокій. Магнітні лінії (сині) тороїдальні.";
        else if (twistVal < 0.2) desc.innerText = txt + "Конвекція вигинає магнітні лінії " + (isSouthern?"вниз":"вгору") + " (див. вкладку Індукція для розуміння механізму викривлення поля плазмою чи провідником).";
        else desc.innerText = txt + "Сила Коріоліса скручує петлі. Тільки за наявності обох умов (ковекція+скручування) формується 3D петля і виникає ЦИРКУЛЯЦІЯ магнітного поля, яка створює струм (жовтий), що генерує полоїдальне поле (зелене).";
    }

    // Update Blue Lines
    indFieldLines.forEach(obj => {
        const pts = []; const R = obj.radius; const Y0 = obj.baseY;
        const totalSegs = IND_CONFIG.segs;
        
        for(let i=0; i<=totalSegs; i++) {
            const phi = (i / totalSegs) * Math.PI * 2;
            let x = R * Math.cos(phi), z = R * Math.sin(phi), y = Y0;
            
            // Interaction with 4 vortices
            for(let v=0; v<IND_CONFIG.vortexCount; v++) {
                const vAngle = (v / IND_CONFIG.vortexCount) * Math.PI * 2;
                const vx = IND_CONFIG.vortexRadius * Math.cos(vAngle), vz = IND_CONFIG.vortexRadius * Math.sin(vAngle);
                
                const distSq = (x-vx)**2 + (z-vz)**2;
                const influence = Math.exp(-distSq/25.0);
                
                // Updraft Effect (HemiSign flips Y direction)
                y += influence * updraftVal * 12.0 * hemiSign;
                
                // Twist Effect
                if(twistVal > 0 && influence > 0.01) {
                    // Coriolis twist direction reverses in South
                    // Northern Hemisphere: usually CCW. Southern: CW.
                    // twistVal is positive magnitude.
                    const twistDir = hemiSign; // if North(1), twist +; if South(-1), twist -
                    const ta = influence * twistVal * Math.PI * 1.5 * twistDir;
                    
                    const lx = x-vx, lz = z-vz;
                    x = vx + (lx*Math.cos(ta) - lz*Math.sin(ta));
                    z = vz + (lx*Math.sin(ta) + lz*Math.cos(ta));
                }
            }
            pts.push(x, y, z);
        }
        obj.mesh.geometry.setPositions(pts);
        obj.mesh.computeLineDistances();

        // Update Arrows on Blue Lines
        // Physics: Toroidal field direction is opposite in hemispheres.
        // North: Tangent direction. South: -Tangent direction.
        const arrowDirSign = hemiSign; 
        
        obj.arrows.forEach((arrow, idx) => {
            // Distribute arrows evenly but avoid the chaotic twist parts if possible, or just place evenly
            const ratio = idx / obj.arrows.length;
            const idxPt = Math.floor(ratio * totalSegs);
            // Simple tangent approximation
            const i1 = idxPt * 3;
            const i2 = Math.min(idxPt + 1, totalSegs) * 3;
            
            const p1 = new THREE.Vector3(pts[i1], pts[i1+1], pts[i1+2]);
            const p2 = new THREE.Vector3(pts[i2], pts[i2+1], pts[i2+2]);
            
            arrow.position.copy(p1);
            if (arrowDirSign > 0) {
                arrow.lookAt(p2);
            } else {
                arrow.lookAt(p1.clone().sub(p2).add(p1)); // Look backwards
            }
        });
    });

    // Update Yellow Current
    // Condition: Updraft and Twist active
    if(twistVal > 0.1 && updraftVal > 0.1) {
        yellowCurrentRing.visible = true;
        const loopHeight = updraftVal * 10.0 * hemiSign; // Go up or down
        const ringRadius = IND_CONFIG.vortexRadius;
        
        yellowCurrentPath = [];
        for(let i=0; i<=60; i++) {
            const th = (i/60)*Math.PI*2;
            yellowCurrentPath.push(new THREE.Vector3(Math.cos(th)*ringRadius, loopHeight, Math.sin(th)*ringRadius));
        }

        yellowCurrentRing.children.forEach((arrow, idx) => {
            const th = (idx/yellowCurrentRing.children.length)*Math.PI*2;
            const px = Math.cos(th)*ringRadius, pz = Math.sin(th)*ringRadius;
            arrow.position.set(px, loopHeight, pz);
            
            // Current Direction logic:
            // J ~ curl(B). 
            // In South: Field flips (-), Twist flips (-). Double negative -> Current direction roughly maintained relative to the vertical axis.
            // So we keep the same rotation logic for arrows.
            arrow.lookAt(px - Math.sin(th), loopHeight, pz + Math.cos(th));
            
            const s = 0.5 + twistVal * 0.5; arrow.scale.set(s,s,s);
        });
        
        updateBiotSavartField(loopHeight, ringRadius);
    } else {
        yellowCurrentRing.visible = false;
        greenFieldLines.forEach(gl => { gl.line.visible = false; gl.head.visible = false; });
    }
}

function updateBiotSavartField(ringY, ringR) {
    if(yellowCurrentPath.length < 2) return;

    greenFieldLines.forEach(item => {
        item.line.visible = true; 
        item.head.visible = true;
        const opacity = Math.max(0, twistVal - 0.1); //0.2
        item.line.material.opacity = opacity; 
        item.head.material.opacity = opacity;

        const seedAngle = item.seedAngle;
        const loopRadius = 5.0;           
        const pts = [];
        
        let arrowPos = new THREE.Vector3();
        let arrowTarget = new THREE.Vector3();
        
        const segments = 50;
        for(let s=0; s <= segments; s++) {
            const alpha = (s / segments) * Math.PI * 2;
            // Green field loops around the yellow current wire
            const rLocal = ringR + loopRadius * Math.cos(alpha);
            const yLocal = ringY + loopRadius * Math.sin(alpha);

            const px = rLocal * Math.cos(seedAngle);
            const pz = rLocal * Math.sin(seedAngle);

            pts.push(px, yLocal, pz);

            if (s === Math.floor(segments * 0.75)) {
                arrowPos.set(px, yLocal, pz);
            }
            if (s === Math.floor(segments * 0.75) + 1) {
                arrowTarget.set(px, yLocal, pz);
            }
        }
        item.line.geometry.setPositions(pts);
        item.line.computeLineDistances();
        item.head.position.copy(arrowPos);
        item.head.lookAt(arrowTarget);
    });
}

    const points = getAmpCurvePoints(0);

function getAmpCurvePoints(t) {
    const R = AMP_CONFIG.R; const points = [];
    for(let i=0; i<AMP_CONFIG.tubeSegs; i++) {
        const a = (i/AMP_CONFIG.tubeSegs)*Math.PI*2;
        let x,y,z;
        if(t <= 0.5) {
            const t1 = t*2;
            x = THREE.MathUtils.lerp(Math.cos(a)*R, Math.cos(a)*R, t1);
            y = THREE.MathUtils.lerp(0, Math.sin(a)*(R*0.5), t1);
            z = THREE.MathUtils.lerp(Math.sin(a)*R, Math.sin(2*a)*(R*0.7), t1);
        } else {
            const t2 = (t-0.5)*2;
            x = THREE.MathUtils.lerp(Math.cos(a)*R, Math.cos(2*a)*R, t2);
            y = THREE.MathUtils.lerp(Math.sin(a)*(R*0.5), Math.cos(a)*3.0, t2);
            z = THREE.MathUtils.lerp(Math.sin(2*a)*(R*0.7), Math.sin(2*a)*R, t2);
        }
        points.push(new THREE.Vector3(x,y,z));
    }
    points.push(points[0].clone());
    return points;
}


function updateAmpWorld() {
    // 1. Оновлення геометрії петлі струму
    const newPoints = getAmpCurvePoints(ampMorphVal);
    conductorCurve.points = newPoints;
    
    // Зменшення радіуса трубки при розтягуванні (ефект збереження об'єму)
    const rs = 1.0 - (ampMorphVal * 0.29);
    
    // Оновлення червоної трубки (tubeMesh)
    if (tubeMesh.geometry) tubeMesh.geometry.dispose();
    tubeMesh.geometry = new THREE.TubeGeometry(conductorCurve, AMP_CONFIG.tubeSegs, AMP_CONFIG.baseTubeRadius * rs, 10, true);
    
    // Анімація потоку струму (рух стрілок)
    ampFlowOffset -= 0.003; 
    if(ampFlowOffset < 0) ampFlowOffset += 1.0;
    
    currentArrowsAmp.forEach(item => {
        const t = (item.baseRatio + ampFlowOffset) % 1.0;
        const pt = conductorCurve.getPointAt(t);
        item.mesh.position.copy(pt);
        item.mesh.lookAt(pt.clone().add(conductorCurve.getTangentAt(t)));
        item.mesh.scale.set(rs, rs, rs);
    });
    
    // --- ВІЗУАЛІЗАЦІЯ ПІДСИЛЕННЯ ПОЛЯ (Нова логіка) ---
    
    // Параметри підсилення на основі слайдера (0.0 -> 1.0)
    const intensity = ampMorphVal; 
    
    // 1. Колір: від звичайного синього до яскравого ціану/білого
    const colorBase = new THREE.Color(0x0088ff);
    const colorHot = new THREE.Color(0x1199ff); // Майже білий неон
    const currColor = colorBase.clone().lerp(colorHot, intensity);
    
    // 2. Прозорість і товщина
    const currOpacity = 0.4 + (intensity * 0.6); // 0.4 -> 1.0
    const currWidth = 1 + (intensity * 1);       // 2 -> 3 (товщина)

    // Оновлення ліній поля
    const seedR = 18; // Радіус початкового кільця ліній
    
    fieldLinesAmpPool.forEach(item => {
        // Застосування стилів
        item.line.material.color.copy(currColor);
        item.line.material.opacity = currOpacity;
        item.line.material.linewidth = currWidth;
        item.arrow.material.color.copy(currColor);
        
        // Розрахунок форми лінії (фізика)
        const pos = new THREE.Vector3(Math.cos(item.angle)*seedR, 0, Math.sin(item.angle)*seedR);
        const pts = [pos.x, pos.y, pos.z];
        
        let arrowPos = new THREE.Vector3();
        let arrowDir = new THREE.Vector3();
        
        // Трасування лінії (Integration)
        for(let s=0; s<40; s++) {
            let B = new THREE.Vector3();
            
            // Спрощений закон Біо-Савара (сума внесків від сегментів струму)
            // Крок i+=5 для оптимізації продуктивності
            for(let i=0; i<newPoints.length-1; i+=5) {
                const r = _v1.copy(pos).sub(newPoints[i]);
                const d2 = r.lengthSq();
                
                if(d2 < 2.0) continue; // Запобігання сингулярності (дуже близько до дроту)
                
                const dl = _v2.copy(newPoints[i+1]).sub(newPoints[i]);
                // dB = dl x r / r^3
                const cross = _vTemp.copy(dl).cross(r);
                B.add(cross.multiplyScalar(1 / (d2 * Math.sqrt(d2))));
            }
            
            if(B.lengthSq() < 1e-6) break; // Поле надто слабке
            
            B.normalize().multiplyScalar(0.7); // Довжина кроку трасування
            pos.add(B);
            pts.push(pos.x, pos.y, pos.z);
            
            // Збереження позиції для стрілки (на середині лінії)
            if(s===20) { arrowPos.copy(pos); arrowDir.copy(B); }
        }
        
        // Оновлення геометрії Three.js Line2
        item.line.geometry.setPositions(pts);
        item.line.computeLineDistances(); // Важливо для коректного відображення матеріалу
        
        // Оновлення стрілки на лінії
        item.arrow.position.copy(arrowPos);
        item.arrow.lookAt(arrowPos.clone().add(arrowDir));
    });
}

function initToroidalTab() {
   // Замість одного torSphere = new THREE.Mesh(...)
const latCount = 4; // Кількість поясів
for (let i = 0; i < latCount; i++) {
    const thetaStart = (i / latCount) * Math.PI;
    const thetaLength = Math.PI / latCount;
    
    // Створюємо сегмент сфери (горизонтальний пояс)
    const segGeo = new THREE.SphereGeometry(20, 32, 1, 0, Math.PI * 2, thetaStart, thetaLength);
    const seg = new THREE.Mesh(
        segGeo,
        new THREE.MeshBasicMaterial({ color: 0x990000, transparent: true, opacity: 0.5, wireframe: true })
    );
    
    // Зберігаємо середню широту сегмента для розрахунку швидкості
    seg.userData.thetaMid = thetaStart + thetaLength / 2;
    groupToroidal.add(seg);
    torSphereSegments.push(seg);
}

    // 2. Field Lines (Poloidal Start)
    const lineCount = 12;
    const segsPerLine = 100;
    const arrowConeGeo = new THREE.ConeGeometry(0.5, 1.5, 8);
    arrowConeGeo.rotateX(Math.PI/2);
    const arrowMat = new THREE.MeshBasicMaterial({ color: 0x00aaff });

    for(let i=0; i<lineCount; i++) {
        const phi0 = (i / lineCount) * Math.PI * 2;
        const geom = new LineGeometry();
        const pts = new Array((segsPerLine+1)*3).fill(0);
        geom.setPositions(pts);
        
        const mat = new LineMaterial({ 
            color: 0x0088ff, linewidth: 3, 
            resolution: new THREE.Vector2(window.innerWidth, window.innerHeight) 
        });
        const line = new Line2(geom, mat);
        groupToroidal.add(line);

        // Add arrows
        const arrows = [];
        for(let k=0; k<5; k++) {
            const arr = new THREE.Mesh(arrowConeGeo, arrowMat);
            line.add(arr);
            arrows.push(arr);
        }

        torFieldLines.push({
            line: line,
            arrows: arrows,
            phi0: phi0,
            segs: segsPerLine
        });
    }
}

function updateToroidalText() {
    document.getElementById('status-title').innerText = "Фаза: Ω-ефект (Глобальний)";
    document.getElementById('status-desc').innerText = "Полоїдальне магнітне поле (показана тільки зовнішня частина) може виникнути спонтанно або навсетися зовні. Спочатку воне може бути дуже слабким, але далі підсилюється за рахунок енергії обертання Землі (чи зорі) і конвекції (в ядрі чи плазмі). Лінії поля викривляються через швидше обертання екваторіальних шарів, створюючи тороїдальні пояси (див. вкладку Індукція для розуміння механізму деформації поля плазмою чи рідким металом)";
}

function updateToroidalTab() {
    // Rotation Logic
    // We simulate time passage with torRotationVal slider (0 to 1 -> represents angle 0 to 4PI)
    const maxWinding = Math.PI * 8; 
    const currentWinding = torRotationVal * maxWinding;
    const R = 20.5; // Slightly above sphere

  // Кожен пояс обертається зі своєю швидкістю (максимум на екваторі sin(theta) ≈ 1)
torSphereSegments.forEach(seg => {
    const speed = 0.001 + 0.01 * Math.sin(seg.userData.thetaMid); 
    seg.rotation.y += speed;
});

    torFieldLines.forEach(obj => {
        const pts = [];
        const phi0 = obj.phi0;
        
        // Calculate points
        for(let j=0; j<=obj.segs; j++) {
            // Theta from 0 (North) to PI (South)
            const theta = (j / obj.segs) * Math.PI;
            
            // Differential Rotation profile: Fastest at equator (theta=PI/2), 0 at poles.
            // dPhi = Winding * sin(theta)^2 (standard profile) or just sin(theta)
            const diffRotOffset = currentWinding * Math.sin(theta); 
            
            const phi = phi0 - diffRotOffset; // Move West (if star rotates East)
            
            const x = R * Math.sin(theta) * Math.cos(phi);
            const z = R * Math.sin(theta) * Math.sin(phi);
            const y = R * Math.cos(theta);
            
            pts.push(x, y, z);
        }
        
        obj.line.geometry.setPositions(pts);
        obj.line.computeLineDistances();

        // Update Arrows
        obj.arrows.forEach((arr, idx) => {
            // Pick index for arrow position (skip poles)
            const safeIdx = Math.floor(10 + (idx / obj.arrows.length) * (obj.segs - 20));
            const i1 = safeIdx * 3;
            const i2 = (safeIdx + 1) * 3;
            
            const p1 = new THREE.Vector3(pts[i1], pts[i1+1], pts[i1+2]);
            const p2 = new THREE.Vector3(pts[i2], pts[i2+1], pts[i2+2]);

            arr.position.copy(p1);
            arr.lookAt(p2);
        });
    });
}

            <div class="math-block">

            <p>Це вихрове електричне поле породжує всередині провідника замкнені <strong>вихрові струми (струми Фуко)</strong>. На візуалізації це жовті частинки, що рухаються по колу.</p>
			
			<p>Напрямок струму визначається правилом Ленца: він намагається зберегти магнітний потік незмінним.
			    Якщо провідник виходить з поля, він "тягне" його за собою (індукований струм не дає поля всередині провідника зменшитися). Якщо частинка входить в поле, індукований струм не дає агнітному потоки збільшуватись - це виглядає як відштовхування поля.
				  В будь-якому разі поле викривляяється у напрямку руху провідника</p>

            <h3>2. Викривлення ліній (Зворотна реакція)</h3>
            <p>Згідно з законом Біо-Савара-Лапласа, індукований струм \\(\\mathbf{J}\\) створює власне магнітне поле \\(\\mathbf{B}_{ind}\\) (зелена стрілка). Векторна сума зовнішнього поля і індукованого поля дає результуюче викривлення лінії.</p>
            <div class="math-block">$$ \\mathbf{B}_{total} = \\mathbf{B}_{ext} + \\mathbf{B}_{ind} $$</div>

            <h3>3. Теорема Альвена (Вморожування)</h3>
            <p>У ідеальній плазмі (де \\(\\sigma \\to \\infty\\)) рівняння індукції набуває вигляду:</p>
            <div class="math-block">$$ \\frac{\\partial \\mathbf{B}}{\\partial t} = \\nabla \\times (\\mathbf{v} \\times \\mathbf{B}) $$</div>
            <p>Це означає, що магнітні лінії "вморожені" в речовину і рухаються разом з нею. Саме це дозволяє потокам плазми у ядрі Землі чи Сонця переносити та скручувати магнітні поля.</p>
        `;
    } else if (activeTab === 'induction') {
        html = `
            <h2> \\(\\alpha\\)-ефект (Петлі Паркера)</h2>
            <p>Демонстрація того, як радіальні рухи плазми (конвекція) та обертання планети створюють нове магнітне поле.</p>
				<p>Сині лінії на цій моделі — це приховане  всередині Сонця або земного ядра тороїдальне поле. Воно є необхідним фундаментом для роботи динамо.</p>
            <p>Тут показано механізм перетворення тороїдального поля (кільцевого) назад у полоїдальне (вертикальне) для замикання циклу динамо.</p>
			<p> Зелені кільця — це народження того звичного нам поля, на яке реагує компас. У зорі рухається плазма, у ядрі Землі відбувається те саме, тільки замість плазми рухаються потоки рідкого заліза.</p>
                <p>Зауваження. В симуляції показані тільки висхідні потоки (більш гарячою плазми чи рідкого металу). Вони більш інтенсивні, навідміну від потоків опускання, які більш широкі, повільні і зосереджені ближче до полюсів.</p>
			<p>Тороїдальні поля в північній і південній півкулі протилежні, але й сила Коріоліса, що їх скручує, теж протилежна. Тому результат їхньої взаємодії виходить узгодженим і створює єдине глобальне магнітне поле зірки чи планети.</p>
			<h3>1. Конвекція та сила Коріоліса</h3>
            <p>Висхідні потоки гарячої плазми піднімають магнітні лінії, утворюючи форму літери \\(\\Omega\\). Сила Коріоліса закручує їх:</p>
            <div class="math-block">$$ \\mathbf{F}_C = -2m (\\mathbf{\\Omega} \\times \\mathbf{v}) $$</div>

            <h3>2. Генерація струму (Закон Ампера)</h3>
            <p>Закручування петель створює ефективний струм \\(\\mathbf{J}\\) паралельно магнітному полю. Фундаментальний закон Ампера пов'язує циркуляцію магнітного поля з електричним струмом:</p>
            <div class="math-block">$$ \\nabla \\times \\mathbf{B} = \\mu_0 \\mathbf{J} $$</div>
            <p>Часто це описується як \\(\\alpha\\)-ефект:</p>
            <div class="math-block">$$ \\mathbf{\\mathcal{E}} = \\alpha \\mathbf{B} $$</div>

            <h3>3. Закон Біо-Савара-Лапласа</h3>
            <p>Зелені лінії розраховані як поле від індукованого струму (жовте кільце):</p>
            <div class="math-block">$$ \\mathbf{B}(\\mathbf{r}) = \\frac{\\mu_0}{4\\pi} \\int \\frac{I d\\mathbf{l} \\times \\mathbf{r}'}{|\\mathbf{r}'|^3} $$</div>
       
           
            <ul>
                <li><strong>Північна:</strong> Плазма піднімається, Сила Коріоліса закручує потоки проти годинникової.</li>
                <li><strong>Південна:</strong> Плазма опускається (геометрія дзеркальна), Сила Коріоліса крутить за годинниковою стрілкою.</li>
            </ul>
            <p>Зверніть увагу: хоча магнітні поля в півкулях протилежні (сині стрілки), і напрямок скручування протилежний, результуючий індукований струм (жовтий) має <strong>узгоджений напрямок</strong>. Це дозволяє полям додаватися, а не знищувати одне одного.</p>

             <p>Скручена петля створює струм вздовж поля, що породжує нове полоїдальне поле (зелене).</p>
        `;
    } else if (activeTab === 'amplification') {
        html = `
           <h2>Підсилення поля</h2>
            <p>У провідному ядрі електричні струми течуть безпосередньо крізь рідину, тому вони жорстко пов'язані з її рухом. Коли гаряча плазма піднімається вгору, сила Коріоліса закручує її, механічно захоплюючи і скручуючи трубку зі струмом у петлю. Це розтягування подовжує шлях струму і змінює його форму. Процес працює як генератор: механічна енергія вихору витрачається на подолання сил магнітного опору, переходячи в енергію електромагнітного поля і підсилюючи його.</p>
            
			
			<div style="background: rgba(255, 255, 255, 0.05); padding: 5px; border-left: 4px solid #ffcc00; border-radius: 4px;">
          
            <p>
                <li> Поле зростає пропорційно видовженню трубки (<i>B ∝ L</i>). Так кінетична енергія руху перетворюється на магнітну.</li>
            </ul>
            </div>
			
			
			<div style="background-color: rgba(15, 15, 20, 0.95); padding: 5px; border-radius: 8px; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; line-height: 1; border: 1px solid #444;">
   

   
    <div style="background: rgba(255, 255, 255, 0.05); padding: 5px; border-radius: 6px; margin: 5px 0;">
        <strong style="color: #ffcc00; display: block; margin-bottom: 5px;">
            Ключовий механізм - збільшення розміру петлі
        </strong>
        <p>
            Під дією висхідного потоку і сили Коріоліса петля зі струмом розтягується і скручується. 
            Відбувається <strong>збільшення довжини та площі охоплення</strong> цього контуру струму.
        </p>
    </div>

    <div style="background: rgba(255, 255, 255, 0.05); padding: 5px; border-radius: 6px; margin: 5px 0;">
      
        <p style="margin-bottom: 10px;">
            Магнітний потік (<span style="font-family: 'Times New Roman', serif;">Φ</span>), що створюється кільцевим струмом, залежить від розмірів цього кільця. У першому наближенні:
       Φ ~ R · I   </p>
        
             <p>
            Коли петля струму механічно розтягується (збільшує ефективний радіус <span style="font-family: 'Times New Roman', serif;">R</span>), вона починає охоплювати більший простір і генерувати більший сумарний магнітний потік.
            <br><br>
            Це збільшує загальну магнітну енергію системи.
        </p>
    </div>

    <div style="border-top: 1px dashed #666; padding-top: 5px; margin-top: 5px;">
     
        <p style="font-size: 0.9em; margin-top: 5px;">
          
            Конвекція  і обертання Землі чи зорі виконує <strong>механічну роботу</strong>, розтягуючи петлю. Саме ця робота перетворюється на додаткову енергію магнітного поля.
        </p>
    </div>

</div>
			
            <p><strong>Позитивний зворотний зв'язок:</strong> \\(\\Omega\\)-ефект створює сильне тороїдальне поле з полоїдального \\(\\rightarrow\\) \\(\\alpha\\)-ефект скручує його, відновлюючи полоїдальне поле.</p>
        `;
    } else if (activeTab === 'toroidal') {
        html = `
            <h2>\\(\\Omega\\)-ефект (Глобальний)</h2>
            <p>Ця модель показує, як Полоїдальне поле (Лінії Північ-Південь) перетворюється на Тороїдальне (Кільця Схід-Захід).</p>
            
            <h3>Диференціальне обертання</h3>
            <p>Сонце (і рідке ядро Землі) не є твердим тілом. Екватор обертається швидше за полюси.</p>
            <div class="math-block">$$ \\omega(\\theta) = \\omega_{eq} (1 - k \\cos^2 \\theta) $$</div>
            
            <h3>Намотування ліній</h3>
            <p>Магнітна лінія, яка була вертикальною, захоплюється плазмою на екваторі і витягується вперед. З часом вона робить багато обертів навколо зорі, формуючи сильні магнітні "труби" під поверхнею.</p>
            <p>Зверніть увагу на стрілки: в північній півкулі поле закручується в один бік, у південній — в протилежний.</p>
			
			 <p>Причина, чому екватор обертається швидше за полюси, криється в анізотропії (нерівномірності) конвекції. В умовах швидкого обертання конвективні комірки витягуються вздовж осі обертання, набуваючи специфічної форми. Через таку геометрію рухи речовини вгору-вниз перестають бути симетричними щодо перенесення обертального моменту. Виникає ефект «насоса»: турбулентні потоки систематично перекачують момент імпульсу з глибинних шарів та полюсів до екватора. Це створює надлишок швидкості на екваторі, змушуючи його постійно випереджати загальне обертання тіла.</p>
        `;
    }
    
    content.innerHTML = html;
    MathJax.typesetPromise([content]);
}

function closeModal() {
    document.getElementById('modal-overlay').style.display = 'none';
}

function onResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    const res = new THREE.Vector2(window.innerWidth, window.innerHeight);
    
    if(frozenLine) frozenLine.material.resolution = res;
    indFieldLines.forEach(l => l.mesh.material.resolution = res);
    fieldLinesAmpPool.forEach(l => l.line.material.resolution = res);
    greenFieldLines.forEach(l => l.line.material.resolution = res);
    torFieldLines.forEach(l => l.line.material.resolution = res);
}

function animate() {
    requestAnimationFrame(animate);
    controls.update();
    
    if(activeTab === 'frozen') {
        updateFrozenLogic();
    } else if(activeTab === 'induction') {
        // Animation loop for Tab 1
        const hemiSign = isSouthern ? -1 : 1;
        const upSpeed = (0.05 + updraftVal * 0.4) * hemiSign;
        
        plasmaSystems.forEach((sys) => {
            const pos = sys.mesh.geometry.attributes.position.array;
            for(let i=0; i<sys.data.length; i++) {
                const d = sys.data[i];
                d.y += upSpeed * d.speed;
                // Boundaries check
                if(!isSouthern && d.y > 8) d.y = -8;
                if(isSouthern && d.y < -8) d.y = 8;
                
                if(twistVal > 0) d.theta += twistVal * 0.05 * hemiSign; // Twist direction matches physics
                
                const idx = i*3;
                pos[idx] = d.cx + d.r * Math.cos(d.theta);
                pos[idx+1] = d.y;
                pos[idx+2] = d.cz + d.r * Math.sin(d.theta);
            }
            sys.mesh.geometry.attributes.position.needsUpdate = true;
        });
        if(yellowCurrentRing.visible) yellowCurrentRing.rotation.y -= 0.02; // Keep consistent visual rotation
    } else if (activeTab === 'amplification') {
        updateAmpWorld();
    } else if (activeTab === 'toroidal') {
        updateToroidalTab();
    }

    renderer.render(scene, camera);
}
</script>
