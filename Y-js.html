<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MQTT + Y.js (Protected Sync)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <script type="module">
        import * as Y from 'https://esm.sh/yjs@13.6.8';
        
        // === НАСТРОЙКИ ===
        const MQTT_BROKER = "broker.emqx.io";
        const MQTT_PORT = 8084; // WSS (SSL) - обычно не блокируется
        const ROOM_ID = 'yjs-mqtt-' + (new URLSearchParams(window.location.search).get("r") || 'demo1');
        const MY_ID = Math.random().toString(36).substr(2, 5);

        // === 1. Y.js LOGIC ===
        const doc = new Y.Doc();
        const lines = doc.getArray('drawing'); // Общий массив линий
        
        // При изменении документа (рисуем мы или пришло из сети)
        lines.observe(() => {
            drawCanvas(); // Просто перерисовываем всё
        });

        // Слушаем локальные изменения, чтобы отправить их в сеть
        doc.on('update', (update) => {
            // Превращаем бинарные данные в строку Base64, чтобы MQTT не подавился
            const b64 = toBase64(update);
            sendMqtt({ t: 'upd', d: b64 }); 
        });

        // === 2. CANVAS LOGIC (Рисовалка) ===
        const canvas = document.getElementById('can');
        const ctx = canvas.getContext('2d');
        
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            drawCanvas();
        }
        window.addEventListener('resize', resize);

        function drawCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            
            lines.forEach(line => {
                ctx.beginPath();
                ctx.strokeStyle = line.color;
                if(line.pts.length > 0) {
                    ctx.moveTo(line.pts[0].x, line.pts[0].y);
                    for(let i=1; i<line.pts.length; i++) ctx.lineTo(line.pts[i].x, line.pts[i].y);
                }
                ctx.stroke();
            });
        }

        // Обработка касаний
        let isDrawing = false;
        let currentPath = [];
        
        const getPos = (e) => {
            const t = e.touches ? e.touches[0] : e;
            return {x: t.clientX, y: t.clientY};
        }

        const start = (e) => { isDrawing = true; currentPath = [getPos(e)]; }
        const move = (e) => {
            if(!isDrawing) return;
            e.preventDefault();
            const p = getPos(e);
            currentPath.push(p);
            
            // Локальная быстрая отрисовка (предиктивная)
            ctx.beginPath();
            ctx.strokeStyle = '#00ff00';
            ctx.moveTo(currentPath[currentPath.length-2].x, currentPath[currentPath.length-2].y);
            ctx.lineTo(p.x, p.y);
            ctx.stroke();
        }
        const end = () => {
            if(!isDrawing) return;
            isDrawing = false;
            // Сохраняем готовую линию в общий массив Y.js
            // Y.js сам сгенерирует событие 'update' -> оно улетит в MQTT
            if(currentPath.length > 1) {
                doc.transact(() => {
                    lines.push([{ color: '#fff', pts: currentPath }]);
                });
            }
        }

        canvas.addEventListener('mousedown', start);
        canvas.addEventListener('mousemove', move);
        canvas.addEventListener('mouseup', end);
        canvas.addEventListener('touchstart', start);
        canvas.addEventListener('touchmove', move, {passive:false});
        canvas.addEventListener('touchend', end);


        // === 3. MQTT LOGIC (Транспорт) ===
        const statusEl = document.getElementById('status');
        const client = new Paho.MQTT.Client(MQTT_BROKER, MQTT_PORT, "/mqtt", MY_ID);

        client.onConnectionLost = (e) => {
            statusEl.innerText = "DISCONNECTED";
            statusEl.style.color = "red";
            console.log("MQTT Lost:", e);
            setTimeout(connect, 2000); // Реконнект
        };

        client.onMessageArrived = (msg) => {
            try {
                const json = JSON.parse(msg.payloadString);
                if(json.f === MY_ID) return; // Игнорируем свои сообщения

                if(json.t === 'upd') {
                    // Пришел инкрементальный апдейт
                    const uint8 = fromBase64(json.d);
                    Y.applyUpdate(doc, uint8);
                } 
                else if (json.t === 'sync_req') {
                    // Кто-то новый вошел и просит данные. Отдаем всё что есть.
                    console.log("Кто-то просит Sync. Отправляю...");
                    const state = Y.encodeStateAsUpdate(doc);
                    sendMqtt({ t: 'upd', d: toBase64(state) });
                }
            } catch(e) { console.error(e); }
        };

        function connect() {
            statusEl.innerText = "CONNECTING...";
            client.connect({
                useSSL: true,
                onSuccess: () => {
                    statusEl.innerText = "ONLINE: " + ROOM_ID;
                    statusEl.style.color = "#00e676";
                    client.subscribe(`yjs-draw/${ROOM_ID}`);
                    
                    // Как только подключились — просим актуальное состояние у других
                    sendMqtt({ t: 'sync_req' });
                },
                onFailure: (e) => {
                    statusEl.innerText = "ERR: " + e.errorMessage;
                    statusEl.style.color = "red";
                }
            });
        }

        function sendMqtt(obj) {
            if(!client.isConnected()) return;
            obj.f = MY_ID;
            const m = new Paho.MQTT.Message(JSON.stringify(obj));
            m.destinationName = `yjs-draw/${ROOM_ID}`;
            client.send(m);
        }

        // Запуск
        connect();
        resize();

        // === HELPERS (Base64 <-> Uint8Array) ===
        function toBase64(u8) {
            return btoa(String.fromCharCode.apply(null, u8));
        }
        function fromBase64(str) {
            return new Uint8Array(atob(str).split('').map(c => c.charCodeAt(0)));
        }
        
        // Экспорт для консоли
        window.clearBoard = () => doc.transact(() => lines.delete(0, lines.length));

    </script>
    <style>
        body { margin:0; overflow:hidden; background:#111; font-family:monospace; }
        canvas { display:block; touch-action:none; }
        #ui { position:absolute; top:0; left:0; width:100%; padding:10px; pointer-events:none; display:flex; justify-content:space-between; box-sizing:border-box;}
        #status { background:rgba(0,0,0,0.8); color:orange; padding:5px 10px; border-radius:4px; }
        button { pointer-events:auto; padding:8px 15px; background:#d32f2f; color:white; border:none; border-radius:4px; font-weight:bold;}
    </style>
</head>
<body>
    <div id="ui">
        <div id="status">INIT...</div>
        <button onclick="clearBoard()">CLEAR</button>
    </div>
    <canvas id="can"></canvas>
</body>
</html>
