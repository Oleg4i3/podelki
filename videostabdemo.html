<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Симулятор цифровой стабилизации видео</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1e1e1e;
            color: #fff;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .video-box {
            background: #2a2a2a;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        canvas {
            background: #000;
            display: block;
            border: 1px solid #444;
        }
        .controls {
            margin: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            transition: 0.2s;
        }
        button:hover { background: #0056b3; }
        button:disabled { background: #555; cursor: not-allowed; }
        #loading {
            color: #ffcc00;
            font-weight: bold;
        }
        /* Скрытое видео для захвата потока */
        video { display: none; } 
    </style>
</head>
<body>

    <h1>Цифровая стабилизация (Static Scene Lock)</h1>
    <div id="loading">Загрузка OpenCV.js... Пожалуйста, подождите (это может занять несколько секунд).</div>
    
    <div class="controls">
        <button id="startBtn" disabled>Запустить камеру и стабилизацию</button>
        <button id="resetBtn" disabled>Сбросить якорь (Reference)</button>
    </div>

    <div class="container">
        <div class="video-box">
            <h3>Исходное видео (с кропом)</h3>
            <canvas id="canvasInput" width="480" height="360"></canvas>
        </div>
        <div class="video-box">
            <h3>Стабилизированное видео</h3>
            <canvas id="canvasOutput" width="480" height="360"></canvas>
        </div>
    </div>

    <video id="videoElement" width="640" height="480" autoplay playsinline></video>

    <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady();" type="text/javascript"></script>

    <script>
        const video = document.getElementById('videoElement');
        const canvasInput = document.getElementById('canvasInput');
        const canvasOutput = document.getElementById('canvasOutput');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const loadingMsg = document.getElementById('loading');

        let isStreaming = false;
        let referenceFrame = null;
        let template = null;
        
        // Настройки стабилизации
        const WIDTH = 640;
        const HEIGHT = 480;
        const CROP_RATIO = 0.75; // 75% от исходного кадра (агрессивный кроп)
        const CROP_W = WIDTH * CROP_RATIO;
        const CROP_H = HEIGHT * CROP_RATIO;
        
        // Размеры шаблона для поиска смещения (берем центр)
        const TMPL_W = 200;
        const TMPL_H = 200;

        function onOpenCvReady() {
            loadingMsg.style.display = 'none';
            startBtn.disabled = false;
        }

        startBtn.addEventListener('click', () => {
            if (!isStreaming) {
                startCamera();
            }
        });

        resetBtn.addEventListener('click', () => {
            // Сбрасываем якорь, чтобы захватить новый на следующем кадре
            if (referenceFrame) {
                referenceFrame.delete();
                template.delete();
                referenceFrame = null;
                template = null;
            }
        });

        function startCamera() {
            navigator.mediaDevices.getUserMedia({ video: { width: WIDTH, height: HEIGHT }, audio: false })
                .then(function(stream) {
                    video.srcObject = stream;
                    video.play();
                    isStreaming = true;
                    startBtn.disabled = true;
                    resetBtn.disabled = false;
                    
                    // Ждем пока видео начнет воспроизводиться
                    video.onloadeddata = () => {
                        processVideo();
                    };
                })
                .catch(function(err) {
                    console.error("Ошибка доступа к камере: ", err);
                    alert("Не удалось получить доступ к камере.");
                });
        }

        function processVideo() {
            if (!isStreaming) return;

            let src = new cv.Mat(HEIGHT, WIDTH, cv.CV_8UC4);
            let gray = new cv.Mat();
            let result = new cv.Mat();
            let mask = new cv.Mat();

            let cap = new cv.VideoCapture(video);

            const FPS = 30;

            function processFrame() {
                try {
                    if (!isStreaming) {
                        src.delete(); gray.delete(); result.delete(); mask.delete();
                        return;
                    }

                    let begin = Date.now();

                    // 1. Читаем кадр с камеры
                    cap.read(src);

                    // 2. Конвертируем в ЧБ для анализа
                    cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);

                    // 3. Захват референсного кадра (Якоря)
                    if (!referenceFrame) {
                        referenceFrame = gray.clone();
                        
                        // Вырезаем центральный кусок как шаблон (Template)
                        let rect = new cv.Rect((WIDTH - TMPL_W) / 2, (HEIGHT - TMPL_H) / 2, TMPL_W, TMPL_H);
                        template = referenceFrame.roi(rect).clone();
                    }

                    // 4. Ищем шаблон в текущем кадре
                    // Используем TM_CCOEFF_NORMED - отлично справляется со сдвигами освещенности
                    cv.matchTemplate(gray, template, result, cv.TM_CCOEFF_NORMED, mask);
                    let minMax = cv.minMaxLoc(result, mask);
                    
                    // minMax.maxLoc содержит координаты (x,y) левого верхнего угла найденного шаблона
                    let matchLoc = minMax.maxLoc;

                    // Вычисляем смещение относительно идеального центра
                    let dx = matchLoc.x - (WIDTH - TMPL_W) / 2;
                    let dy = matchLoc.y - (HEIGHT - TMPL_H) / 2;

                    // 5. Стабилизация: сдвигаем исходное изображение обратно на (-dx, -dy)
                    let M = cv.matFromArray(2, 3, cv.CV_64FC1, [1, 0, -dx, 0, 1, -dy]);
                    let stabilizedSrc = new cv.Mat();
                    let dsize = new cv.Size(WIDTH, HEIGHT);
                    
                    // Применяем аффинное преобразование (трансляцию)
                    cv.warpAffine(src, stabilizedSrc, M, dsize, cv.INTER_LINEAR, cv.BORDER_CONSTANT, new cv.Scalar(0, 0, 0, 255));

                    // 6. Кроп и вывод исходного видео (имитация того, что видит матрица, но выводим только кроп-зону)
                    let cropRect = new cv.Rect((WIDTH - CROP_W) / 2, (HEIGHT - CROP_H) / 2, CROP_W, CROP_H);
                    
                    let inputCropped = src.roi(cropRect);
                    let outputCropped = stabilizedSrc.roi(cropRect);

                    // Меняем размер для вывода на canvas, чтобы заполнить его
                    let outSize = new cv.Size(canvasInput.width, canvasInput.height);
                    let inputResized = new cv.Mat();
                    let outputResized = new cv.Mat();
                    
                    cv.resize(inputCropped, inputResized, outSize, 0, 0, cv.INTER_LINEAR);
                    cv.resize(outputCropped, outputResized, outSize, 0, 0, cv.INTER_LINEAR);

                    // Отрисовка на экраны
                    cv.imshow('canvasInput', inputResized);
                    cv.imshow('canvasOutput', outputResized);

                    // Очистка памяти кадра
                    M.delete();
                    stabilizedSrc.delete();
                    inputCropped.delete();
                    outputCropped.delete();
                    inputResized.delete();
                    outputResized.delete();

                    // Планируем следующий кадр
                    let delay = 1000 / FPS - (Date.now() - begin);
                    setTimeout(processFrame, delay > 0 ? delay : 0);

                } catch (err) {
                    console.error(err);
                }
            }

            // Запускаем цикл
            setTimeout(processFrame, 0);
        }
    </script>
</body>
</html>
